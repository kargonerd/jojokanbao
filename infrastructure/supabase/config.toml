project_id = "jojo-platform"

[auth]
site_url = "https://reader.jojokanbao.cn"
additional_redirect_urls = [
  "http://localhost:8080/account",
  "http://127.0.0.1:8080/account",
  "https://reader.jojokanbao.cn/account",
  "https://jojokanbao.cn/account",
]
enable_signup = true

[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "{{ .Token }} 是你的 JOJO 注册验证码"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ .Token }} 是你的 JOJO 密码重置验证码"
content_path = "./supabase/templates/recovery.html"

[auth.email.notification.password_changed]
enabled = true
subject = "你的 JOJO 账号密码已修改"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_require_signup_invitation"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false
