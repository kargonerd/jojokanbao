<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOJO 身份验证码</title></head>
  <body style="margin:0;background:#f3f3f1;color:#202020;font-family:Arial,'Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;background:#f3f3f1;">
      <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;border:1px solid #d8d3ca;background:#fffdf8;">
          <tr><td style="height:6px;background:#8b1a1a;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr><td style="padding:24px 32px;border-bottom:1px solid #d8d3ca;">
            <img src="https://reader.jojokanbao.cn/brand/jojo-kanbao-logo.png" width="180" alt="JOJO 看报" style="display:block;width:180px;max-width:100%;height:auto;border:0;">
          </td></tr>
          <tr><td style="padding:32px 32px 36px;">
            <div style="font-size:12px;font-weight:700;letter-spacing:.12em;color:#8b1a1a;">身份验证</div>
            <h1 style="margin:10px 0 12px;font-family:Georgia,'Noto Serif SC','Songti SC',serif;font-size:27px;line-height:1.45;color:#202020;">确认是你本人</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#4e4943;">请输入下面的 6 位验证码，继续完成账号安全操作。</p>
            <div style="border:1px solid #8b1a1a;padding:18px 12px 18px 20px;text-align:center;color:#8b1a1a;background:#f8f1ec;font-family:Consolas,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:.26em;white-space:nowrap;">{{ .Token }}</div>
            <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#70685f;">验证码将在短时间内失效，请勿转发给其他人。</p>
          </td></tr>
          <tr><td style="padding:18px 32px;border-top:1px solid #d8d3ca;font-size:12px;line-height:1.7;color:#7a746c;">如果这不是你的操作，请忽略这封邮件并检查账号安全。</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
