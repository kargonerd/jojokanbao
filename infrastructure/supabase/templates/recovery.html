<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOJO 密码重置验证码</title></head>
  <body style="margin:0;background:#f3f3f1;color:#202020;font-family:Arial,'Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f3f1;"><tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;border:1px solid #d8d3ca;background:#fffdf8;">
        <tr><td style="height:6px;background:#8b1a1a;"></td></tr>
        <tr><td style="padding:28px 36px 22px;border-bottom:1px solid #d8d3ca;"><strong style="font-family:Georgia,'Noto Serif SC',serif;font-size:24px;letter-spacing:.08em;">JOJO 看报</strong><div style="padding-top:7px;font-size:12px;letter-spacing:.16em;color:#70685f;">账号安全 · RECOVERY PROOF</div></td></tr>
        <tr><td style="padding:34px 36px 38px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:.16em;color:#8b1a1a;">身份校验</div>
          <h1 style="margin:10px 0 12px;font-family:Georgia,'Noto Serif SC','Songti SC',serif;font-size:28px;line-height:1.45;">重置你的密码</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#4e4943;">请回到找回密码页面输入下面的 6 位验证码。</p>
          <div style="border:2px solid #8b1a1a;padding:18px;text-align:center;color:#8b1a1a;background:#f8f1ec;font-family:Consolas,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:.28em;">{{ .Token }}</div>
          <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#70685f;">验证码 10 分钟内有效。如果不是你发起的请求，无需进行任何操作。</p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
