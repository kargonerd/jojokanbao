<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOJO PIPE · ES 数据修复</title>
<style>
:root{--red:#8b1a1a;--ink:#202020;--paper:#fff;--line:#d8d1c7;--muted:#706b65;--wash:#f5f0e9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font-family:"Noto Serif SC","Songti SC",serif}header{display:flex;justify-content:space-between;align-items:center;padding:22px 34px;background:var(--paper);border-bottom:4px solid var(--red)}h1,h2,p{margin:0}.brand{font-size:23px;font-weight:800}.brand b,a{color:var(--red)}main{max-width:1440px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:420px 1fr;gap:20px}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:5px 5px 0 rgba(139,26,26,.1)}.panel-head{padding:16px 20px;border-bottom:1px solid var(--line)}.panel-body{padding:20px}.status{font:13px system-ui;color:var(--muted)}.status.ok{color:#177245}.status.bad{color:var(--red)}label{display:block;margin:14px 0 6px;font:700 13px system-ui}input,textarea{width:100%;padding:10px 11px;border:1px solid #aaa;border-radius:0;background:#fff;font:14px system-ui}textarea{min-height:180px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:10px 16px;border:1px solid var(--red);border-radius:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--red)}button.danger{background:#202020;border-color:#202020}button:disabled{opacity:.45;cursor:not-allowed}.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.results{margin-top:16px;max-height:680px;overflow:auto}.result{padding:14px 2px;border-top:1px solid var(--line);cursor:pointer}.result:hover{background:#fff8f4}.result.active{border-left:5px solid var(--red);padding-left:12px}.title{font-weight:800}.meta{margin-top:5px;color:var(--muted);font:12px system-ui}.snippet{margin-top:8px;font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;margin-top:18px}.note{margin-top:14px;padding:12px;background:#fff6d9;border-left:4px solid #d49b18;font:13px/1.6 system-ui}#message{margin-top:12px;font:13px/1.5 system-ui}.empty{padding:50px 10px;text-align:center;color:var(--muted)}@media(max-width:900px){main{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/static/jojo-editorial.css"></head><body class="workspace-body">
<div class="workspace-shell">
{% set active_module = 'es' %}
{% include '_workspace_nav.html' %}
<section class="workspace-surface">
<header class="workspace-topbar"><div><p class="workspace-eyebrow">SEARCH DATA / 搜索数据</p><div class="brand">ES 数据管理</div><div class="status" id="status">正在检查连接…</div></div><a href="/">返回总览</a></header>
<main><section class="panel"><div class="panel-head"><h2>1. 找到当前文档</h2></div><div class="panel-body"><div class="searchbar"><input id="query" placeholder="标题、正文或来源"><button id="search">搜索</button></div><div class="results" id="results"><div class="empty">输入关键词，或直接搜索查看最近文档</div></div></div></section>
<section class="panel"><div class="panel-head"><h2>2. 追加修复版本</h2></div><div class="panel-body">
<label>当前 documentId</label><input id="documentId" readonly placeholder="请先选择左侧文档"><label>标题</label><input id="title"><label>正文</label><textarea id="content"></textarea>
<div class="row"><div><label>日期</label><input id="date"></div><div><label>页码</label><input id="page" type="number"></div></div><label>来源</label><input id="source"><label>修复原因</label><input id="reason" placeholder="例如：读者反馈第 3 段错字">
<div class="actions"><button id="repair" disabled>确认追加修复</button><button class="danger" id="remove" disabled>标记删除</button><button class="secondary" id="clear">清空</button></div>
<div class="note">修复原因只保存在本地 migration 文件，不会写入 ES。ES 仅追加搜索所需的新版本/墓碑；新数据通常需要几十秒后才能被搜索到。</div><div id="message"></div>
<div style="margin-top:24px;border-top:1px solid var(--line);padding-top:16px"><h2 style="font-size:16px">最近 migrations</h2><div id="migrations" class="status" style="margin-top:10px">正在读取…</div></div>
</div></section></main>
</section></div>
<script>
const $=id=>document.getElementById(id),fields=["title","content","date","page","source"];let selected=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"请求失败");return j}
async function status(){try{const r=await api("/api/es-repair/status");$("status").textContent=`已连接 · ${r.index} · 当前有效文档 ${r.activeDocuments}`;$("status").className="status ok"}catch(e){$("status").textContent=e.message;$("status").className="status bad"}}
async function migrations(){try{const r=await api("/api/es-repair/migrations");$("migrations").innerHTML=r.items.length?r.items.slice(0,8).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(x.operation==="delete"?"删除":"修复")}</b> · ${esc(x.state)} ${x.state==="pending"?`<button class="secondary" style="padding:3px 8px;margin-left:6px" onclick="replay('${x.id}')">重试</button>`:""}<br><code>${esc(x.file)}</code><br>${esc(x.reason||"未填写原因")}</div>`).join(""):"尚无 migration 文件"}catch(e){$("migrations").textContent=e.message}}
async function replay(id){try{await api(`/api/es-repair/migrations/${id}/apply`,{});await migrations();await status()}catch(e){alert(e.message)}}
async function search(){$("results").innerHTML='<div class="empty">搜索中…</div>';try{const r=await api("/api/es-repair/search",{query:$("query").value,size:30});$("results").innerHTML=r.items.length?r.items.map((x,i)=>`<div class="result" data-i="${i}"><div class="title">${esc(x.title||"(无标题)")}</div><div class="meta">${esc(x.date||"")} · ${esc(x.source||"")} · ID ${esc(x.documentId)}</div><div class="snippet">${esc((x.content||"").slice(0,160))}</div></div>`).join(""):'<div class="empty">没有有效文档</div>';document.querySelectorAll(".result").forEach(el=>el.onclick=()=>select(r.items[+el.dataset.i],el))}catch(e){$("results").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function select(item,el){selected=item;document.querySelectorAll(".result").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("documentId").value=item.documentId;fields.forEach(k=>$(k).value=item[k]??"");$("repair").disabled=$("remove").disabled=false;$("message").textContent=""}
function clear(){selected=null;$("documentId").value="";fields.forEach(k=>$(k).value="");$("reason").value="";$("repair").disabled=$("remove").disabled=true;document.querySelectorAll(".result").forEach(x=>x.classList.remove("active"))}
async function apply(deleted){if(!selected)return;if(!confirm((deleted?"把这篇文档标记为删除？":"追加这个修复版本？")+" 系统会先生成本地 migration。"))return;const document=Object.fromEntries(fields.map(k=>[k,$(k).value]));if(document.page!=="")document.page=Number(document.page);try{$("message").textContent="正在生成并执行 migration…";const r=await api("/api/es-repair/apply",{supersedesId:selected.documentId,document,deleted,reason:$("reason").value,confirm:true});alert(`${r.message}\nmigration：${r.migration.id}\n新 documentId：${r.documentId}${r.alreadyExists?"（此前已提交）":""}`);clear();migrations()}catch(e){$("message").textContent=e.message}}
$("search").onclick=search;$("query").onkeydown=e=>{if(e.key==="Enter")search()};$("repair").onclick=()=>apply(false);$("remove").onclick=()=>apply(true);$("clear").onclick=clear;status();migrations();
</script></body></html>
