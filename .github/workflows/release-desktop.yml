name: Release · Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: release
        name: Validate tag and public configuration
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

          package_version="$(node -p "require('./frontend/desktop/package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            echo "Prerelease versions are not published; use a stable SemVer version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            tag_version="${GITHUB_REF_NAME#desktop-v}"
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match desktop package version $package_version." >&2
              exit 1
            fi

            test -n "$B2_KEY_ID"
            test -n "$B2_APPLICATION_KEY"
            test -n "$B2_BUCKET"
          fi

          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build · ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: desktop-windows-x64
            feed: win-x64
            builder_args: --win nsis --x64
          - label: macOS Apple Silicon
            os: macos-latest
            artifact: desktop-macos-arm64
            feed: mac-arm64
            builder_args: --mac dmg zip --arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: desktop-macos-x64
            feed: mac-x64
            builder_args: --mac dmg zip --x64
          - label: Linux x64
            os: ubuntu-latest
            artifact: desktop-linux-x64
            feed: linux-x64
            builder_args: --linux AppImage deb --x64
    env:
      JOJO_RELEASE_CDN_BASE: ${{ vars.DOWNLOAD_CDN_BASE || 'https://blacknews.jojokanbao.cn' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @jojo/desktop build

      - name: Package desktop app
        shell: bash
        run: pnpm --filter @jojo/desktop exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            frontend/desktop/release/*.exe
            frontend/desktop/release/*.blockmap
            frontend/desktop/release/*.dmg
            frontend/desktop/release/*.zip
            frontend/desktop/release/*.AppImage
            frontend/desktop/release/*.deb
            frontend/desktop/release/*.yml

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release

      - name: Prepare public release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p github-release
          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} github-release/ \;
          cd github-release
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

          node ../tools/release/create-release-catalog.mjs \
            --product desktop \
            --channel stable \
            --version "${{ needs.validate.outputs.version }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "${{ vars.DOWNLOAD_CDN_BASE || 'https://blacknews.jojokanbao.cn' }}" \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --input ../release \
            --output ../desktop-catalog.json

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#desktop-v}"
          release_flags=(--verify-tag --generate-notes --title "JOJO看报 Desktop ${release_version}")
          release_flags+=(--draft)
          release_flags+=(--notes "⚠️ 当前桌面安装包尚未进行 Windows/macOS 代码签名。Windows 和 macOS 首次打开时会显示系统安全提示；macOS 暂不支持应用内自动更新，请从官网下载新版。")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" github-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" github-release/* "${release_flags[@]}"
          fi

      - name: Publish immutable artifacts to B2
        env:
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone config create jojo-b2 b2 account "$B2_KEY_ID" key "$B2_APPLICATION_KEY" --non-interactive

          for mapping in \
            'desktop-windows-x64:win-x64' \
            'desktop-macos-arm64:mac-arm64' \
            'desktop-macos-x64:mac-x64' \
            'desktop-linux-x64:linux-x64'; do
            artifact="${mapping%%:*}"
            feed="${mapping#*:}"
            source="release/$artifact"
            target="jojo-b2:$B2_BUCKET/releases/desktop/stable/$feed"
            rclone copy "$source" "$target" --immutable --exclude '*.yml'
            rclone check "$source" "$target" --one-way --exclude '*.yml'
          done

      - name: Verify installers through CDN
        env:
          CATALOG: desktop-catalog.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cdn-verify"
          jq -c '.artifacts[]' "$CATALOG" | while read -r artifact; do
            url="$(jq -r '.url' <<< "$artifact")"
            expected="$(jq -r '.sha256' <<< "$artifact")"
            target="$RUNNER_TEMP/cdn-verify/$(jq -r '.id' <<< "$artifact")"
            curl --fail --location --retry 5 --output "$target" "$url?release=$GITHUB_SHA"
            actual="$(sha256sum "$target" | cut -d' ' -f1)"
            test "$actual" = "$expected"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Publish update pointers
        env:
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rclone config create jojo-b2 b2 account "$B2_KEY_ID" key "$B2_APPLICATION_KEY" --non-interactive
          for mapping in \
            'desktop-windows-x64:win-x64' \
            'desktop-macos-arm64:mac-arm64' \
            'desktop-macos-x64:mac-x64' \
            'desktop-linux-x64:linux-x64'; do
            artifact="${mapping%%:*}"
            feed="${mapping#*:}"
            metadata="$(find "release/$artifact" -maxdepth 1 -type f -name '*.yml' -print -quit)"
            test -n "$metadata"
            rclone copyto "$metadata" "jojo-b2:$B2_BUCKET/releases/desktop/stable/$feed/$(basename "$metadata")"
          done
          rclone copyto desktop-catalog.json "jojo-b2:$B2_BUCKET/releases/desktop/stable/catalog.json"
          rclone copyto github-release/SHA256SUMS.txt "jojo-b2:$B2_BUCKET/releases/desktop/stable/SHA256SUMS.txt"

      - name: Verify published catalog
        shell: bash
        run: |
          set -euo pipefail
          catalog_url="${{ vars.DOWNLOAD_CDN_BASE || 'https://blacknews.jojokanbao.cn' }}/releases/desktop/stable/catalog.json?release=$GITHUB_SHA"
          for attempt in $(seq 1 12); do
            published_version="$(curl --fail --silent --show-error "$catalog_url" | jq -r '.version' || true)"
            if [[ "$published_version" == "${{ needs.validate.outputs.version }}" ]]; then break; fi
            test "$attempt" -lt 12
            sleep 10
          done
          test "$published_version" = "${{ needs.validate.outputs.version }}"
          node tools/release/verify-release-cdn.mjs \
            --catalog "$catalog_url" \
            --version "${{ needs.validate.outputs.version }}" \
            --origin https://reader.jojokanbao.cn
