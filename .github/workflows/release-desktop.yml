name: Release · Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate tag and public configuration
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            package_version="$(node -p "require('./frontend/desktop/package.json').version")"
            tag_version="${GITHUB_REF_NAME#desktop-v}"
            if [[ "$tag_version" != "$package_version" && "$tag_version" != "$package_version"-* ]]; then
              echo "Tag $GITHUB_REF_NAME does not match desktop package version $package_version." >&2
              exit 1
            fi
          fi

  build:
    name: Build · ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: desktop-windows-x64
            builder_args: --win nsis --x64
          - label: macOS Apple Silicon
            os: macos-latest
            artifact: desktop-macos-arm64
            builder_args: --mac dmg zip --arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: desktop-macos-x64
            builder_args: --mac dmg zip --x64
          - label: Linux x64
            os: ubuntu-latest
            artifact: desktop-linux-x64
            builder_args: --linux AppImage deb --x64
    env:
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @jojo/desktop build

      - name: Package desktop app
        shell: bash
        run: pnpm --filter @jojo/desktop exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            frontend/desktop/release/*.exe
            frontend/desktop/release/*.dmg
            frontend/desktop/release/*.zip
            frontend/desktop/release/*.AppImage
            frontend/desktop/release/*.deb

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#desktop-v}"
          release_flags=(--verify-tag --generate-notes --title "JOJO看报 Desktop ${release_version}")
          if [[ "$release_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${release_flags[@]}"
