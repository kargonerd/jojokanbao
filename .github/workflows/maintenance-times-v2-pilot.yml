name: Maintenance · Times v2 all-media validation

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: Discovery window in hours
        type: string
        default: "24"
        required: true
      sources:
        description: Optional comma-separated source ids
        type: string
        default: ""
        required: false
      max_pages:
        description: Maximum representative Chromium pages
        type: string
        default: "22"
        required: true

permissions:
  contents: read

concurrency:
  group: times-v2-all-media-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 30
    env:
      JOJO_TIMES_PROXY_SUBSCRIPTION: ${{ secrets.JOJO_TIMES_PROXY_SUBSCRIPTION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r tools/times-pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Start pinned Mihomo for a configured subscription
        if: env.JOJO_TIMES_PROXY_SUBSCRIPTION != ''
        env:
          MIHOMO_VERSION: 1.19.30
          MIHOMO_SHA256: cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84
        run: |
          mkdir -p "$RUNNER_TEMP/mihomo"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz" \
            -o "$RUNNER_TEMP/mihomo/mihomo.gz"
          echo "$MIHOMO_SHA256  $RUNNER_TEMP/mihomo/mihomo.gz" | sha256sum -c -
          gzip -d "$RUNNER_TEMP/mihomo/mihomo.gz"
          chmod 700 "$RUNNER_TEMP/mihomo/mihomo"
          python tools/times-pipeline/prepare_proxy.py --output "$RUNNER_TEMP/mihomo/config.yaml"
          nohup "$RUNNER_TEMP/mihomo/mihomo" -d "$RUNNER_TEMP/mihomo" -f "$RUNNER_TEMP/mihomo/config.yaml" \
            > "$RUNNER_TEMP/mihomo/runtime.log" 2>&1 &
          for attempt in $(seq 1 12); do
            if curl --proxy http://127.0.0.1:7890 --max-time 8 -fsS -o /dev/null https://www.gstatic.com/generate_204; then
              echo "JOJO_TIMES_PROXY_URI=http://127.0.0.1:7890" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "Mihomo did not expose a healthy local proxy" >&2
          exit 1

      - name: Verify pinned BPC extension
        env:
          BPC_REVISION: 587dcfd3d3b18652607e37d3d401430e85f8c8ec
          BPC_SHA256: 1db1c0d424f2ca1f8b9c88b91789ea68b7732969023cb23f82b263c060a6ce59
        run: |
          archive="tools/times-pipeline/vendor/bpc/bypass-paywalls-chrome-clean.zip"
          echo "$BPC_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/bpc"
          echo "BPC_EXTENSION_PATH=$RUNNER_TEMP/bpc/bypass-paywalls-chrome-clean-master" >> "$GITHUB_ENV"
          echo "BPC_REVISION=$BPC_REVISION" >> "$GITHUB_ENV"

      - name: Verify and build the v2 pipeline
        run: |
          pnpm --filter @jojo/times-pipeline typecheck
          pnpm --filter @jojo/times-pipeline test
          pnpm --filter @jojo/times-pipeline build

      - name: Capture selected or all enabled sources
        env:
          TIMES_SINCE_HOURS: ${{ inputs.since_hours }}
          TIMES_SOURCES: ${{ inputs.sources }}
          TIMES_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times-v2"
            --since-hours "$TIMES_SINCE_HOURS"
            --workers 3
          )
          if [ -n "$TIMES_SOURCES" ]; then
            args+=(--sources "$TIMES_SOURCES")
          fi
          node tools/times-pipeline/dist/src/capture-cli.js "${args[@]}" > "$RUNNER_TEMP/capture-result.json"

      - name: Resolve capture manifest
        run: |
          node -e 'const fs=require("node:fs");const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/capture-result.json","utf8"));fs.appendFileSync(process.env.GITHUB_ENV,"TIMES_RUN_MANIFEST="+result.runManifest+"\n")'

      - name: Archive a representative page from every source with BPC
        env:
          TIMES_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times-v2"
            --run-manifest "$TIMES_RUN_MANIFEST"
            --engine browser
            --max-pages "$TIMES_MAX_PAGES"
            --workers 8
            --timeout 25
            --maximum-response-bytes 5000000
            --maximum-page-bytes 25000000
            --refresh-hours 24
            --retry-hours 2
            --browser-extension-path "$BPC_EXTENSION_PATH"
            --browser-extension-revision "$BPC_REVISION"
            --headed
          )
          if [ -n "$JOJO_TIMES_PROXY_URI" ]; then
            args+=(
              --proxy-server "$JOJO_TIMES_PROXY_URI"
              --proxy-control-url http://127.0.0.1:9090
              --proxy-rotation-attempts 12
              --proxy-retry-timeout 12
            )
          fi
          xvfb-run -a python tools/times-pipeline/archive_v2.py "${args[@]}" > "$RUNNER_TEMP/archive-result.json"

      - name: Build Canonical validation output
        run: >-
          node tools/times-pipeline/dist/src/process-cli.js
          --config tools/times-pipeline/sources.v2.json
          --output "$RUNNER_TEMP/jojo-times-v2"
          --run-manifest "$TIMES_RUN_MANIFEST"
          --raw-revision "github:${{ github.sha }}:${{ github.run_id }}"

      - name: Build auditable Delivery output
        run: >-
          node tools/times-pipeline/dist/src/delivery-cli.js
          --config tools/times-pipeline/sources.v2.json
          --output "$RUNNER_TEMP/jojo-times-v2"
          --run-manifest "$TIMES_RUN_MANIFEST"
          --delivery-output "$RUNNER_TEMP/jojo-times-delivery"

      - name: Upload private validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-v2-all-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times-v2
            ${{ runner.temp }}/jojo-times-delivery
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: true
