name: Maintenance · Times v2 all-media validation

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: Discovery window in hours
        type: string
        default: "24"
        required: true
      sources:
        description: Optional comma-separated source ids
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: times-v2-all-media-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build the v2 pipeline
        run: |
          pnpm --filter @jojo/times-pipeline typecheck
          pnpm --filter @jojo/times-pipeline test
          pnpm --filter @jojo/times-pipeline build

      - name: Capture selected or all enabled sources
        env:
          TIMES_SINCE_HOURS: ${{ inputs.since_hours }}
          TIMES_SOURCES: ${{ inputs.sources }}
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times-v2"
            --since-hours "$TIMES_SINCE_HOURS"
            --workers 3
          )
          if [ -n "$TIMES_SOURCES" ]; then
            args+=(--sources "$TIMES_SOURCES")
          fi
          node tools/times-pipeline/dist/src/capture-cli.js "${args[@]}" > "$RUNNER_TEMP/capture-result.json"

      - name: Resolve capture manifest
        run: |
          node -e 'const fs=require("node:fs");const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/capture-result.json","utf8"));fs.appendFileSync(process.env.GITHUB_ENV,"TIMES_RUN_MANIFEST="+result.runManifest+"\n")'

      - name: Build Canonical validation output
        run: >-
          node tools/times-pipeline/dist/src/process-cli.js
          --config tools/times-pipeline/sources.v2.json
          --output "$RUNNER_TEMP/jojo-times-v2"
          --run-manifest "$TIMES_RUN_MANIFEST"
          --raw-revision "github:${{ github.sha }}:${{ github.run_id }}"

      - name: Build auditable Delivery output
        run: >-
          node tools/times-pipeline/dist/src/delivery-cli.js
          --config tools/times-pipeline/sources.v2.json
          --output "$RUNNER_TEMP/jojo-times-v2"
          --run-manifest "$TIMES_RUN_MANIFEST"
          --delivery-output "$RUNNER_TEMP/jojo-times-delivery"

      - name: Upload private validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-v2-all-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times-v2
            ${{ runner.temp }}/jojo-times-delivery
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
