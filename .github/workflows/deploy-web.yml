name: Deploy · Web

on:
  push:
    branches:
      - master
    tags:
      - "reader-v*"
      - "reader-*"
    paths:
      - ".github/workflows/deploy-web.yml"
      - ".npmrc"
      - "backend/**"
      - "frontend/packages/**"
      - "frontend/patches/**"
      - "frontend/tooling/tsconfig/**"
      - "frontend/web/**"
      - "infrastructure/edgeone/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      environment:
        description: EdgeOne Makers deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      verify_base_url:
        description: Optional deployed URL to verify (for example, a Makers preview URL)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/master' && 'preview' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/master' && 'preview' || 'production' }}
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'jojo-reader' }}
      EDGEONE_DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/master' && 'preview' || 'production' }}
      EDGEONE_UPLOAD_FROM_PATH: ./.edgeone/web-deploy/
      # Relevant master changes automatically publish the public Beta channel.
      # Production tags remain stable until its redesign flag is enabled.
      VITE_ENABLE_PLATFORM_REDESIGN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && 'true' || vars.VITE_ENABLE_PLATFORM_REDESIGN || 'false' }}
      VITE_RELEASE_CHANNEL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && 'beta' || 'stable' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CONTENT_CDN_BASE: ${{ vars.VITE_CONTENT_CDN_BASE || 'https://blacknews.jojokanbao.cn/' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @jojo/web build

      - name: Verify deployable PDF worker
        run: pnpm --filter @jojo/web verify:build

      - name: Prepare Web and Cloud API deployment
        run: pnpm prepare:web-deploy

      - name: Prepare web deployment
        run: |
          test -n "$EDGEONE_API_TOKEN" || (echo "EDGEONE_API_TOKEN is not configured" >&2 && exit 1)
          find "$EDGEONE_UPLOAD_FROM_PATH" -name "*.map" -delete

      - name: Deploy to EdgeOne Makers
        run: >-
          pnpm dlx edgeone@1.6.14 makers deploy "$EDGEONE_UPLOAD_FROM_PATH"
          --name "$EDGEONE_PROJECT_NAME"
          --token "$EDGEONE_API_TOKEN"
          --env "$EDGEONE_DEPLOY_ENV"

      - name: Verify deployed web assets
        if: ${{ inputs.verify_base_url != '' || (env.EDGEONE_DEPLOY_ENV == 'preview' && vars.EDGEONE_BETA_BASE_URL != '') || (env.EDGEONE_DEPLOY_ENV == 'production' && vars.EDGEONE_READER_BASE_URL != '') }}
        env:
          READER_BASE_URL: ${{ inputs.verify_base_url || (env.EDGEONE_DEPLOY_ENV == 'preview' && vars.EDGEONE_BETA_BASE_URL) || vars.EDGEONE_READER_BASE_URL }}
          READER_DEPLOY_REVISION: ${{ github.sha }}
        run: node frontend/web/scripts/verify-deployment.mjs

      - name: Report deferred deployment verification
        if: ${{ inputs.verify_base_url == '' && ((env.EDGEONE_DEPLOY_ENV == 'preview' && vars.EDGEONE_BETA_BASE_URL == '') || (env.EDGEONE_DEPLOY_ENV == 'production' && vars.EDGEONE_READER_BASE_URL == '')) }}
        run: echo "::notice::Deployment uploaded. Set the matching EDGEONE_BETA_BASE_URL or EDGEONE_READER_BASE_URL variable for automatic verification."
