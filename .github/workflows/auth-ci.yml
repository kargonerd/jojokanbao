name: Auth CI

on:
  push:
    branches: [master]
    paths:
      - "packages/auth/**"
      - "supabase/migrations/**"
      - "tooling/tsconfig/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/auth-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/auth/**"
      - "supabase/migrations/**"
      - "tooling/tsconfig/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/auth-ci.yml"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/auth typecheck
      - run: pnpm --filter @jojo/auth test
