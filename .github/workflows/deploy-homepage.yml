name: Deploy · Homepage

on:
  push:
    branches: [master]
    paths:
      - "frontend/homepage/**"
      - "content/blog/**"
      - "frontend/packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-homepage.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: EdgeOne Makers deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_HOMEPAGE_PROJECT_NAME || 'jojo-homepage' }}
      EDGEONE_DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      EDGEONE_UPLOAD_FROM_PATH: ./frontend/homepage/dist/
      HOMEPAGE_BASE_URL: ${{ vars.EDGEONE_HOMEPAGE_BASE_URL || 'https://jojokanbao.cn' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build homepage
        run: pnpm --filter @jojo/homepage build

      - name: Verify homepage build
        run: pnpm --filter @jojo/homepage verify:build

      - name: Add deployment revision
        run: printf '%s\n' "$GITHUB_SHA" > "$EDGEONE_UPLOAD_FROM_PATH/deployment.txt"

      - name: Verify deployment configuration
        run: test -n "$EDGEONE_API_TOKEN" || (echo "EDGEONE_API_TOKEN is not configured" >&2 && exit 1)

      - name: Deploy to EdgeOne Makers
        shell: bash
        run: |
          set +e
          deploy_output="$(
            pnpm dlx edgeone@1.6.14 makers deploy "$EDGEONE_UPLOAD_FROM_PATH" \
              --name "$EDGEONE_PROJECT_NAME" \
              --token "$EDGEONE_API_TOKEN" \
              --env "$EDGEONE_DEPLOY_ENV" \
              --area global 2>&1
          )"
          deploy_status=$?
          set -e

          printf '%s\n' "$deploy_output"

          if [ "$deploy_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$EDGEONE_DEPLOY_ENV" = "production" ] && grep -q "Deploy Success" <<< "$deploy_output"; then
            echo "::warning::EdgeOne completed the deployment but its follow-up status query failed; verifying the published revision instead."
            exit 0
          fi

          exit "$deploy_status"

      - name: Verify production revision
        if: env.EDGEONE_DEPLOY_ENV == 'production'
        shell: bash
        run: |
          revision_url="${HOMEPAGE_BASE_URL%/}/deployment.txt?revision=$GITHUB_SHA"

          for attempt in $(seq 1 18); do
            deployed_revision="$(curl --fail --silent --show-error --max-time 15 "$revision_url" || true)"

            if [ "$deployed_revision" = "$GITHUB_SHA" ]; then
              echo "Verified production revision $GITHUB_SHA"
              exit 0
            fi

            if [ "$attempt" -lt 18 ]; then
              echo "Production revision is not current yet (attempt $attempt/18); retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "Production did not publish revision $GITHUB_SHA" >&2
          exit 1
