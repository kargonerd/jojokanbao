name: Deploy · Agent International

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      environment:
        description: EdgeOne Makers deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_AGENT_PROJECT_NAME || 'jojo-agent-global' }}
      EDGEONE_DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      EDGEONE_UPLOAD_FROM_PATH: ./.edgeone/agent-deploy/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare international Agent deployment
        run: pnpm prepare:agent-deploy

      - name: Validate deployment credentials
        run: test -n "$EDGEONE_API_TOKEN" || (echo "EDGEONE_API_TOKEN is not configured" >&2 && exit 1)

      - name: Deploy to EdgeOne Makers
        id: edgeone_deploy
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm dlx edgeone@1.6.14 makers deploy "$EDGEONE_UPLOAD_FROM_PATH" \
            --name "$EDGEONE_PROJECT_NAME" \
            --token "$EDGEONE_API_TOKEN" \
            --env "$EDGEONE_DEPLOY_ENV" 2>&1 | tee "$RUNNER_TEMP/edgeone-deploy.log"

      - name: Diagnose failed EdgeOne deployment
        if: steps.edgeone_deploy.outcome == 'failure'
        run: |
          project_id="$(grep -oE 'makers-[a-z0-9]+' "$RUNNER_TEMP/edgeone-deploy.log" | tail -1)"
          deployment_id="$(grep -oE 'Deployment ID: [a-z0-9]+' "$RUNNER_TEMP/edgeone-deploy.log" | tail -1 | awk '{print $3}')"
          test -n "$project_id" || (echo "Project ID was not reported" >&2 && exit 1)
          test -n "$deployment_id" || (echo "Deployment ID was not reported" >&2 && exit 1)
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $EDGEONE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"Action\":\"DescribePagesDeployments\",\"ProjectId\":\"$project_id\",\"Offset\":0,\"Limit\":50,\"OrderBy\":\"CreatedOn\",\"Order\":\"Desc\"}" \
            https://pages-api.cloud.tencent.com/v1)"
          jq --arg deployment_id "$deployment_id" \
            '.Data.Response.Deployments[] | select(.DeploymentId == $deployment_id)' \
            <<<"$response"
          log_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $EDGEONE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"Action\":\"DescribePagesDeploymentLog\",\"ProjectId\":\"$project_id\",\"DeploymentId\":\"$deployment_id\"}" \
            https://pages-api.cloud.tencent.com/v1)"
          log_url="$(jq -er '.Data.Response.LogUrl' <<<"$log_response")"
          curl --fail-with-body --silent --show-error "$log_url"
          exit 1

      - name: Verify deployed Agent routes
        if: steps.edgeone_deploy.outcome == 'success'
        run: |
          sed -E $'s/\033\[[0-9;]*[mK]//g' "$RUNNER_TEMP/edgeone-deploy.log" > "$RUNNER_TEMP/edgeone-deploy-clean.log"
          deploy_url="$(grep -oE 'https://[^[:space:]]+\.edgeone\.dev\?eo_token=[^[:space:]]+' "$RUNNER_TEMP/edgeone-deploy-clean.log" | tail -1)"
          test -n "$deploy_url" || (echo "Deploy URL was not reported" >&2 && exit 1)
          base_url="${deploy_url%%\?*}"
          query="${deploy_url#*\?}"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/agent-health.json" \
            --write-out '%{http_code}' \
            --header 'Makers-Conversation-Id: jojo-deploy-health' \
            "$base_url/api/chat?$query")"
          cat "$RUNNER_TEMP/agent-health.json"
          test "$status" != "404" || (echo "Agent proxy route is missing" >&2 && exit 1)
