name: Monitor · AI Availability

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ai-healthcheck/**'
      - '.github/workflows/monitor-ai.yml'

permissions:
  contents: read

concurrency:
  group: ai-availability-${{ github.event_name == 'pull_request' && github.event.number || 'live' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: node --test tools/ai-healthcheck/probe.test.mjs

  probe:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Verify authenticated model generation and report outcome
        run: node tools/ai-healthcheck/run.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          JOJO_AI_MONITOR_EMAIL: ${{ secrets.JOJO_AI_MONITOR_EMAIL }}
          JOJO_AI_MONITOR_PASSWORD: ${{ secrets.JOJO_AI_MONITOR_PASSWORD }}
          JOJO_AI_HEALTHCHECK_PING_URL: ${{ secrets.JOJO_AI_HEALTHCHECK_PING_URL }}
