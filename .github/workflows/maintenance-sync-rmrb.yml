name: Maintenance · Sync RMRB daily PDF
run-name: >-
  ${{ inputs.automatic && 'RMRB sync [cloudflare-cron]' || 'RMRB sync [manual]' }}

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Internal flag for the external Cloudflare scheduler
        required: true
        default: false
        type: boolean
      date:
        description: "Date to sync as YYYYMMDD. Empty means today."
        required: false
        type: string
      force:
        description: "Overwrite the remote PDF if it already exists."
        required: false
        default: false
        type: boolean
      scheduled_at:
        description: Scheduled slot time supplied by Cloudflare
        required: false
        default: ""
        type: string
      schedule_slot:
        description: Stable scheduler slot id supplied by Cloudflare
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rmrb-sync
  cancel-in-progress: false

jobs:
  sync-rmrb:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      B2_REMOTE: jojo-b2
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RMRB_REVIEW_HF_REPO: ${{ vars.RMRB_REVIEW_HF_REPO || 'luoxiaozhuang/marxism-dataset' }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
      HEALTHCHECKS_REPORT_MODE: buffered
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate external scheduler inputs
        if: ${{ inputs.automatic }}
        shell: bash
        run: |
          source tools/monitoring/classify-permanent.sh
          if ! [[ "${{ inputs.date }}" =~ ^[0-9]{8}$ ]] \
            || [ -z "${{ inputs.scheduled_at }}" ] \
            || [ -z "${{ inputs.schedule_slot }}" ] \
            || [ "${{ inputs.force }}" = "true" ]; then
            echo "Automatic runs require date, scheduled_at, and schedule_slot, and cannot force overwrite." >&2
            exit 1
          fi

      - name: Report automatic RMRB execution start
        if: ${{ inputs.automatic }}
        continue-on-error: true
        env:
          HEALTHCHECKS_SIGNAL: log
          HEALTHCHECKS_TASK_ID: rmrb-sync
          HEALTHCHECKS_STAGE: rmrb-sync
          HEALTHCHECKS_STATUS: running
          HEALTHCHECKS_SCHEDULED_AT: ${{ inputs.scheduled_at }}
          HEALTHCHECKS_SLOT_ID: ${{ inputs.schedule_slot }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf rclone

      - name: Install Python dependencies
        run: pip install -r tools/archive-pdf/requirements.txt

      - name: Sync RMRB PDF
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          else
            args+=(--catch-up --reuse-legacy)
          fi
          python tools/archive-pdf/sync_rmrb.py "${args[@]}"

      - name: Purge Delivery metadata and verify published Jox ranges
        if: ${{ !cancelled() }}
        run: |
          report=".rmrb-sync-work/publication.json"
          if [ ! -f "$report" ]; then exit 0; fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const rows = JSON.parse(readFileSync('.rmrb-sync-work/publication.json', 'utf8')).filter(row => row.published);
          const keys = [...new Set(rows.flatMap(row => [row.manifest, row.index]))];
          if (keys.length) {
            const result = spawnSync(process.execPath, ['tools/archive-pdf/purge-cache.mjs', ...keys.map(key => `https://blacknews.jojokanbao.cn/${key}`)], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status || 1);
          }
          NODE
          python tools/archive-pdf/verify_delivery.py "$report"

      - name: Report automatic RMRB sync outcome
        if: ${{ always() && inputs.automatic }}
        continue-on-error: true
        env:
          HEALTHCHECKS_SIGNAL: ${{ job.status == 'success' && 'success' || 'fail' }}
          HEALTHCHECKS_TASK_ID: rmrb-sync
          HEALTHCHECKS_STAGE: rmrb-sync
          HEALTHCHECKS_STATUS: ${{ job.status }}
          HEALTHCHECKS_FAILURE_TYPE: ${{ job.status != 'success' && 'run-failed' || '' }}
          HEALTHCHECKS_SCHEDULED_AT: ${{ inputs.scheduled_at }}
          HEALTHCHECKS_SLOT_ID: ${{ inputs.schedule_slot }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh
