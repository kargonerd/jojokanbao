name: Maintenance · Sync RMRB daily PDF
run-name: >-
  ${{ inputs.automatic && 'RMRB sync [cloudflare-cron]' || 'RMRB sync [manual]' }}

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Internal flag for the external Cloudflare scheduler
        required: true
        default: false
        type: boolean
      date:
        description: "Date to sync as YYYYMMDD. Empty means today."
        required: false
        type: string
      force:
        description: "Overwrite the remote PDF if it already exists."
        required: false
        default: false
        type: boolean
      scheduled_at:
        description: Scheduled slot time supplied by Cloudflare
        required: false
        default: ""
        type: string
      schedule_slot:
        description: Stable scheduler slot id supplied by Cloudflare
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: rmrb-sync
  cancel-in-progress: false

jobs:
  sync-rmrb:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      B2_REMOTE: jojo-b2
      TENCENTCLOUD_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate external scheduler inputs
        if: ${{ inputs.automatic }}
        shell: bash
        run: |
          if ! [[ "${{ inputs.date }}" =~ ^[0-9]{8}$ ]] \
            || [ -z "${{ inputs.scheduled_at }}" ] \
            || [ -z "${{ inputs.schedule_slot }}" ] \
            || [ "${{ inputs.force }}" = "true" ]; then
            echo "Automatic runs require date, scheduled_at, and schedule_slot, and cannot force overwrite." >&2
            exit 1
          fi

      - name: Report automatic RMRB execution start
        if: ${{ inputs.automatic }}
        continue-on-error: true
        env:
          HEALTHCHECKS_SIGNAL: log
          HEALTHCHECKS_TASK_ID: rmrb-sync
          HEALTHCHECKS_STAGE: rmrb-sync
          HEALTHCHECKS_STATUS: running
          HEALTHCHECKS_SCHEDULED_AT: ${{ inputs.scheduled_at }}
          HEALTHCHECKS_SLOT_ID: ${{ inputs.schedule_slot }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf rclone

      - name: Install Python dependencies
        run: pip install requests PyPDF2

      - name: Sync RMRB PDF
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          python tools/archive-pdf/sync_rmrb.py "${args[@]}"

      - name: Purge overwritten PDF from EdgeOne and verify
        if: ${{ inputs.force }}
        run: |
          sync_date="${{ inputs.date }}"
          if [ -z "$sync_date" ]; then
            sync_date="$(date +%Y%m%d)"
          fi
          year="$sync_date"
          year="${year:0:4}"
          url="https://blacknews.jojokanbao.cn/RMRB/${year}/${sync_date}.pdf"
          node tools/archive-pdf/purge-cache.mjs "$url"

          for attempt in {1..18}; do
            rm -f /tmp/rmrb-probe.pdf /tmp/rmrb-probe.decoded.pdf /tmp/rmrb-headers
            if curl --silent --show-error --fail \
              --header "Cache-Control: no-cache" \
              --header "Range: bytes=0-65535" \
              --dump-header /tmp/rmrb-headers \
              --output /tmp/rmrb-probe.pdf \
              "$url" \
              && grep -Eq '^HTTP/[^ ]+ 206' /tmp/rmrb-headers; then
              if [ "$(head -c 5 /tmp/rmrb-probe.pdf)" != "%PDF-" ] \
                && node tools/archive-pdf/protect.mjs decode /tmp/rmrb-probe.pdf /tmp/rmrb-probe.decoded.pdf \
                && [ "$(head -c 5 /tmp/rmrb-probe.decoded.pdf)" = "%PDF-" ]; then
                echo "Public URL serves protected byte ranges."
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: EdgeOne still serves stale or invalid bytes; retrying..."
            sleep 10
          done

          echo "Public URL did not switch to the protected PDF in time." >&2
          exit 1

      - name: Report automatic RMRB sync outcome
        if: ${{ always() && inputs.automatic }}
        continue-on-error: true
        env:
          HEALTHCHECKS_SIGNAL: ${{ job.status == 'success' && 'success' || 'fail' }}
          HEALTHCHECKS_TASK_ID: rmrb-sync
          HEALTHCHECKS_STAGE: rmrb-sync
          HEALTHCHECKS_STATUS: ${{ job.status }}
          HEALTHCHECKS_FAILURE_TYPE: ${{ job.status != 'success' && 'run-failed' || '' }}
          HEALTHCHECKS_SCHEDULED_AT: ${{ inputs.scheduled_at }}
          HEALTHCHECKS_SLOT_ID: ${{ inputs.schedule_slot }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh
