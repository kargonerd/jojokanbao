name: Maintenance · Sync RMRB daily PDF
run-name: RMRB Canonical and Delivery backfill · 2026-07-19 to 2026-09-10
on:
  workflow_dispatch:
    inputs:
      automatic:
        type: boolean
        default: false
      date:
        type: string
        default: '20260910'
permissions:
  contents: read
concurrency:
  group: rmrb-sync
  cancel-in-progress: false
jobs:
  backfill:
    if: ${{ !inputs.automatic }}
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 45
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install transfer and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qpdf
          pip install 'huggingface_hub>=0.34,<1' numpy boto3 requests
      - name: Backfill validated daily issues
        run: python tools/archive-pdf/cloud_backfill_20260910.py
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rmrb-backfill-20260910
          path: |
            .rmrb-cloud-backfill/publication.json
            .rmrb-cloud-backfill/canonical-commit.json
          retention-days: 30
          include-hidden-files: true
