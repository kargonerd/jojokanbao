name: Maintenance · RSSHub media coverage

on:
  schedule:
    # 08:30 and 22:30 Asia/Shanghai. GitHub cron is UTC.
    - cron: "30 0,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsshub-media-coverage
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      JOJOKANBAO_RSSHUB_ACCESS_KEY: ${{ secrets.JOJOKANBAO_RSSHUB_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate monitor
        run: python -m unittest discover -s tools/rsshub-coverage/tests -v

      - name: Probe publisher routes
        run: >-
          python tools/rsshub-coverage/rsshub_coverage.py
          --instance https://jojokanbao-rsshub.onrender.com
          --timeout 90
          --retries 1
          --request-delay 1
          --output-dir rsshub-coverage-report

      - name: Publish run summary
        if: always() && hashFiles('rsshub-coverage-report/summary.md') != ''
        run: cat rsshub-coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('rsshub-coverage-report/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rsshub-coverage-${{ github.run_id }}
          path: rsshub-coverage-report/
          retention-days: 30
