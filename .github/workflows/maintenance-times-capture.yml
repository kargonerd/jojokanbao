name: Maintenance · Times Capture
run-name: >-
  ${{ inputs.automatic && 'Times capture [cloudflare-cron]' || 'Times capture [manual]' }}

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Internal flag for the external Cloudflare scheduler
        type: boolean
        default: false
        required: true
      since_hours:
        description: Primary processing window in hours
        type: string
        default: "24"
        required: true
      sources:
        description: Optional comma-separated source ids; empty runs all enabled sources
        type: string
        default: ""
        required: false
      proxy_rotation_attempts:
        description: Proxy candidates for a manual maintenance run (1-50; automatic runs always use 12)
        type: string
        default: "12"
        required: true
      publish:
        description: Publish the captured job to the Runtime Bucket
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: times-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TIMES_RUNTIME_TOKEN }}
      HF_TIMES_RUNTIME_BUCKET: ${{ vars.HF_TIMES_RUNTIME_BUCKET || secrets.HF_TIMES_RUNTIME_BUCKET }}
      # Keep automatic recovery aligned with the three-hour Capture bootstrap.
      # A wider cold-start lookback makes every pre-bootstrap URL look like a
      # late arrival and can exceed the 35-minute Capture budget.
      TIMES_DISCOVERY_HOURS: ${{ inputs.automatic && '3' || inputs.since_hours || '24' }}
      TIMES_PROCESS_WINDOW_HOURS: ${{ inputs.automatic && '1' || inputs.since_hours || '24' }}
      TIMES_SOURCES: ${{ inputs.sources || '' }}
      TIMES_PUBLISH: ${{ inputs.automatic || inputs.publish }}
      TIMES_RUNTIME_JOB_ID: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      TIMES_PROXY_ROTATION_ATTEMPTS: ${{ inputs.automatic && '12' || inputs.proxy_rotation_attempts || '12' }}
      JOJO_TIMES_PROXY_URI: ${{ secrets.JOJO_TIMES_PROXY_URI }}
      JOJO_TIMES_PROXY_SUBSCRIPTION: ${{ secrets.JOJO_TIMES_PROXY_SUBSCRIPTION }}
      HEALTHCHECKS_TIMES_PIPELINE_URL: ${{ secrets.HEALTHCHECKS_TIMES_PIPELINE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate external scheduler inputs
        if: inputs.automatic && (inputs.since_hours != '1' || inputs.sources != '' || inputs.proxy_rotation_attempts != '12' || inputs.publish != true)
        run: |
          echo "Automatic runs must use since_hours=1, all sources, proxy_rotation_attempts=12, and publish=true" >&2
          exit 1

      - name: Validate capture inputs
        run: |
          if ! [[ "$TIMES_DISCOVERY_HOURS" =~ ^[1-9][0-9]*$ ]] \
            || ! [[ "$TIMES_PROCESS_WINDOW_HOURS" =~ ^[1-9][0-9]*$ ]] \
            || (( TIMES_PROCESS_WINDOW_HOURS > TIMES_DISCOVERY_HOURS )); then
            echo "Discovery and process windows must be positive integers, with process no larger than discovery" >&2
            exit 1
          fi
          if ! [[ "$TIMES_PROXY_ROTATION_ATTEMPTS" =~ ^[1-9][0-9]*$ ]] \
            || (( TIMES_PROXY_ROTATION_ATTEMPTS > 50 )); then
            echo "proxy_rotation_attempts must be an integer from 1 to 50" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Validate Runtime Bucket configuration
        if: env.TIMES_PUBLISH == 'true'
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is not configured" >&2 && exit 1)
          test -n "$HF_TIMES_RUNTIME_BUCKET" || (echo "HF_TIMES_RUNTIME_BUCKET is not configured" >&2 && exit 1)

      - name: Install locked pipeline dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build Times pipeline
        run: |
          pnpm --filter @jojo/times-pipeline typecheck
          pnpm --filter @jojo/times-pipeline test
          pnpm --filter @jojo/times-pipeline build

      - name: Restore Capture memory
        id: capture_memory_restore
        if: env.TIMES_PUBLISH == 'true'
        continue-on-error: true
        run: |
          node tools/times-pipeline/dist/src/runtime-cli.js \
            --action restore-memory \
            --kind capture \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times"

      - name: Start pinned Mihomo for a configured subscription
        if: env.JOJO_TIMES_PROXY_SUBSCRIPTION != ''
        env:
          MIHOMO_VERSION: 1.19.30
          MIHOMO_SHA256: cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84
        run: |
          mkdir -p "$RUNNER_TEMP/mihomo"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz" \
            -o "$RUNNER_TEMP/mihomo/mihomo.gz"
          echo "$MIHOMO_SHA256  $RUNNER_TEMP/mihomo/mihomo.gz" | sha256sum -c -
          gzip -d "$RUNNER_TEMP/mihomo/mihomo.gz"
          chmod 700 "$RUNNER_TEMP/mihomo/mihomo"
          node tools/times-pipeline/dist/src/prepare-proxy-cli.js --output "$RUNNER_TEMP/mihomo/config.yaml"
          nohup "$RUNNER_TEMP/mihomo/mihomo" -d "$RUNNER_TEMP/mihomo" -f "$RUNNER_TEMP/mihomo/config.yaml" \
            > "$RUNNER_TEMP/mihomo/runtime.log" 2>&1 &
          for attempt in $(seq 1 12); do
            if curl --proxy http://127.0.0.1:7890 --max-time 8 -fsS -o /dev/null https://www.gstatic.com/generate_204; then
              echo "JOJO_TIMES_PROXY_URI=http://127.0.0.1:7890" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "Mihomo did not expose a healthy local proxy" >&2
          exit 1

      - name: Verify pinned BPC extension
        env:
          BPC_REVISION: 587dcfd3d3b18652607e37d3d401430e85f8c8ec
          BPC_SHA256: 1db1c0d424f2ca1f8b9c88b91789ea68b7732969023cb23f82b263c060a6ce59
        run: |
          archive="tools/times-pipeline/vendor/bpc/bypass-paywalls-chrome-clean.zip"
          echo "$BPC_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/bpc"
          echo "BPC_EXTENSION_PATH=$RUNNER_TEMP/bpc/bypass-paywalls-chrome-clean-master" >> "$GITHUB_ENV"
          echo "BPC_REVISION=$BPC_REVISION" >> "$GITHUB_ENV"

      - name: Restore pinned browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/brave-cache
          key: times-capture-browsers-${{ runner.os }}-${{ runner.arch }}-playwright-1.60.0-brave-1.93.138

      - name: Install Chromium for page capture
        run: |
          pnpm --filter @jojo/times-pipeline exec playwright install --with-deps chromium

      - name: Install pinned Brave for Playwright
        env:
          BRAVE_VERSION: 1.93.138
          BRAVE_SHA256: cf18b2d443f067241e13662484c4b9523f13ff089ba1fc27c88f67911586ac9f
        run: |
          cache="$RUNNER_TEMP/brave-cache/$BRAVE_VERSION"
          package="$cache/brave-browser.deb"
          brave_root="$cache/root"
          brave_path="$brave_root/opt/brave.com/brave/brave-browser"
          mkdir -p "$cache"
          if ! test -f "$package" || ! echo "$BRAVE_SHA256  $package" | sha256sum -c -; then
            rm -f "$package"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 \
              "https://github.com/brave/brave-browser/releases/download/v${BRAVE_VERSION}/brave-browser_${BRAVE_VERSION}_amd64.deb" \
              -o "$package"
          fi
          echo "$BRAVE_SHA256  $package" | sha256sum -c -
          if ! test -x "$brave_path"; then
            mkdir -p "$brave_root"
            dpkg-deb --extract "$package" "$brave_root"
          fi
          test -x "$brave_path"
          "$brave_path" --version
          echo "JOJO_TIMES_BRAVE_PATH=$brave_path" >> "$GITHUB_ENV"

      - name: Capture all enabled sources
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times"
            --since-hours "$TIMES_DISCOVERY_HOURS"
            --workers 8
          )
          if [ -n "$TIMES_SOURCES" ]; then
            args+=(--sources "$TIMES_SOURCES")
          fi
          node tools/times-pipeline/dist/src/capture-cli.js "${args[@]}" > "$RUNNER_TEMP/capture-result.json"

      - name: Resolve capture manifest
        run: |
          node -e 'const fs=require("node:fs");const result=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/capture-result.json","utf8"));fs.appendFileSync(process.env.GITHUB_ENV,"TIMES_RUN_MANIFEST="+result.runManifest+"\n")'

      - name: Report discovery coverage
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/capture-result.json", "utf8"));
          for (const row of report.results || []) {
            const manifestPath = row.output?.manifest
              ? process.env.RUNNER_TEMP + "/jojo-times/" + row.output.manifest
              : undefined;
            const manifest = manifestPath && fs.existsSync(manifestPath)
              ? JSON.parse(fs.readFileSync(manifestPath, "utf8"))
              : undefined;
            const window = manifest?.window;
            console.log([
              `${row.sourceId}: ${row.status}, ${row.output?.candidates || 0} candidate(s)`,
              manifest?.publicationTimeZone ? `timezone=${manifest.publicationTimeZone}` : undefined,
              window ? `lookback=${window.accepted}/${window.discovered}` : undefined,
              window ? `future=${window.afterWindow}` : undefined,
              window ? `invalid=${window.invalidTimestamp}` : undefined,
            ].filter(Boolean).join(", "));
          }
          NODE

      - name: Capture every pending article page and image
        id: page_capture
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times"
            --run-manifest "$TIMES_RUN_MANIFEST"
            --source-workers 8
            --timeout 30
            --process-window-hours "$TIMES_PROCESS_WINDOW_HOURS"
            --refresh-hours 168
            --retry-hours 0.15
            --browser-extension-path "$BPC_EXTENSION_PATH"
            --report "$RUNNER_TEMP/page-capture-result.json"
          )
          if [ -n "$JOJO_TIMES_PROXY_URI" ]; then
            args+=(
              --proxy-server "$JOJO_TIMES_PROXY_URI"
              --proxy-control-url http://127.0.0.1:9090
              --proxy-rotation-attempts "$TIMES_PROXY_ROTATION_ATTEMPTS"
              --proxy-exhaustive-tail 3
            )
          fi
          xvfb-run --server-num=99 --server-args='-screen 0 1440x1200x24 -ac -nolisten tcp' \
            node tools/times-pipeline/dist/src/page-capture-cli.js "${args[@]}"

      - name: Publish durable Runtime job
        if: env.TIMES_PUBLISH == 'true'
        run: |
          node tools/times-pipeline/dist/src/runtime-cli.js \
            --action publish-job \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            --run-manifest "$TIMES_RUN_MANIFEST" \
            > "$RUNNER_TEMP/runtime-job-result.json"

      - name: Save Capture memory
        id: capture_memory
        if: env.TIMES_PUBLISH == 'true'
        continue-on-error: true
        run: |
          node tools/times-pipeline/dist/src/runtime-cli.js \
            --action publish-memory \
            --kind capture \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            > "$RUNNER_TEMP/capture-memory-result.json"

      - name: Upload dry-run Raw artifact
        if: env.TIMES_PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times/raw
            ${{ runner.temp }}/capture-result.json
            ${{ runner.temp }}/page-capture-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish capture summary
        if: always()
        env:
          CAPTURE_MEMORY_OUTCOME: ${{ steps.capture_memory.outcome }}
          CAPTURE_MEMORY_RESTORE_OUTCOME: ${{ steps.capture_memory_restore.outcome }}
        run: |
          node - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/capture-result.json";
          console.log("## Times Raw capture\n");
          if (!fs.existsSync(path)) {
            console.log("Capture result is missing.");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          const rows = report.results || [];
          const capturePath = process.env.RUNNER_TEMP + "/page-capture-result.json";
          let pages;
          try {
            const body = fs.existsSync(capturePath) ? fs.readFileSync(capturePath, "utf8").trim() : "";
            pages = body ? JSON.parse(body) : undefined;
          } catch {}
          console.log(`- Run: \`${report.runId}\``);
          const selectedSources = pages?.perSource?.filter((row) => row.discovered > 0).length;
          console.log(`- Sources: ${selectedSources ?? rows.filter((row) => row.status === "ok").length}/${rows.length}`);
          console.log(`- Candidates: ${pages?.discovered ?? rows.reduce((sum, row) => sum + (row.output?.candidates || 0), 0)}`);
          if (pages?.lookbackDiscovered !== undefined) {
            console.log(`- Discovery lookback: ${pages.lookbackDiscovered} candidates; process window: ${pages.processWindowHours || 1}h`);
            console.log(`- Recovery candidates: ${pages.recoveryCandidates || 0}`);
          }
          console.log(`- Errors: ${rows.filter((row) => row.status === "error").length}`);
          console.log(`- Runtime job: ${process.env.TIMES_PUBLISH === "true" ? `\`${process.env.TIMES_RUNTIME_JOB_ID}\`` : "no (artifact only)"}`);
          if (process.env.CAPTURE_MEMORY_OUTCOME === "failure") {
            console.log("- Warning: Capture memory could not be updated; the durable Runtime job can still be processed, and a later Capture may refetch some articles.");
          }
          if (process.env.CAPTURE_MEMORY_RESTORE_OUTCOME === "failure") {
            console.log("- Warning: Capture memory could not be restored; this run rebuilt state from publisher discovery and may refetch recent articles.");
          }
          if (pages) {
            console.log(`- Page capture: ${pages.captured}/${pages.planned} full pages, ${pages.failed} failures`);
            console.log(`- Excluded: ${pages.skipped} non-text media, ${pages.hardPaywall} hard paywall`);
            console.log(`- Methods: ${pages.direct} direct, ${pages.browser} browser; images: ${pages.assets}`);
            if (pages.proxyCandidatesSelected) {
              console.log(`- Proxy retries: ${pages.proxyCandidatesSelected} selected candidates, ${pages.proxyRotationRounds} probe rounds, ${pages.proxyTailRounds || 0} exhaustive-tail rounds`);
            }
            if (pages.failures?.length) {
              console.log("\n### Final capture failures\n");
              for (const failure of pages.failures) {
                const title = String(failure.title || failure.articleId).replace(/[\r\n|]/g, " ").slice(0, 180);
                const status = [
                  failure.httpStatus ? `HTTP ${failure.httpStatus}` : "",
                  String(failure.error || "FullTextNotExtracted"),
                ].filter(Boolean).join("; ");
                const proxyCoverage = failure.proxyCandidatesSelected
                  ? `; selected proxy candidates tried ${failure.proxyCandidatesTried}/${failure.proxyCandidatesSelected}`
                  : "";
                console.log(`- **${failure.sourceId}**: [${title}](${failure.canonicalUrl}) — ${status}${proxyCoverage}`);
              }
            }
          } else {
            console.log("- Page capture result is missing");
          }
          NODE

      - name: Report automatic Capture failure
        if: ${{ always() && inputs.automatic && job.status != 'success' }}
        continue-on-error: true
        env:
          HEALTHCHECKS_PING_URL: ${{ env.HEALTHCHECKS_TIMES_PIPELINE_URL }}
          HEALTHCHECKS_SIGNAL: fail
          HEALTHCHECKS_STAGE: times-capture
          HEALTHCHECKS_STATUS: ${{ job.status }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh
