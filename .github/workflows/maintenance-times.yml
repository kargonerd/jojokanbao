name: Legacy · Times v1 manual validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the scheduled publisher or a non-publishing 24-hour validation
        type: choice
        options:
          - validate-24h
          - publish
        default: validate-24h
        required: true

permissions:
  contents: read

concurrency:
  group: times-v1-legacy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: ${{ github.event_name == 'schedule' && 9 || 60 }}
    env:
      PYTHONUNBUFFERED: "1"
      JOJOKANBAO_RSSHUB_ACCESS_KEY: ${{ secrets.JOJOKANBAO_RSSHUB_ACCESS_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      JOJO_RAW_REMOTE: jojo-b2:${{ secrets.B2_RAW_BUCKET || 'jojo-news-raw' }}
      JOJO_DELIVERY_REMOTE: jojo-b2:${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      JOJO_NEWS_ARCHIVE_RUNNER_ROOT: ${{ github.workspace }}/.external/jojo-news-archive-runner/services/olds-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the pinned publisher parsers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kargonerd/jojo-news-archive-runner
          ref: 520b56cca8cd8d229825f1a5bceac8c91e502891
          path: .external/jojo-news-archive-runner
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/times-pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install -r tools/times-pipeline/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install rclone
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate required credentials
        run: |
          test -n "$JOJOKANBAO_RSSHUB_ACCESS_KEY" || (echo "JOJOKANBAO_RSSHUB_ACCESS_KEY is not configured" >&2 && exit 1)

      - name: Validate B2 credentials
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          test -n "$B2_KEY_ID" || (echo "B2_KEY_ID is not configured" >&2 && exit 1)
          test -n "$B2_APPLICATION_KEY" || (echo "B2_APPLICATION_KEY is not configured" >&2 && exit 1)

      - name: Configure B2
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: >-
          rclone config create jojo-b2 b2
          account "$B2_KEY_ID"
          key "$B2_APPLICATION_KEY"
          --non-interactive

      - name: Collect, build, and publish Times
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: >-
          python tools/times-pipeline/run.py
          --output "$RUNNER_TEMP/jojo-times-build"
          --timeout 70
          --article-timeout 25
          --archive-engine browser
          --archive-workers 8
          --archive-max-pages 50
          --archive-browser-retries 0
          --archive-refresh-hours 24
          --archive-retry-hours 2
          --archive-max-response-bytes 5000000
          --archive-max-page-bytes 25000000
          --require-news-runner
          --retention-days 7
          --max-latest-articles 1000
          --publish

      - name: Capture all discovered articles from the last 24 hours over HTTP
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-24h'
        run: >-
          python tools/times-pipeline/run.py
          --output "$RUNNER_TEMP/jojo-times-24h-http"
          --collection-window-hours 24
          --timeout 70
          --article-timeout 25
          --archive-engine http
          --archive-workers 32
          --archive-max-pages 5000
          --archive-refresh-hours 24
          --archive-retry-hours 2
          --archive-max-response-bytes 5000000
          --require-news-runner
          --retention-days 1
          --max-latest-articles 5000

      - name: Capture one browser sample per source
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-24h'
        continue-on-error: true
        run: >-
          timeout --signal=TERM 8m python tools/times-pipeline/run.py
          --output "$RUNNER_TEMP/jojo-times-24h-browser-sample"
          --collection-window-hours 24
          --timeout 70
          --article-timeout 25
          --archive-engine browser
          --archive-workers 8
          --archive-max-pages 26
          --archive-browser-retries 0
          --archive-refresh-hours 24
          --archive-retry-hours 2
          --archive-max-response-bytes 5000000
          --archive-max-page-bytes 8000000
          --require-news-runner
          --retention-days 1
          --max-latest-articles 5000

      - name: Publish run summary
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        run: |
          test -f "$RUNNER_TEMP/jojo-times-build/report.json" || exit 0
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jojo-times-build" / "report.json").read_text())
          print("## Times B2 publication")
          print()
          print(f"- Run: `{report['runId']}`")
          print(f"- Sources: {report['availableSourceCount']}/{report['sourceCount']}")
          print(f"- Fetched articles: {report['fetchedArticles']}")
          print(f"- Latest window: {report['latestArticles']}")
          print(f"- Archived responses/articles: {report['archiveResponses']}/{report['archivedArticles']}")
          print(f"- Parsed complete/partial: {report['parser'].get('complete', 0)}/{report['parser'].get('partial', 0)}")
          print(f"- WACZ: `{report['waczObject']}`")
          print(f"- Changed issues: {', '.join(report['changedIssues']) or 'none'}")
          PY

      - name: Publish validation summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-24h'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          print("## Times 24-hour validation")
          for label, directory in (
              ("Full HTTP archive", "jojo-times-24h-http"),
              ("Browser sample", "jojo-times-24h-browser-sample"),
          ):
              path = root / directory / "report.json"
              if not path.exists():
                  print(f"\n### {label}\n\nReport missing.")
                  continue
              report = json.loads(path.read_text())
              timings = report.get("timingsMs", {})
              print(f"\n### {label}\n")
              print(f"- Sources: {report['availableSourceCount']}/{report['sourceCount']}")
              print(f"- Articles: {report['fetchedArticles']}")
              print(f"- Successful pages: {report.get('archiveSucceededArticles', 0)}/{report['selectedForArchive']} (failures: {report.get('archiveFailedArticles', 0)})")
              print(f"- WACZ: {report['archiveWaczBytes'] / 1024 / 1024:.1f} MiB")
              print(f"- Collect/archive/build/total: {timings.get('collect', 0) / 1000:.1f}s / {timings.get('archive', 0) / 1000:.1f}s / {timings.get('build', 0) / 1000:.1f}s / {timings.get('total', 0) / 1000:.1f}s")
              print("\n| Source | Feed | 24h items | Feed ms | Archived | Failed | Page MiB |")
              print("|---|---:|---:|---:|---:|---:|---:|")
              archives = {row["sourceId"]: row for row in report.get("archiveBySource", [])}
              for source in report.get("sources", []):
                  archive = archives.get(source["id"], {})
                  print(
                      f"| {source['name']} | {source.get('status')} | {source.get('items', 0)} | "
                      f"{source.get('elapsedMs', 0)} | {archive.get('succeeded', 0)} | "
                      f"{archive.get('failed', 0)} | {archive.get('pageBytes', 0) / 1024 / 1024:.1f} |"
                  )
          PY

      - name: Upload diagnostic report
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'publish')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-pipeline-${{ github.run_id }}
          path: ${{ runner.temp }}/jojo-times-build/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload 24-hour HTTP archive
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-24h'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-24h-http-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times-24h-http/report.json
            ${{ runner.temp }}/jojo-times-24h-http/raw/web-archives/times/**/run.json
            ${{ runner.temp }}/jojo-times-24h-http/raw/web-archives/times/**/*.wacz
            ${{ runner.temp }}/jojo-times-24h-http/delivery/content/newspapers/times/latest.jox
            ${{ runner.temp }}/jojo-times-24h-http/canonical/newspapers/times/items/**/*.json.gz
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload browser sample
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-24h'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-24h-browser-sample-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times-24h-browser-sample/report.json
            ${{ runner.temp }}/jojo-times-24h-browser-sample/raw/web-archives/times/**/run.json
            ${{ runner.temp }}/jojo-times-24h-browser-sample/raw/web-archives/times/**/*.wacz
            ${{ runner.temp }}/jojo-times-24h-browser-sample/delivery/content/newspapers/times/latest.jox
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
