name: Maintenance · Purge Archive PDF cache

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "Archive PDF prefix or JOJO content catalog to purge."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - RMRB
          - RMHB
          - CKXX
          - HQ
          - SJZS
          - content-catalog
          - book-content

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: maintenance
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Purge protected PDF prefixes
        shell: bash
        run: |
          if [ "${{ inputs.collection }}" = "content-catalog" ]; then
            node tools/archive-pdf/purge-cache.mjs \
              "https://blacknews.jojokanbao.cn/catalog.jox"
            exit 0
          fi

          if [ "${{ inputs.collection }}" = "book-content" ]; then
            node tools/archive-pdf/purge-cache.mjs \
              --type purge_prefix \
              --method invalidate \
              "https://blacknews.jojokanbao.cn/content/books/"
            exit 0
          fi

          if [ "${{ inputs.collection }}" = "all" ]; then
            collections=(RMRB RMHB CKXX HQ SJZS)
          else
            collections=("${{ inputs.collection }}")
          fi

          targets=()
          for collection in "${collections[@]}"; do
            targets+=("https://blacknews.jojokanbao.cn/${collection}/")
          done

          node tools/archive-pdf/purge-cache.mjs \
            --type purge_prefix \
            --method delete \
            "${targets[@]}"
