name: Maintenance · Bloomberg archive

on:
  schedule:
    # A scheduled run is a watchdog. Successful batches dispatch their successor
    # immediately, while concurrency prevents two writers from sharing a checkpoint.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Maximum articles to process in this batch."
        required: true
        default: "1000"
        type: string
      workers:
        description: "Downloader worker count."
        required: true
        default: "4"
        type: string
      max_runtime_minutes:
        description: "Stop accepting new articles, flush, and checkpoint after this time."
        required: true
        default: "300"
        type: string
      auto_continue:
        description: "Dispatch the next batch after a successful checkpoint."
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: bloomberg-2020-archive-writer
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID || secrets.B2_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET || secrets.B2_BUCKET }}
  B2_ARCHIVE_PREFIX: research-archives/bloomberg/2020
  B2_REMOTE: jojo-b2
  ARCHIVE_OUTPUT: ${{ github.workspace }}/.archive-work/bloomberg-2020-full
  ARCHIVE_MANIFEST: ${{ github.workspace }}/tools/bloomberg-archive/data/bloomberg-2020-archive-manifest.jsonl.gz
  MAX_ARTICLES: ${{ inputs.max_articles || '1000' }}
  DOWNLOAD_WORKERS: ${{ inputs.workers || '4' }}
  MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes || '300' }}
  MAX_RECORD_ATTEMPTS: "3"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/bloomberg-archive/requirements.txt

      - name: Install downloader dependencies
        run: |
          python -m pip install -r tools/bloomberg-archive/requirements.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private archive storage
        run: |
          python tools/bloomberg-archive/scripts/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Restore checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARCHIVE_OUTPUT"
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/${B2_ARCHIVE_PREFIX}"
          error_log="$RUNNER_TEMP/rclone-state-list-error.log"
          set +e
          listing="$(rclone lsf "${remote_root}/state" --files-only 2>"$error_log")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$error_log" >&2
            exit "$status"
          fi
          if grep -Fxq "archive.sqlite3.gz" <<<"$listing"; then
            rclone copyto \
              "${remote_root}/state/archive.sqlite3.gz" \
              "$RUNNER_TEMP/archive.sqlite3.gz" \
              --retries 8 --low-level-retries 20
            gzip -dc "$RUNNER_TEMP/archive.sqlite3.gz" \
              > "$ARCHIVE_OUTPUT/archive.sqlite3"
            echo "Restored the remote SQLite checkpoint."
          else
            echo "No remote checkpoint exists; starting from the manifest."
          fi

      - name: Plan batch
        id: before
        run: |
          python tools/bloomberg-archive/scripts/bloomberg_action_state.py \
            --state "$ARCHIVE_OUTPUT/archive.sqlite3" \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download bounded batch
        id: downloader
        shell: bash
        run: |
          set -uo pipefail
          args=(
            --year 2020
            --manifest "$ARCHIVE_MANIFEST"
            --output-dir "$ARCHIVE_OUTPUT"
            --workers "$DOWNLOAD_WORKERS"
            --min-request-interval 0.5
            --max-articles "$MAX_ARTICLES"
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"
            --max-record-attempts "$MAX_RECORD_ATTEMPTS"
            --progress-every 25
            --minimum-free-gb 2
          )
          if [ "${{ steps.before.outputs.retry_errors }}" = "true" ]; then
            args+=(--retry-errors)
          fi
          set +e
          python tools/bloomberg-archive/scripts/download_bloomberg_year.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkpoint SQLite
        if: ${{ always() && hashFiles('.archive-work/bloomberg-2020-full/archive.sqlite3') != '' }}
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path(".archive-work/bloomberg-2020-full/archive.sqlite3")
          connection = sqlite3.connect(path, timeout=60)
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          PY
          gzip -9 -c "$ARCHIVE_OUTPUT/archive.sqlite3" \
            > "$RUNNER_TEMP/archive.sqlite3.gz"

      - name: Publish objects and checkpoint
        if: ${{ always() && hashFiles('.archive-work/bloomberg-2020-full/archive.sqlite3') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/${B2_ARCHIVE_PREFIX}"
          if [ -d "$ARCHIVE_OUTPUT/objects" ]; then
            rclone copy \
              "$ARCHIVE_OUTPUT/objects" \
              "${remote_root}/objects" \
              --checksum --immutable \
              --transfers 8 --checkers 16 \
              --retries 8 --low-level-retries 20 \
              --stats 30s
          fi

          # Objects go first. Publishing state last prevents a restored checkpoint
          # from referring to data that has not reached durable storage yet.
          if [ -f "$ARCHIVE_OUTPUT/summary.json" ]; then
            rclone copyto \
              "$ARCHIVE_OUTPUT/summary.json" \
              "${remote_root}/state/summary.json" \
              --retries 8 --low-level-retries 20
          fi
          rclone copyto \
            "$RUNNER_TEMP/archive.sqlite3.gz" \
            "${remote_root}/state/archive.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Report remaining work
        id: after
        if: ${{ always() && hashFiles('.archive-work/bloomberg-2020-full/archive.sqlite3') != '' }}
        run: |
          python tools/bloomberg-archive/scripts/bloomberg_action_state.py \
            --state "$ARCHIVE_OUTPUT/archive.sqlite3" \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch next batch
        if: >-
          ${{
            steps.downloader.outputs.exit_code == '0' &&
            steps.after.outputs.should_continue == 'true' &&
            (github.event_name == 'schedule' || inputs.auto_continue)
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run maintenance-bloomberg-archive.yml \
            --ref "$GITHUB_REF_NAME" \
            -f max_articles="$MAX_ARTICLES" \
            -f workers="$DOWNLOAD_WORKERS" \
            -f max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
            -f auto_continue=true

      - name: Propagate downloader failure after checkpoint
        if: ${{ steps.downloader.outputs.exit_code != '0' }}
        run: |
          echo "Downloader exited with code ${{ steps.downloader.outputs.exit_code }}." >&2
          exit 1
