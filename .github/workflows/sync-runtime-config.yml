name: Sync PostHog runtime config

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posthog-runtime-config
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master' && vars.POSTHOG_RUNTIME_CONFIG_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
      - run: node tools/posthog/sync-runtime-config.mjs
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          JOJO_OPERATOR_TOKEN: ${{ secrets.JOJO_OPERATOR_TOKEN }}
