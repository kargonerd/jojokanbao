name: Deploy reader web

on:
  push:
    tags:
      - "reader-v*"
      - "reader-*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET_NAME: ${{ secrets.COS_BUCKET_NAME }}
      COS_BUCKET_REGION: ${{ secrets.COS_BUCKET_REGION }}
      COS_UPLOAD_FROM_PATH: ./apps/reader/dist/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install coscmd

      - name: Build reader
        run: pnpm --filter @jojo/reader build

      - name: Verify deployable PDF worker
        run: pnpm --filter @jojo/reader verify:build

      - name: Deploy to Tencent COS
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET_NAME" -r "$COS_BUCKET_REGION"
          find "$COS_UPLOAD_FROM_PATH" -name "*.map" -delete
          DEPLOY_STATIC_PATH="$(mktemp -d)"
          trap 'rm -rf "$DEPLOY_STATIC_PATH"' EXIT
          cp -R "${COS_UPLOAD_FROM_PATH}." "$DEPLOY_STATIC_PATH/"
          rm -f "$DEPLOY_STATIC_PATH/index.html"
          # Keep older files and upload the complete build before its entry.
          # This preserves favicon/robots/compatibility assets as well as
          # hashed assets needed by tabs opened before the release.
          coscmd upload -r "$DEPLOY_STATIC_PATH/" /
          # Publish the HTML entry last so it never references assets that are
          # not available yet.
          coscmd upload "${COS_UPLOAD_FROM_PATH}index.html" /index.html

      - name: Verify deployed reader assets
        env:
          READER_BASE_URL: https://reader.jojokanbao.cn
          READER_DEPLOY_REVISION: ${{ github.sha }}
        run: node apps/reader/scripts/verify-deployment.mjs
