name: Deploy reader web

on:
  push:
    tags:
      - "reader-v*"
      - "reader-*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET_NAME: ${{ secrets.COS_BUCKET_NAME }}
      COS_BUCKET_REGION: ${{ secrets.COS_BUCKET_REGION }}
      COS_UPLOAD_FROM_PATH: ./apps/reader/dist/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install coscmd

      - name: Build reader
        run: pnpm --filter @jojo/reader build

      - name: Verify deployable PDF worker
        run: |
          worker_path="$(find "$COS_UPLOAD_FROM_PATH/assets" -maxdepth 1 -type f -name 'pdf.worker-*' -print -quit)"
          test -n "$worker_path"
          case "$worker_path" in
            *.js) ;;
            *) echo "PDF worker must be emitted as .js so COS serves a JavaScript MIME type: $worker_path" >&2; exit 1 ;;
          esac

      - name: Deploy to Tencent COS
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET_NAME" -r "$COS_BUCKET_REGION"
          coscmd delete -rf assets || true
          coscmd delete -rf css || true
          coscmd delete -rf fonts || true
          coscmd delete -rf js || true
          find "$COS_UPLOAD_FROM_PATH" -name "*.map" -delete
          coscmd upload -r "$COS_UPLOAD_FROM_PATH" /
