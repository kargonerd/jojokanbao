name: Sync RMRB daily PDF

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to sync as YYYYMMDD. Empty means today."
        required: false
        type: string

jobs:
  sync-rmrb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      B2_REMOTE: jojo-b2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf rclone

      - name: Install Python dependencies
        run: pip install requests PyPDF2

      - name: Sync RMRB PDF
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python upload/sync_rmrb_today.py --date "${{ inputs.date }}"
          else
            python upload/sync_rmrb_today.py
          fi
