name: Web CI

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/editorial-preset/**"
      - "packages/auth/**"
      - "packages/pdf-viewer/**"
      - "packages/ui/**"
      - "supabase/**"
      - "patches/**"
      - "tooling/tsconfig/**"
      - "tooling/protect-reader-pdf.mjs"
      - "tooling/purge-edgeone-reader-cache.mjs"
      - "upload/sync_rmrb_today.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/web-deploy.yml"
      - ".github/workflows/sync-rmrb.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/editorial-preset/**"
      - "packages/auth/**"
      - "packages/pdf-viewer/**"
      - "packages/ui/**"
      - "supabase/**"
      - "patches/**"
      - "tooling/tsconfig/**"
      - "tooling/protect-reader-pdf.mjs"
      - "tooling/purge-edgeone-reader-cache.mjs"
      - "upload/sync_rmrb_today.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/web-deploy.yml"
      - ".github/workflows/sync-rmrb.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @jojo/web... typecheck
      - run: pnpm --filter @jojo/web... build
      - run: pnpm --filter @jojo/web verify:build
      - run: pnpm --filter @jojo/web... test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jojo/web exec playwright test

  cross-browser-e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/web exec playwright install --with-deps ${{ matrix.browser }}
      # WebKit is reliable serially; the two browser matrix jobs still run in parallel.
      - run: pnpm --filter @jojo/web exec playwright test --browser=${{ matrix.browser }} --workers=1
