name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      archive_pdf: ${{ steps.filter.outputs.archive_pdf }}
      all_node: ${{ steps.filter.outputs.all_node }}
      base_sha: ${{ steps.filter.outputs.base_sha }}
      cloud_api: ${{ steps.filter.outputs.cloud_api }}
      database: ${{ steps.filter.outputs.database }}
      desktop_e2e: ${{ steps.filter.outputs.desktop_e2e }}
      head_sha: ${{ steps.filter.outputs.head_sha }}
      homepage_external: ${{ steps.filter.outputs.homepage_external }}
      mobile_ios: ${{ steps.filter.outputs.mobile_ios }}
      maintenance_scheduler: ${{ steps.filter.outputs.maintenance_scheduler }}
      node: ${{ steps.filter.outputs.node }}
      search_scf: ${{ steps.filter.outputs.search_scf }}
      times_pipeline: ${{ steps.filter.outputs.times_pipeline }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0

      # Only the small lockfile parser is needed here; no application install.
      - run: pnpm install --filter @jojo/ci --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @jojo/ci test

      - id: filter
        name: Classify changed paths and dependency graphs
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/affected.mjs

  archive_pdf:
    name: Archive Delivery publication
    needs: changes
    if: needs.changes.outputs.archive_pdf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/archive-pdf/requirements.txt
      - run: python -m unittest discover -s tools/archive-pdf/tests -v
      - run: python -m unittest discover -s tools/jojo-admin/server/tests -p test_rmrb_review_publish.py -v

  node:
    name: Node workspaces
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.all_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Times runtime package
        if: needs.changes.outputs.times_pipeline == 'true'
        id: times_runtime_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .times-runtime
          key: ${{ runner.os }}-times-pipeline-runtime-v1-${{ hashFiles('tools/times-pipeline/src/**/*.ts', 'tools/times-pipeline/tsconfig.json', 'tools/times-pipeline/package.json', 'frontend/packages/content/src/**/*.ts', 'frontend/packages/content/package.json', 'pnpm-lock.yaml') }}

      - name: Check all workspaces
        if: needs.changes.outputs.all_node == 'true'
        run: pnpm turbo run typecheck test build verify:build

      - name: Check affected workspaces
        if: needs.changes.outputs.all_node != 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base_sha }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head_sha }}
        run: pnpm turbo run typecheck test build verify:build --affected

      - name: Verify portable scheduler and Tencent package
        if: needs.changes.outputs.maintenance_scheduler == 'true'
        run: |
          pnpm --filter @jojo/maintenance-core typecheck
          pnpm --filter @jojo/maintenance-core test
          node infrastructure/tencent-scf/maintenance-scheduler/build.mjs
          node --check infrastructure/tencent-scf/maintenance-scheduler/ops.mjs

      - name: Check maintenance workflow contracts
        # Workflow/helper edits are outside the package's Turbo hash. Always
        # execute these contracts explicitly, even when package tests are cached.
        if: needs.changes.outputs.times_pipeline == 'true'
        run: |
          pnpm --filter @jojo/times-pipeline exec vitest run tests/runtime-workflows.test.ts tests/monitoring-workflows.test.ts tests/workflow-config.test.ts tests/process-continuation.test.mjs
          bash -n tools/ci/with-apt-timeouts.sh
          bash -n tools/monitoring/ping-healthchecks.sh
          bash -n tools/monitoring/classify-permanent.sh
          node tools/monitoring/test-reporting.mjs

      - name: Ensure Times runtime build exists
        if: needs.changes.outputs.times_pipeline == 'true' && steps.times_runtime_cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @jojo/times-pipeline build
          pnpm --filter @jojo/times-pipeline --prod deploy "$GITHUB_WORKSPACE/.times-runtime"

  web-e2e:
    # Keep this stable check name in sync with the master branch ruleset.
    name: e2e
    needs: changes
    if: needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/web exec playwright install chromium
      - run: pnpm --filter @jojo/web exec playwright test

  desktop-e2e:
    name: Desktop renderer tests
    needs: changes
    if: needs.changes.outputs.desktop_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/desktop exec playwright install chromium
      - run: xvfb-run --auto-servernum pnpm --filter @jojo/desktop test:e2e

  mobile-ios:
    name: Mobile iOS native build
    needs: changes
    if: needs.changes.outputs.mobile_ios == 'true'
    runs-on: macos-latest
    # A Maven outage may require the pinned source fallback. Leave time for
    # the simulator smoke test after that slower compile finishes.
    timeout-minutes: 45
    env:
      COCOAPODS_DISABLE_STATS: "true"
      APP_VARIANT: standard
      EXPO_PUBLIC_APP_VARIANT: standard
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_AGENT_API_URL: https://agent-global.jojokanbao.cn/rag
      EXPO_PUBLIC_TIMES_AGENT_API_URL: https://agent-global.jojokanbao.cn/times
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Fingerprint iOS toolchain and client configuration
        id: ios_cache_context
        run: node tools/ci/ios-cache-key.mjs

      # Evaluate source globs before installation/prebuild creates generated files.
      - name: Restore compiled iOS app
        id: ios_app_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/jojo-derived-data/Build/Products/Release-iphonesimulator/JOJO.app
          key: ${{ runner.os }}-${{ runner.arch }}-ios-app-v1-${{ steps.ios_cache_context.outputs.toolchain }}-${{ steps.ios_cache_context.outputs.config }}-${{ hashFiles('frontend/mobile/**', 'frontend/packages/**', 'frontend/tooling/**', 'frontend/patches/**', 'tools/ci/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', '.npmrc', '.pnpmfile.cjs', '.gitattributes', '.gitignore', '.github/workflows/ci.yml') }}

      - run: pnpm install --frozen-lockfile

      - name: Generate iOS native project
        if: steps.ios_app_cache.outputs.cache-hit != 'true'
        working-directory: frontend/mobile
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Verify pinned Hermes fallback
        run: ruby tools/ci/hermes-source.test.rb

      - name: Install iOS native dependencies
        if: steps.ios_app_cache.outputs.cache-hit != 'true'
        working-directory: frontend/mobile/ios
        run: pod install

      - name: Compile iOS Release for Simulator
        if: steps.ios_app_cache.outputs.cache-hit != 'true'
        working-directory: frontend/mobile
        # The smoke test uses this runner's simulator, so it needs only the
        # host architecture, not a universal arm64 + x86_64 simulator binary.
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/JOJO.xcworkspace \
            -scheme JOJO \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/jojo-derived-data" \
            ARCHS="$(uname -m)" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Save before the simulator step so a launch timeout need not recompile.
      - name: Save compiled iOS app
        if: steps.ios_app_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/jojo-derived-data/Build/Products/Release-iphonesimulator/JOJO.app
          key: ${{ steps.ios_app_cache.outputs.cache-primary-key }}

      - name: Launch Release app in iOS Simulator
        working-directory: frontend/mobile
        run: |
          bash scripts/smoke-ios-simulator.sh \
            "$RUNNER_TEMP/jojo-derived-data/Build/Products/Release-iphonesimulator/JOJO.app" \
            "$RUNNER_TEMP/jojo-ios-smoke"

      - name: Upload iOS Simulator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ios-simulator-smoke
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/jojo-ios-smoke

  web-cross-browser:
    name: Web ${{ matrix.browser }}
    needs: changes
    # Catch browser-specific regressions before merge, not only on master.
    if: needs.changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Playwright supplies these browsers; their libraries come from Ubuntu.
      # A stale Chrome vendor index must not block Firefox/WebKit installation.
      - name: Remove unused Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: pnpm --filter @jojo/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @jojo/web exec playwright test --browser=${{ matrix.browser }} --workers=1

  homepage-external:
    name: Homepage external content
    needs: changes
    if: needs.changes.outputs.homepage_external == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/homepage typecheck
      - run: pnpm --filter @jojo/homepage test
      - run: pnpm --filter @jojo/homepage build
      - run: pnpm --filter @jojo/homepage verify:build

  database:
    name: Supabase contract
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/auth typecheck
      - run: pnpm --filter @jojo/auth test

      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(infrastructure/supabase/migrations/*.sql)
          [[ ${#migrations[@]} -gt 0 ]] || {
            echo "No Supabase migrations found" >&2
            exit 1
          }

          declare -A versions=()
          for migration in "${migrations[@]}"; do
            filename="${migration##*/}"
            [[ "$filename" =~ ^([0-9]{12})_[a-z0-9_]+\.sql$ ]] || {
              echo "Invalid migration filename: $filename" >&2
              exit 1
            }
            version="${BASH_REMATCH[1]}"
            [[ -s "$migration" ]] || {
              echo "Empty migration: $filename" >&2
              exit 1
            }
            [[ -z "${versions[$version]:-}" ]] || {
              echo "Duplicate migration version: $version" >&2
              exit 1
            }
            versions[$version]="$filename"
          done

      - name: Start local Supabase database
        working-directory: infrastructure
        run: pnpm dlx supabase@2.114.0 db start

      - name: Run database tests
        working-directory: infrastructure
        run: pnpm dlx supabase@2.114.0 test db

      - name: Stop local Supabase database
        if: always()
        working-directory: infrastructure
        run: pnpm dlx supabase@2.114.0 stop --no-backup

  cloud-api:
    name: Cloud API tests
    needs: changes
    if: needs.changes.outputs.cloud_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt

      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q

      - name: Verify deploy package assembly
        shell: bash
        run: |
          mkdir -p frontend/web/dist
          printf '<!doctype html><title>fixture</title>\n' > frontend/web/dist/index.html
          node infrastructure/edgeone/prepare-web-deploy.mjs
          test -f .edgeone/web-deploy/index.html
          test -f .edgeone/web-deploy/cloud-functions/api/index.py
          test -f '.edgeone/web-deploy/cloud-functions/gateway/[[default]].ts'
          test -f .edgeone/web-deploy/cloud-functions/app/application.py
          test ! -e .edgeone/web-deploy/cloud-functions/app/main.py
          test -f .edgeone/web-deploy/cloud-functions/requirements.txt
          test -f .edgeone/web-deploy/middleware.ts
          test -f .edgeone/web-deploy/edgeone.json
          test -f .edgeone/web-deploy/package.json
          test ! -e .edgeone/web-deploy/cloud-functions/tests
          test ! -e .edgeone/web-deploy/cloud-functions/requirements-dev.txt
          node -e 'const config = require("./.edgeone/web-deploy/edgeone.json"); if ("devCommand" in config) process.exit(1)'
          node infrastructure/edgeone/prepare-agent-deploy.mjs
          test -f .edgeone/agent-deploy/agents/rag/index.ts
          test -f .edgeone/agent-deploy/agents/rag/health.ts
          test -f .edgeone/agent-deploy/packages/agent/src/runtime.ts
          test -f .edgeone/agent-deploy/packages/agent/src/edgeone/handler.ts
          test -f .edgeone/agent-deploy/packages/content/src/jox.ts
          node -e 'const p=require("./.edgeone/agent-deploy/packages/agent/package.json"); if(p.dependencies["@jojo/content"]!=="file:../content") process.exit(1)'
          test -f '.edgeone/agent-deploy/cloud-functions/gateway/[[default]].ts'
          test -f .edgeone/agent-deploy/middleware.ts
          test -f .edgeone/agent-deploy/edgeone.json
          test -f .edgeone/agent-deploy/index.html
          test -f .edgeone/agent-deploy/package.json
          node -e 'const config = require("./.edgeone/agent-deploy/edgeone.json"); if (config.agents.dir !== "agents") process.exit(1)'

  search-scf:
    name: Reader Search SCF tests
    needs: changes
    if: needs.changes.outputs.search_scf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Match the Tencent SCF runtime so dependency/syntax drift is caught
          # before a release tag can reach staging.
          python-version: "3.9"
          cache: pip
          cache-dependency-path: infrastructure/tencent-scf/search/requirements-deploy.txt

      - run: python -m pip install -r infrastructure/tencent-scf/search/requirements-deploy.txt pytest
      - run: python -m pytest infrastructure/tencent-scf/search/tests -q

  required:
    # This aggregate check is required by the master branch ruleset.
    name: build-and-test
    if: always()
    needs:
      - changes
      - archive_pdf
      - cloud-api
      - desktop-e2e
      - mobile-ios
      - node
      - search-scf
      - web-e2e
      - web-cross-browser
      - homepage-external
      - database
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          if grep -Eq '(^| )(failure|cancelled)($| )' <<< "$RESULTS"; then
            echo "At least one CI job failed or was cancelled: $RESULTS" >&2
            exit 1
          fi
          echo "CI completed: $RESULTS"
