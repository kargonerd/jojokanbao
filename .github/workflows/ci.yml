name: Reader CI

on:
  push:
    branches: [master]
    paths:
      - "apps/reader/**"
      - "packages/editorial-preset/**"
      - "packages/pdf-viewer/**"
      - "packages/ui/**"
      - "tooling/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/reader/**"
      - "packages/editorial-preset/**"
      - "packages/pdf-viewer/**"
      - "packages/ui/**"
      - "tooling/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @jojo/reader... build
      - run: pnpm --filter @jojo/reader... test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jojo/reader exec playwright install --with-deps chromium
      - run: pnpm --filter @jojo/reader exec playwright test
