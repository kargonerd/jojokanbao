name: Deploy unified web

on:
  push:
    tags:
      - "reader-v*"
      - "reader-*"
  workflow_dispatch:
    inputs:
      environment:
        description: EdgeOne Makers deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      verify_base_url:
        description: Optional deployed URL to verify (for example, a Makers preview URL)
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'jojo-reader' }}
      EDGEONE_DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      EDGEONE_UPLOAD_FROM_PATH: ./apps/web/dist/
      VITE_ENABLE_ACCOUNT: ${{ vars.VITE_ENABLE_ACCOUNT || 'false' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          # Keep unfinished modules out of the public route table until an explicit rollout change.
          VITE_ENABLE_OLDS: "false"
          VITE_ENABLE_RAG: "false"
          VITE_RAG_API_BASE: ${{ vars.VITE_RAG_API_BASE }}
          VITE_OLDS_API_BASE: ${{ vars.VITE_OLDS_API_BASE }}
        run: pnpm --filter @jojo/web build

      - name: Verify deployable PDF worker
        run: pnpm --filter @jojo/web verify:build

      - name: Prepare web deployment
        run: |
          test -n "$EDGEONE_API_TOKEN" || (echo "EDGEONE_API_TOKEN is not configured" >&2 && exit 1)
          find "$EDGEONE_UPLOAD_FROM_PATH" -name "*.map" -delete

      - name: Deploy to EdgeOne Makers
        run: >-
          pnpm dlx edgeone@1.6.14 makers deploy "$EDGEONE_UPLOAD_FROM_PATH"
          --name "$EDGEONE_PROJECT_NAME"
          --token "$EDGEONE_API_TOKEN"
          --env "$EDGEONE_DEPLOY_ENV"

      - name: Verify deployed web assets
        if: ${{ (inputs.verify_base_url || vars.EDGEONE_READER_BASE_URL) != '' }}
        env:
          READER_BASE_URL: ${{ inputs.verify_base_url || vars.EDGEONE_READER_BASE_URL }}
          READER_DEPLOY_REVISION: ${{ github.sha }}
        run: node apps/web/scripts/verify-deployment.mjs

      - name: Report deferred deployment verification
        if: ${{ (inputs.verify_base_url || vars.EDGEONE_READER_BASE_URL) == '' }}
        run: echo "::notice::Deployment uploaded. Verify its Makers URL, then set EDGEONE_READER_BASE_URL for automatic verification."
