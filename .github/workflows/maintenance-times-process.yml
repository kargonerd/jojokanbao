name: Maintenance · Times Canonical and B2 Delivery

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit Canonical to HF and publish Delivery to B2
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: times-hf-dataset-writer
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 9
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_TIMES_DATASET_REPO: ${{ secrets.HF_TIMES_DATASET_REPO || secrets.HF_DATASET_REPO }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      JOJO_DELIVERY_REMOTE: jojo-b2:${{ secrets.B2_BUCKET || 'jojo-newspaper' }}
      TIMES_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Validate HF input configuration
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is not configured" >&2 && exit 1)
          test -n "$HF_TIMES_DATASET_REPO" || (echo "HF_TIMES_DATASET_REPO is not configured" >&2 && exit 1)

      - name: Validate publication configuration
        if: env.TIMES_PUBLISH == 'true'
        run: |
          test -n "$B2_KEY_ID" || (echo "B2_KEY_ID is not configured" >&2 && exit 1)
          test -n "$B2_APPLICATION_KEY" || (echo "B2_APPLICATION_KEY is not configured" >&2 && exit 1)

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install rclone for publication
        if: env.TIMES_PUBLISH == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Build Times pipeline
        run: pnpm --filter @jojo/times-pipeline build

      - name: Download the latest processable HF snapshot
        run: |
          node tools/times-pipeline/dist/src/hf-cli.js \
            --action download-snapshot \
            --repo "$HF_TIMES_DATASET_REPO" \
            --output "$RUNNER_TEMP/jojo-times" \
            > "$RUNNER_TEMP/hf-snapshot-result.json"
          node -e 'const fs=require("node:fs");const result=require(process.env.RUNNER_TEMP+"/hf-snapshot-result.json");fs.appendFileSync(process.env.GITHUB_ENV,`TIMES_RAW_REVISION=${result.revision}\nTIMES_RUN_MANIFEST=${result.runManifest}\n`)'

      - name: Build Canonical
        run: |
          node tools/times-pipeline/dist/src/process-cli.js \
            --config tools/times-pipeline/sources.v2.json \
            --output "$RUNNER_TEMP/jojo-times" \
            --run-manifest "$TIMES_RUN_MANIFEST" \
            --raw-revision "$TIMES_RAW_REVISION" \
            > "$RUNNER_TEMP/process-result.json"

      - name: Commit Canonical to HF
        if: env.TIMES_PUBLISH == 'true'
        run: |
          node tools/times-pipeline/dist/src/hf-cli.js \
            --action upload-canonical \
            --repo "$HF_TIMES_DATASET_REPO" \
            --output "$RUNNER_TEMP/jojo-times" \
            --run-manifest "$TIMES_RUN_MANIFEST" \
            --process-result "$RUNNER_TEMP/process-result.json"

      - name: Configure B2 and restore mutable Delivery pointers
        if: env.TIMES_PUBLISH == 'true'
        run: |
          rclone config create jojo-b2 b2 account "$B2_KEY_ID" key "$B2_APPLICATION_KEY" --non-interactive
          mkdir -p "$RUNNER_TEMP/previous-delivery"
          if rclone lsf "$JOJO_DELIVERY_REMOTE/content/newspapers/times" --files-only --include index.jox | grep -qx 'index.jox'; then
            rclone copyto "$JOJO_DELIVERY_REMOTE/content/newspapers/times/index.jox" "$RUNNER_TEMP/previous-delivery/index.jox"
          fi
          if rclone lsf "$JOJO_DELIVERY_REMOTE" --files-only --include catalog.jox | grep -qx 'catalog.jox'; then
            rclone copyto "$JOJO_DELIVERY_REMOTE/catalog.jox" "$RUNNER_TEMP/previous-delivery/catalog.jox"
          fi

      - name: Build Delivery with historical index
        run: |
          node tools/times-pipeline/dist/src/delivery-cli.js \
            --config tools/times-pipeline/sources.v2.json \
            --output "$RUNNER_TEMP/jojo-times" \
            --run-manifest "$TIMES_RUN_MANIFEST" \
            --delivery-output "$RUNNER_TEMP/jojo-times-delivery" \
            --previous-index "$RUNNER_TEMP/previous-delivery/index.jox" \
            --previous-catalog "$RUNNER_TEMP/previous-delivery/catalog.jox" \
            > "$RUNNER_TEMP/delivery-result.json"

      - name: Publish B2 Delivery in commit order
        if: env.TIMES_PUBLISH == 'true'
        run: |
          delivery="$RUNNER_TEMP/jojo-times-delivery"
          remote="$JOJO_DELIVERY_REMOTE/content/newspapers/times"
          rclone copy "$delivery/content/newspapers/times/items" "$remote/items" \
            --include '**/articles/*.jox' --include '**/assets/*.jox' --exclude '*' \
            --checksum --transfers 16 --header-upload 'Cache-Control: public, max-age=31536000, immutable'
          rclone copy "$delivery/content/newspapers/times/items" "$remote/items" \
            --include '**/manifest.jox' --exclude '*' \
            --checksum --transfers 8 --header-upload 'Cache-Control: public, max-age=60, must-revalidate'
          rclone copyto "$delivery/content/newspapers/times/index.jox" "$remote/index.jox" \
            --checksum --header-upload 'Cache-Control: public, max-age=60, must-revalidate'
          rclone copyto "$delivery/catalog.jox" "$JOJO_DELIVERY_REMOTE/catalog.jox" \
            --checksum --header-upload 'Cache-Control: public, max-age=60, must-revalidate'

      - name: Upload dry-run Canonical and Delivery artifact
        if: env.TIMES_PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-canonical-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times/canonical
            ${{ runner.temp }}/jojo-times-delivery
            ${{ runner.temp }}/hf-snapshot-result.json
            ${{ runner.temp }}/process-result.json
            ${{ runner.temp }}/delivery-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish processing summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/delivery-result.json";
          console.log("## Times Canonical and Delivery\n");
          if (!fs.existsSync(path)) {
            console.log("Delivery result is missing.");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          console.log(`- Articles: ${report.articles}`);
          console.log(`- Sources: ${report.sourceHealth.length}`);
          console.log(`- Unavailable cases: ${report.unavailableCaseCount}`);
          console.log(`- Delivery index: \`${report.indexObject}\``);
          console.log(`- Published: ${process.env.TIMES_PUBLISH === "true" ? "HF + B2" : "no (artifact only)"}`);
          NODE
