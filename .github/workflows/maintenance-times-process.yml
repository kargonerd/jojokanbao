name: Maintenance · Times Canonical and B2 Delivery

on:
  workflow_run:
    workflows: ["Maintenance · Times Capture"]
    types: [completed]
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: Optional Capture workflow run id to process as a dry run
        type: string
        default: ""
        required: false
      runtime_job_id:
        description: Optional exact unfinished Runtime job id
        type: string
        default: ""
        required: false
      publish:
        description: Publish Delivery to B2 and advance Runtime memory
        type: boolean
        default: false
        required: true
      bootstrap:
        description: Allow the first explicit Runtime Process without existing Process memory
        type: boolean
        default: false
        required: true
      max_jobs:
        description: Maximum ready Runtime jobs to coalesce into one Delivery
        type: string
        default: "4"
        required: true
      drain:
        description: Continue Process-only runs until no ready Runtime jobs remain
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: times-delivery-writer
  cancel-in-progress: false

jobs:
  process:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.display_title == 'Times capture [cloudflare-cron]')))
    runs-on: ubuntu-latest
    environment: maintenance
    timeout-minutes: 40
    env:
      HF_TOKEN: ${{ secrets.HF_TIMES_RUNTIME_TOKEN }}
      HF_TIMES_RUNTIME_BUCKET: ${{ vars.HF_TIMES_RUNTIME_BUCKET || secrets.HF_TIMES_RUNTIME_BUCKET }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JOJO_TIMES_TRANSLATION_WORKERS: "8"
      JOJO_TIMES_TRANSLATION_REQUEST_TIMEOUT_MS: "240000"
      JOJO_TIMES_TRANSLATION_BATCH_TIMEOUT_MS: "1440000"
      JOJO_TIMES_TRANSLATION_CHUNK_CHARACTERS: "20000"
      JOJO_DELIVERY_REMOTE: jojo-b2:${{ secrets.B2_BUCKET }}
      HEALTHCHECKS_TIMES_PIPELINE_URL: ${{ secrets.HEALTHCHECKS_TIMES_PIPELINE_URL }}
      TIMES_PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
      TIMES_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
      TIMES_CAPTURE_RUN_ID: ${{ inputs.capture_run_id || '' }}
      TIMES_RUNTIME_JOB_ID: ${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || inputs.runtime_job_id || '' }}
      TIMES_MAX_JOBS: ${{ inputs.max_jobs || '4' }}
      TIMES_DRAIN: ${{ github.event_name == 'workflow_run' || inputs.drain || false }}
      TIMES_GITHUB_REF: ${{ github.event.repository.default_branch || 'master' }}
      TIMES_RUNTIME_ROOT: ${{ github.workspace }}/.times-runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Validate Process inputs
        run: |
          test -z "$TIMES_CAPTURE_RUN_ID" || test -z "$TIMES_RUNTIME_JOB_ID" || (echo "capture_run_id and runtime_job_id are mutually exclusive" >&2 && exit 1)
          if [ -n "$TIMES_CAPTURE_RUN_ID" ] && [ "$TIMES_PUBLISH" = 'true' ]; then
            echo "capture_run_id is a dry-run artifact and cannot be published" >&2
            exit 1
          fi
          if [ "$TIMES_BOOTSTRAP" = 'true' ] && { [ "$TIMES_PUBLISH" != 'true' ] || [ -z "$TIMES_RUNTIME_JOB_ID" ] || [ -n "$TIMES_CAPTURE_RUN_ID" ]; }; then
            echo "bootstrap requires publish=true and an exact runtime_job_id" >&2
            exit 1
          fi
          if ! [[ "$TIMES_MAX_JOBS" =~ ^[1-9][0-9]*$ ]] || (( TIMES_MAX_JOBS > 20 )); then
            echo "max_jobs must be an integer from 1 to 20" >&2
            exit 1
          fi

      - name: Validate Runtime Bucket input configuration
        if: env.TIMES_CAPTURE_RUN_ID == ''
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is not configured" >&2 && exit 1)
          test -n "$HF_TIMES_RUNTIME_BUCKET" || (echo "HF_TIMES_RUNTIME_BUCKET is not configured" >&2 && exit 1)

      - name: Validate publication configuration
        if: env.TIMES_PUBLISH == 'true'
        run: |
          test -z "$TIMES_CAPTURE_RUN_ID" || (echo "capture_run_id is available only for a non-publishing dry run" >&2 && exit 1)
          test -n "$B2_KEY_ID" || (echo "B2_KEY_ID is not configured" >&2 && exit 1)
          test -n "$B2_APPLICATION_KEY" || (echo "B2_APPLICATION_KEY is not configured" >&2 && exit 1)
          test -n "$B2_BUCKET" || (echo "B2_BUCKET is not configured" >&2 && exit 1)
          test -n "$GEMINI_API_KEYS$GEMINI_API_KEY" || (echo "GEMINI_API_KEYS or GEMINI_API_KEY is not configured" >&2 && exit 1)

      - name: Install rclone for publication
        if: env.TIMES_PUBLISH == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Restore CI-verified Times runtime
        id: times_runtime_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .times-runtime
          key: ${{ runner.os }}-times-pipeline-runtime-v1-${{ hashFiles('tools/times-pipeline/src/**/*.ts', 'tools/times-pipeline/tsconfig.json', 'tools/times-pipeline/package.json', 'frontend/packages/content/src/**/*.ts', 'frontend/packages/content/package.json', 'pnpm-lock.yaml') }}

      - name: Prepare Times runtime on cache miss
        if: steps.times_runtime_cache.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile --filter @jojo/times-pipeline...
          pnpm --filter @jojo/times-pipeline build
          pnpm --filter @jojo/times-pipeline --prod deploy "$TIMES_RUNTIME_ROOT"

      - name: Select a FIFO batch of ready or retryable Runtime jobs
        if: env.TIMES_CAPTURE_RUN_ID == ''
        run: |
          args=(
            --action select-jobs
            --bucket "$HF_TIMES_RUNTIME_BUCKET"
            --output "$RUNNER_TEMP/jojo-times"
            --work-directory "$RUNNER_TEMP/runtime"
            --max-jobs "$TIMES_MAX_JOBS"
            --allow-empty true
          )
          if [ -n "$TIMES_RUNTIME_JOB_ID" ]; then
            args+=(--preferred-job-id "$TIMES_RUNTIME_JOB_ID")
          fi
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ -n "$TIMES_RUNTIME_JOB_ID" ]; then
            args+=(--exact-job true)
          fi
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" "${args[@]}" > "$RUNNER_TEMP/runtime-job-selection.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const result = require(process.env.RUNNER_TEMP + "/runtime-job-selection.json");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/runtime-job-ids.json", JSON.stringify(result.jobIds));
          fs.appendFileSync(process.env.GITHUB_ENV, `TIMES_RUNTIME_HAS_WORK=${result.jobIds.length > 0}\nTIMES_RUNTIME_JOB_ID=${result.anchorJobId || ""}\nTIMES_RUNTIME_JOB_COUNT=${result.jobIds.length}\n`);
          console.log(result.jobIds.length
            ? `Selected Runtime batch anchored at ${result.anchorJobId}: ${result.jobIds.join(", ")}`
            : "No ready Runtime jobs; this Process trigger is already drained");
          NODE

      - name: Restore committed or staged Process state
        if: env.TIMES_CAPTURE_RUN_ID == '' && env.TIMES_RUNTIME_HAS_WORK == 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action restore-process \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            > "$RUNNER_TEMP/process-memory-restore.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const result = require(process.env.RUNNER_TEMP + "/process-memory-restore.json");
          const rows = [`TIMES_PROCESS_REPLAY=${result.replay}`];
          if (result.generatedAt) rows.push(`TIMES_DELIVERY_GENERATED_AT=${result.generatedAt}`);
          if (result.processResultFile) rows.push(`TIMES_PROCESS_RESULT=${result.processResultFile}`);
          if (result.replay && result.jobIds) {
            fs.writeFileSync(process.env.RUNNER_TEMP + "/runtime-job-ids.json", JSON.stringify(result.jobIds));
            rows.push(`TIMES_RUNTIME_JOB_COUNT=${result.jobIds.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, rows.join("\n") + "\n");
          NODE

      - name: Require Process memory outside explicit bootstrap
        if: env.TIMES_CAPTURE_RUN_ID == '' && env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          restored="$(node -p 'require(process.env.RUNNER_TEMP + "/process-memory-restore.json").restored')"
          if [ "$restored" != 'true' ] && [ "$TIMES_BOOTSTRAP" != 'true' ]; then
            echo "Process memory is missing; use one reviewed manual bootstrap run instead of publishing a cold start" >&2
            exit 1
          fi

      - name: Download Raw from a Capture dry run
        if: env.TIMES_CAPTURE_RUN_ID != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: times-raw-${{ env.TIMES_CAPTURE_RUN_ID }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TIMES_CAPTURE_RUN_ID }}

      - name: Resolve Capture artifact input
        if: env.TIMES_CAPTURE_RUN_ID != ''
        run: |
          manifest="$(find "$RUNNER_TEMP/jojo-times/raw/runs" -type f -name '*.json' | sort | tail -n 1)"
          test -n "$manifest" || (echo "Capture artifact has no Raw run manifest" >&2 && exit 1)
          test -f "$manifest" || (echo "Capture artifact Raw run manifest is missing" >&2 && exit 1)
          echo "TIMES_RAW_REVISION=github-actions/$TIMES_CAPTURE_RUN_ID" >> "$GITHUB_ENV"
          echo "TIMES_RUN_MANIFEST=$manifest" >> "$GITHUB_ENV"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/capture-input-result.json",JSON.stringify({captureRunId:process.env.TIMES_CAPTURE_RUN_ID,runManifest:process.argv[1]},null,2)+"\n")' "$manifest"

      - name: Download and merge the selected Runtime job batch
        if: env.TIMES_CAPTURE_RUN_ID == '' && env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PROCESS_REPLAY != 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action restore-jobs \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-ids-file "$RUNNER_TEMP/runtime-job-ids.json" \
            > "$RUNNER_TEMP/runtime-job-input.json"
          node -e 'const fs=require("node:fs");const result=require(process.env.RUNNER_TEMP+"/runtime-job-input.json");fs.appendFileSync(process.env.GITHUB_ENV,`TIMES_RAW_REVISION=${result.rawRevision}\nTIMES_RUN_MANIFEST=${result.localRunManifest}\nTIMES_ARTICLE_IDS_FILE=${result.pendingArticlesFile}\n`);console.log(`Merged ${result.jobIds.length} Runtime jobs into batch ${result.anchorJobId}`)'

      - name: Build Canonical
        if: (env.TIMES_CAPTURE_RUN_ID != '' || env.TIMES_RUNTIME_HAS_WORK == 'true') && env.TIMES_PROCESS_REPLAY != 'true'
        run: |
          args=(
            --config tools/times-pipeline/sources.v2.json
            --output "$RUNNER_TEMP/jojo-times"
            --run-manifest "$TIMES_RUN_MANIFEST"
            --raw-revision "$TIMES_RAW_REVISION"
          )
          if [ -n "$TIMES_ARTICLE_IDS_FILE" ]; then
            args+=(--article-ids-file "$TIMES_ARTICLE_IDS_FILE")
          fi
          node "$TIMES_RUNTIME_ROOT/dist/src/process-cli.js" "${args[@]}" > "$RUNNER_TEMP/process-result.json"
          echo "TIMES_PROCESS_RESULT=$RUNNER_TEMP/process-result.json" >> "$GITHUB_ENV"
          if [ -z "$TIMES_DELIVERY_GENERATED_AT" ]; then
            echo "TIMES_DELIVERY_GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          fi

      - name: Report Canonical coverage
        if: env.TIMES_CAPTURE_RUN_ID != '' || env.TIMES_RUNTIME_HAS_WORK == 'true'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.TIMES_PROCESS_RESULT, "utf8"));
          const translation = report.translation || { enabled: false };
          console.log(`Translation: ${translation.enabled ? `${translation.translated} translated, ${translation.cacheHits} cached, ${translation.failed} failed, ${translation.deferred || 0} deferred (${translation.deadlineDeferred || 0} batch-deadline), ${translation.configuredProjects || 1} projects, ${translation.quotaKeySwitches || 0} quota switches, ${translation.transientKeySwitches || 0} transient switches, ${translation.rescueChunks || 0} structural rescues in ${(translation.durationMs / 1000).toFixed(1)}s` : "disabled"}`);
          for (const source of report.sources || []) {
            console.log(`${source.sourceId}: ${source.articles.length} canonical, ${source.unchangedArticles?.length || 0} unchanged, ${source.skippedArticles?.length || 0} excluded`);
            for (const article of source.skippedArticles || []) {
              const title = String(article.title || article.articleId).replace(/[\r\n|]/g, " ").slice(0, 180);
              const status = article.captureHttpStatus ? `HTTP ${article.captureHttpStatus}` : article.reason;
              console.log(`  ${article.reason}: ${title} | ${status} | ${article.canonicalUrl}`);
            }
          }
          NODE

      - name: Stage immutable Process generation before Delivery
        if: env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true' && env.TIMES_PROCESS_REPLAY != 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action stage-process \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            --job-ids-file "$RUNNER_TEMP/runtime-job-ids.json" \
            --process-result "$TIMES_PROCESS_RESULT" \
            --retention-days 8 \
            > "$RUNNER_TEMP/process-generation-result.json"
          node -e 'const fs=require("node:fs");const result=require(process.env.RUNNER_TEMP+"/process-generation-result.json");fs.appendFileSync(process.env.GITHUB_ENV,`TIMES_DELIVERY_GENERATED_AT=${result.stagedProcess.createdAt}\n`)'

      - name: Configure B2 and restore mutable Delivery indexes
        if: env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          rclone config create jojo-b2 b2 account "$B2_KEY_ID" key "$B2_APPLICATION_KEY" --non-interactive
          mkdir -p "$RUNNER_TEMP/previous-delivery"
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/source-ids.txt"
          import fs from "node:fs";
          import path from "node:path";
          const configPath = path.resolve("tools/times-pipeline/sources.v2.json");
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const sourceIds = new Set();
          for (const sourceFile of config.sourceFiles) {
            const source = JSON.parse(fs.readFileSync(path.resolve(path.dirname(configPath), sourceFile), "utf8"));
            if (source.enabled !== false) sourceIds.add(source.id);
          }
          for (const sourceId of [...sourceIds].sort()) console.log(sourceId);
          NODE
          while read -r source; do
            [ -n "$source" ] || continue
            object="content/newspapers/$source/index.jox"
            mkdir -p "$RUNNER_TEMP/previous-delivery/$(dirname "$object")"
            rclone copyto "$JOJO_DELIVERY_REMOTE/$object" "$RUNNER_TEMP/previous-delivery/$object"
          done < "$RUNNER_TEMP/source-ids.txt"
          rclone copyto "$JOJO_DELIVERY_REMOTE/content/timeline/index.jox" \
            "$RUNNER_TEMP/previous-delivery/content/timeline/index.jox"
          rclone copyto "$JOJO_DELIVERY_REMOTE/catalog.jox" "$RUNNER_TEMP/previous-delivery/catalog.jox"
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/process-dates.txt"
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(process.env.TIMES_PROCESS_RESULT, "utf8"));
          const dates = new Set(result.sources.flatMap((source) => source.dates));
          for (const date of [...dates].sort()) console.log(date);
          NODE
          while read -r date; do
            [ -n "$date" ] || continue
            object="content/timeline/dates/${date:0:4}/${date:5:2}/${date}.jox"
            mkdir -p "$RUNNER_TEMP/previous-delivery/$(dirname "$object")"
            rclone copyto "$JOJO_DELIVERY_REMOTE/$object" "$RUNNER_TEMP/previous-delivery/$object"
          done < "$RUNNER_TEMP/process-dates.txt"

      - name: Build per-source Delivery and global timeline
        if: env.TIMES_CAPTURE_RUN_ID != '' || env.TIMES_RUNTIME_HAS_WORK == 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/delivery-cli.js" \
            --config tools/times-pipeline/sources.v2.json \
            --output "$RUNNER_TEMP/jojo-times" \
            --process-result "$TIMES_PROCESS_RESULT" \
            --delivery-output "$RUNNER_TEMP/jojo-times-delivery" \
            --previous-delivery "$RUNNER_TEMP/previous-delivery" \
            --generated-at "$TIMES_DELIVERY_GENERATED_AT" \
            > "$RUNNER_TEMP/delivery-result.json"

      - name: Publish B2 Delivery in commit order
        if: env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          delivery="$RUNNER_TEMP/jojo-times-delivery"
          immutable_cache_control="$(node -p "encodeURIComponent('public, max-age=31536000, immutable')")"
          mutable_cache_control="$(node -p "encodeURIComponent('public, max-age=60, must-revalidate')")"
          if [[ "$immutable_cache_control" != 'public%2C%20max-age%3D31536000%2C%20immutable' \
            || "$mutable_cache_control" != 'public%2C%20max-age%3D60%2C%20must-revalidate' ]]; then
            echo "Failed to encode B2 Cache-Control metadata" >&2
            exit 1
          fi
          rclone copy "$delivery/content/newspapers" "$JOJO_DELIVERY_REMOTE/content/newspapers" \
            --include '*/articles/*.jox' --include '*/assets/*.jox' \
            --checksum --immutable --no-traverse --transfers 16 --header-upload "X-Bz-Info-b2-cache-control: $immutable_cache_control"
          rclone copy "$delivery/content/newspapers" "$JOJO_DELIVERY_REMOTE/content/newspapers" \
            --include '*/dates/**/*.jox' --include '*/index.jox' \
            --checksum --no-traverse --transfers 8 --header-upload "X-Bz-Info-b2-cache-control: $mutable_cache_control"
          rclone copy "$delivery/content/timeline/dates" "$JOJO_DELIVERY_REMOTE/content/timeline/dates" \
            --checksum --no-traverse --transfers 8 --header-upload "X-Bz-Info-b2-cache-control: $mutable_cache_control"
          rclone copyto "$delivery/content/timeline/index.jox" "$JOJO_DELIVERY_REMOTE/content/timeline/index.jox" \
            --checksum --header-upload "X-Bz-Info-b2-cache-control: $mutable_cache_control"
          rclone copyto "$delivery/catalog.jox" "$JOJO_DELIVERY_REMOTE/catalog.jox" \
            --checksum --header-upload "X-Bz-Info-b2-cache-control: $mutable_cache_control"

          origin_url="$(rclone link "$JOJO_DELIVERY_REMOTE/content/timeline/index.jox" --expire 5m)"
          curl --silent --show-error --fail \
            --dump-header "$RUNNER_TEMP/timeline-origin-headers.txt" \
            --output /dev/null \
            "$origin_url"
          if ! grep -Eiq '^cache-control:.*max-age=60([^0-9]|$)' "$RUNNER_TEMP/timeline-origin-headers.txt"; then
            echo "B2 did not expose the mutable timeline index with max-age=60" >&2
            exit 1
          fi
          echo "B2 serves the mutable timeline index with a 60-second cache policy."

      - name: Commit Process memory pointer after B2
        if: env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action promote-process \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            > "$RUNNER_TEMP/process-memory-result.json"

      - name: Mark Runtime job batch after successful delivery
        if: env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action mark-jobs \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-ids-file "$RUNNER_TEMP/runtime-job-ids.json" \
            --process-result "$TIMES_PROCESS_RESULT" \
            > "$RUNNER_TEMP/runtime-job-result.json"
          echo "TIMES_BATCH_COMMITTED=true" >> "$GITHUB_ENV"

      - name: Defer a failed Runtime job without blocking newer jobs
        if: failure() && env.TIMES_PUBLISH == 'true' && env.TIMES_CAPTURE_RUN_ID == '' && env.TIMES_RUNTIME_JOB_ID != ''
        continue-on-error: true
        run: |
          printf '%s\n' "Process workflow failed at ${GITHUB_JOB}; inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/runtime-failure.txt"
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action defer-job \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --job-id "$TIMES_RUNTIME_JOB_ID" \
            --reason-file "$RUNNER_TEMP/runtime-failure.txt"

      - name: Report a partial Runtime job as degraded
        if: success() && env.TIMES_RUNTIME_HAS_WORK == 'true' && env.TIMES_PUBLISH == 'true'
        run: |
          state="$(node -p 'require(process.env.RUNNER_TEMP + "/runtime-job-result.json").state')"
          if [ "$state" = 'partial' ]; then
            echo "Runtime batch is partial and retains articles for retry" >&2
            exit 1
          fi

      - name: Detect remaining Runtime work
        if: always() && env.TIMES_BATCH_COMMITTED == 'true' && env.TIMES_DRAIN == 'true'
        run: |
          node "$TIMES_RUNTIME_ROOT/dist/src/runtime-cli.js" \
            --action select-jobs \
            --bucket "$HF_TIMES_RUNTIME_BUCKET" \
            --output "$RUNNER_TEMP/jojo-times" \
            --work-directory "$RUNNER_TEMP/runtime" \
            --max-jobs 1 \
            --allow-empty true \
            > "$RUNNER_TEMP/runtime-drain-selection.json"
          node -e 'const fs=require("node:fs");const result=require(process.env.RUNNER_TEMP+"/runtime-drain-selection.json");fs.appendFileSync(process.env.GITHUB_ENV,`TIMES_QUEUE_REMAINS=${result.jobIds.length>0}\n`);console.log(result.jobIds.length?`Runtime work remains: ${result.jobIds[0]}`:"Runtime queue is drained")'

      - name: Continue draining Runtime jobs
        if: always() && env.TIMES_QUEUE_REMAINS == 'true' && env.TIMES_DRAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run maintenance-times-process.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TIMES_GITHUB_REF" \
            -f publish=true \
            -f drain=true \
            -f max_jobs="$TIMES_MAX_JOBS"

      - name: Upload dry-run Canonical and Delivery artifact
        if: env.TIMES_PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: times-canonical-delivery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jojo-times/canonical
            ${{ runner.temp }}/jojo-times-delivery
            ${{ runner.temp }}/runtime-job-input.json
            ${{ runner.temp }}/process-memory-restore.json
            ${{ runner.temp }}/capture-input-result.json
            ${{ runner.temp }}/process-result.json
            ${{ runner.temp }}/jojo-times/runtime/process-result.json
            ${{ runner.temp }}/delivery-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish processing summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = process.env.RUNNER_TEMP + "/delivery-result.json";
          console.log("## Times Canonical and Delivery\n");
          if (!fs.existsSync(path)) {
            console.log("Delivery result is missing.");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          console.log(`- Articles: ${report.articles}`);
          console.log(`- Sources: ${report.sources}`);
          console.log(`- Dates updated: ${report.dates.length}`);
          console.log(`- Timeline index: \`${report.timelineIndexObject}\``);
          console.log(`- Published: ${process.env.TIMES_PUBLISH === "true" ? "B2 + Runtime memory" : "no (artifact only)"}`);
          const processPath = process.env.TIMES_PROCESS_RESULT;
          const processed = processPath && fs.existsSync(processPath) ? JSON.parse(fs.readFileSync(processPath, "utf8")) : undefined;
          const unchanged = processed?.sources?.flatMap((source) => source.unchangedArticles || []) || [];
          const skipped = processed?.sources?.flatMap((source) => source.skippedArticles || []) || [];
          const processingFailures = processed?.sources?.flatMap((source) => source.processingFailures || []) || [];
          const translation = processed?.translation || { enabled: false };
          console.log(`- Translation: ${translation.enabled ? `${translation.translated} translated, ${translation.cacheHits} cached, ${translation.failed} failed, ${translation.deferred || 0} deferred (${translation.deadlineDeferred || 0} batch-deadline), ${translation.configuredProjects || 1} projects, ${translation.quotaKeySwitches || 0} quota switches, ${translation.transientKeySwitches || 0} transient switches, ${translation.rescueChunks || 0} structural rescues, ${(translation.durationMs / 1000).toFixed(1)}s` : "disabled"}`);
          console.log(`- Unchanged without refresh: ${unchanged.length}`);
          console.log(`- Excluded from Delivery: ${skipped.length}`);
          console.log(`- Deferred Process failures: ${processingFailures.length}`);
          if (processingFailures.length) {
            console.log("\n### Articles retained for Process retry\n");
            for (const article of processingFailures) {
              const title = String(article.title || article.articleId).replace(/[\r\n|]/g, " ").slice(0, 180);
              console.log(`- **${article.sourceId}**: [${title}](${article.canonicalUrl}) — ${String(article.error || "process-error").slice(0, 300)}`);
            }
          }
          if (skipped.length) {
            console.log("\n### Articles excluded from Delivery\n");
            for (const article of skipped) {
              const title = String(article.title || article.articleId).replace(/[\r\n|]/g, " ").slice(0, 180);
              const status = article.captureHttpStatus ? `HTTP ${article.captureHttpStatus}` : article.reason;
              console.log(`- **${article.reason}**: [${title}](${article.canonicalUrl}) — ${status}`);
            }
          }
          NODE

      - name: Report automatic Times pipeline outcome
        if: ${{ always() && github.event_name == 'workflow_run' }}
        continue-on-error: true
        env:
          HEALTHCHECKS_PING_URL: ${{ env.HEALTHCHECKS_TIMES_PIPELINE_URL }}
          HEALTHCHECKS_SIGNAL: ${{ job.status == 'success' && 'success' || 'fail' }}
          HEALTHCHECKS_TASK_ID: times-capture
          HEALTHCHECKS_STAGE: times-process
          HEALTHCHECKS_STATUS: ${{ job.status }}
          HEALTHCHECKS_FAILURE_TYPE: ${{ job.status == 'success' && '' || 'run-failed' }}
          HEALTHCHECKS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/monitoring/ping-healthchecks.sh
