[project]
name = "jojo-press-engine"
version = "0.1.0"
description = "Minimal FastAPI engine for jojo-press"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "jsonschema>=4.0",
  "pydantic>=2.0,<3.0",
  "PyPDF2>=3.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "starlette<0.37",
  "httpx<0.28",
  "uvicorn[standard]>=0.30"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
