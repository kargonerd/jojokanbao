name: Deploy web

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET_NAME: ${{ secrets.COS_BUCKET_NAME }}
      COS_BUCKET_REGION: ${{ secrets.COS_BUCKET_REGION }}
      COS_UPLOAD_FROM_PATH: ./dist/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install coscmd

      - name: Build
        run: npm run build

      - name: Deploy to Tencent COS
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET_NAME" -r "$COS_BUCKET_REGION"
          coscmd delete -rf css || true
          coscmd delete -rf fonts || true
          coscmd delete -rf js || true
          # 排除.map文件，上传其他文件
          find "$COS_UPLOAD_FROM_PATH" -name "*.map" -delete
          coscmd upload -r "$COS_UPLOAD_FROM_PATH" /
