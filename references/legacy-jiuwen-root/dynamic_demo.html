<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态新闻合订本生成器 - 实体溯源版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
        .log-container {
            font-family: 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #10b981;
            background-color: #111827;
            padding: 1.25rem;
            border-radius: 0.75rem;
            overflow-y: auto;
            max-height: 500px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #374151;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: #1f2937; }
        .log-container::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .entity-card {
            transition: all 0.2s;
            cursor: pointer;
        }
        .entity-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .entity-card.selected {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border p-6 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-1">
                <h1 class="text-2xl font-black text-slate-900 flex items-center gap-2">
                    <span class="text-3xl">🕵️‍♂️</span> 动态新闻合订本分析器
                </h1>
                <p class="text-slate-500 text-sm italic">抽取实体 → 选择追溯 → 生成历史时间线</p>
            </div>
            
            <div class="flex w-full md:w-auto gap-2">
                <input type="url" id="urlInput" class="flex-1 md:w-96 border-2 border-slate-200 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm" placeholder="粘贴新闻链接 (例如: NYT 2026年登月稿)">
                <button id="extractBtn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-200 disabled:opacity-50">
                    抽取实体
                </button>
            </div>
        </div>

        <!-- Step 1: Entity Selection -->
        <div id="entitySection" class="hidden bg-white rounded-2xl shadow-sm border p-6">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">📰 <span id="articleTitle">文章标题</span></h2>
                    <p class="text-sm text-slate-500 mt-1">选择以下实体进行历史溯源（点击选择）</p>
                </div>
                <button id="generateBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white px-6 py-2 rounded-lg font-bold transition-all disabled:opacity-50">
                    生成合订本
                </button>
            </div>
            
            <div id="entityList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Entities will be inserted here -->
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Side: Logs -->
            <div class="space-y-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="font-black text-slate-700 uppercase tracking-widest text-xs flex items-center gap-2">
                        <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                        AI 思考与执行日志 (实时推送)
                    </h3>
                    <span id="statusBadge" class="hidden text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded uppercase">执行中</span>
                </div>
                <div id="logOutput" class="log-container">等待任务启动...</div>
            </div>

            <!-- Right Side: Result -->
            <div class="space-y-4">
                <h3 class="font-black text-slate-700 uppercase tracking-widest text-xs px-2">分析结果 (合订本可视化)</h3>
                <div id="resultArea" class="bg-white rounded-2xl border-2 border-slate-200 min-h-[500px] flex items-center justify-center relative overflow-hidden">
                    <!-- Loading Placeholder -->
                    <div id="resultPlaceholder" class="text-center space-y-4 z-10 p-8">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-2xl">⏳</div>
                        <p class="text-slate-400 font-medium italic">请先输入新闻链接并抽取实体...</p>
                    </div>
                    <!-- Actual Content -->
                    <div id="outputContent" class="hidden w-full h-full p-4 overflow-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUrl = '';
        let selectedEntity = null;
        let extractedEntities = [];

        function stripAnsi(str) {
            return str.replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, '');
        }

        // Step 1: Extract Entities
        document.getElementById('extractBtn').addEventListener('click', async () => {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('请输入链接');
            
            currentUrl = url;
            const btn = document.getElementById('extractBtn');
            const logOutput = document.getElementById('logOutput');

            btn.disabled = true;
            logOutput.textContent = '[SYSTEM] 正在抓取新闻并抽取实体...\n';

            try {
                const response = await fetch(`http://localhost:8081/extract_entities?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                extractedEntities = data.entities || [];
                
                // Display article title
                document.getElementById('articleTitle').textContent = data.title || '未识别标题';
                
                // Display entities
                displayEntities(extractedEntities);
                
                // Show entity section
                document.getElementById('entitySection').classList.remove('hidden');
                
                logOutput.textContent += `[SYSTEM] 成功抽取 ${extractedEntities.length} 个实体\n`;
                
                // Scroll to entity section
                document.getElementById('entitySection').scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                logOutput.textContent += `\n<span class="text-red-500 font-bold">[ERROR] ${error.message}</span>\n`;
            } finally {
                btn.disabled = false;
            }
        });

        function displayEntities(entities) {
            const container = document.getElementById('entityList');
            container.innerHTML = '';

            if (entities.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-slate-500 py-8">未识别到实体</div>';
                return;
            }

            entities.forEach((entity, index) => {
                const card = document.createElement('div');
                card.className = 'entity-card bg-slate-50 border-2 border-slate-200 rounded-xl p-4';
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg shrink-0">
                            ${getEntityIcon(entity.type)}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-900 truncate">${entity.name}</h4>
                                <span class="text-xs px-2 py-0.5 bg-slate-200 text-slate-600 rounded-full">${entity.type}</span>
                            </div>
                            <p class="text-sm text-slate-600 mt-1 line-clamp-2">${entity.description}</p>
                            <p class="text-xs text-blue-600 mt-2">💡 ${entity.reason}</p>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => selectEntity(index));
                container.appendChild(card);
            });
        }

        function getEntityIcon(type) {
            const icons = {
                '人名': '👤',
                '机构': '🏢',
                '政策': '📜',
                '事件': '📅',
                '概念': '💡',
                '其他': '📌'
            };
            return icons[type] || '📌';
        }

        function selectEntity(index) {
            const cards = document.querySelectorAll('.entity-card');
            cards.forEach((card, i) => {
                if (i === index) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });

            selectedEntity = extractedEntities[index];
            
            // Show generate button
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.classList.remove('hidden');
            generateBtn.textContent = `生成 "${selectedEntity.name}" 的合订本`;
        }

        // Step 2: Generate Timeline
        document.getElementById('generateBtn').addEventListener('click', () => {
            if (!selectedEntity) return alert('请先选择一个实体');
            
            const btn = document.getElementById('generateBtn');
            const statusBadge = document.getElementById('statusBadge');
            const resultPlaceholder = document.getElementById('resultPlaceholder');
            const outputContent = document.getElementById('outputContent');
            const logOutput = document.getElementById('logOutput');

            btn.disabled = true;
            statusBadge.classList.remove('hidden');
            resultPlaceholder.classList.add('hidden');
            outputContent.classList.add('hidden');
            logOutput.textContent = `[SYSTEM] 开始追溯实体: ${selectedEntity.name}\n`;

            const sseUrl = `http://localhost:8081/generate_stream?url=${encodeURIComponent(currentUrl)}&entity=${encodeURIComponent(selectedEntity.name)}&type=${encodeURIComponent(selectedEntity.type)}`;
            const eventSource = new EventSource(sseUrl);

            eventSource.addEventListener('log', (e) => {
                const data = JSON.parse(e.data);
                const cleanText = stripAnsi(data.text);
                logOutput.textContent += cleanText;
                logOutput.scrollTop = logOutput.scrollHeight;
            });

            eventSource.addEventListener('result', (e) => {
                const data = JSON.parse(e.data);
                
                statusBadge.textContent = '完成';
                statusBadge.className = 'text-[10px] font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded uppercase';
                
                resultPlaceholder.classList.add('hidden');
                outputContent.classList.remove('hidden');
                outputContent.innerHTML = data.html;

                eventSource.close();
                btn.disabled = false;
            });

            eventSource.addEventListener('error', (e) => {
                let errorMsg = '连接中断或服务异常。';
                if (e.data) {
                    try { errorMsg = JSON.parse(e.data).message; } catch (err) {}
                }
                logOutput.innerHTML += `\n<span class="text-red-500 font-bold">[CRITICAL ERROR] ${errorMsg}</span>\n`;
                
                statusBadge.textContent = '失败';
                statusBadge.className = 'text-[10px] font-bold bg-red-100 text-red-700 px-2 py-0.5 rounded uppercase';
                
                eventSource.close();
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
