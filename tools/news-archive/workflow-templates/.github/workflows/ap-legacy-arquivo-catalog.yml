name: AP legacy Arquivo catalog

run-name: >-
  ap-legacy-arquivo-${{ inputs.from_year }}-${{ inputs.to_year }}

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "First AP publication year to include."
        required: true
        default: "2010"
        type: string
      to_year:
        description: "Last AP publication year to include."
        required: true
        default: "2011"
        type: string
      capture_from_year:
        description: "First Arquivo.pt capture year to query."
        required: true
        default: "2011"
        type: string
      capture_to_year:
        description: "Last Arquivo.pt capture year to query."
        required: true
        default: "2011"
        type: string
      recovery_workers:
        description: "Concurrent page-metadata recovery requests."
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ap-legacy-arquivo-${{ inputs.from_year }}-${{ inputs.to_year }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  FROM_YEAR: ${{ inputs.from_year }}
  TO_YEAR: ${{ inputs.to_year }}
  CAPTURE_FROM_YEAR: ${{ inputs.capture_from_year }}
  CAPTURE_TO_YEAR: ${{ inputs.capture_to_year }}
  RECOVERY_WORKERS: ${{ inputs.recovery_workers }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r tools/news-archive/requirements.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Resolve catalog paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for value in "$FROM_YEAR" "$TO_YEAR" \
              "$CAPTURE_FROM_YEAR" "$CAPTURE_TO_YEAR"; do
            if ! [[ "$value" =~ ^20[0-9]{2}$ ]]; then
              echo "All year inputs must use YYYY format." >&2
              exit 2
            fi
          done
          if [ "$FROM_YEAR" -gt "$TO_YEAR" ] ||
             [ "$CAPTURE_FROM_YEAR" -gt "$CAPTURE_TO_YEAR" ]; then
            echo "Invalid publication or capture window." >&2
            exit 2
          fi
          if ! [[ "$RECOVERY_WORKERS" =~ ^[1-9][0-9]*$ ]]; then
            echo "recovery_workers must be positive." >&2
            exit 2
          fi
          local_root="$RUNNER_TEMP/ap-legacy-${FROM_YEAR}-${TO_YEAR}"
          # AP legacy supplements are merged from the canonical pre-2016
          # source window by parser validation, regardless of the bounded
          # publication range used for this discovery run.
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/ap/2010-2015/legacy-archive"
          mkdir -p "$local_root/catalog" "$local_root/state"
          {
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Build validated Arquivo.pt supplemental manifest
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python tools/news-archive/tools/build_ap_legacy_arquivo_manifest.py \
            --output "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --capture-from-year "$CAPTURE_FROM_YEAR" \
            --capture-to-year "$CAPTURE_TO_YEAR" \
            --recovery-workers "$RECOVERY_WORKERS" \
            > "$LOCAL_ROOT/state/summary.json"
          gzip -t "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          test -s "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --publisher ap \
            --output "$LOCAL_ROOT/catalog/manifest-summary.json"

      - name: Publish manifest and summary
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          rclone copyto \
            "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/catalog/manifest-summary.json" \
            "${REMOTE_ROOT}/catalog/manifest-summary.json" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/state/summary.json" \
            "${REMOTE_ROOT}/state/summary.json" \
            --retries 8 --low-level-retries 20

      - name: Report catalog result
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          {
            echo "### AP legacy Arquivo catalog"
            echo
            echo '```json'
            cat "$LOCAL_ROOT/state/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
