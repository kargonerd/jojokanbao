name: NPR official archive catalog

run-name: npr-official-archive-${{ inputs.year }}

on:
  workflow_dispatch:
    inputs:
      year:
        description: "NPR publication year to enumerate."
        required: true
        default: "2014"
        type: string
      max_pages:
        description: "Maximum official archive pages in this bounded run."
        required: true
        default: "300"
        type: string
      auto_continue:
        description: "Dispatch the next bounded run after checkpointing."
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: npr-official-archive-${{ inputs.year }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  SAMPLE_YEAR: ${{ inputs.year }}
  MAX_PAGES: ${{ inputs.max_pages }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r tools/news-archive/requirements.txt
          if ! timeout 120 sudo apt-get update || \
             ! timeout 120 sudo apt-get install -y rclone; then
            rclone_tmp="$(mktemp -d)"
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip \
              -o "$rclone_tmp/rclone.zip"
            unzip -q "$rclone_tmp/rclone.zip" -d "$rclone_tmp"
            sudo install -m 0755 "$rclone_tmp"/rclone-*/rclone /usr/local/bin/rclone
          fi

      - name: Validate inputs and private storage
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SAMPLE_YEAR" =~ ^20[0-9]{2}$ ]]; then
            echo "year must be a four-digit year from 2000 onward." >&2
            exit 2
          fi
          if ! [[ "$MAX_PAGES" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_pages must be positive." >&2
            exit 2
          fi
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive
          local_root="$RUNNER_TEMP/npr-official-archive-$SAMPLE_YEAR"
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/npr/${SAMPLE_YEAR}-${SAMPLE_YEAR}/official-archive"
          mkdir -p "$local_root/catalog" "$local_root/state"
          {
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Restore discovery checkpoint
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if rclone lsf "${REMOTE_ROOT}/catalog" --files-only 2>/dev/null \
              | grep -Fxq "discovery.sqlite3.gz"; then
            rclone copyto \
              "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
              "$RUNNER_TEMP/discovery.sqlite3.gz" \
              --retries 8 --low-level-retries 20
            gzip -dc "$RUNNER_TEMP/discovery.sqlite3.gz" \
              > "$LOCAL_ROOT/catalog/discovery.sqlite3"
          fi

      - name: Advance bounded official archive discovery
        id: discovery
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python tools/news-archive/tools/build_npr_archive_manifest.py \
            --from-year "$SAMPLE_YEAR" \
            --to-year "$SAMPLE_YEAR" \
            --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            --output "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --summary "$LOCAL_ROOT/state/summary.json" \
            --max-pages "$MAX_PAGES" \
            --min-request-interval 1.0 \
            --timeout 45 \
            --attempts 4 \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish manifest and checkpoint
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --publisher npr \
            --output "$LOCAL_ROOT/catalog/manifest-summary.json"
          python tools/news-archive/tools/checkpoint_capture_state.py \
            --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            --output "$RUNNER_TEMP/discovery.sqlite3.gz"
          rclone copyto "$RUNNER_TEMP/discovery.sqlite3.gz" \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            --retries 8 --low-level-retries 20
          for name in manifest.jsonl.gz manifest-summary.json; do
            rclone copyto "$LOCAL_ROOT/catalog/$name" \
              "${REMOTE_ROOT}/catalog/$name" \
              --retries 8 --low-level-retries 20
          done
          rclone copyto "$LOCAL_ROOT/state/summary.json" \
            "${REMOTE_ROOT}/state/summary.json" \
            --retries 8 --low-level-retries 20

      - name: Report catalog progress
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          {
            echo "### NPR $SAMPLE_YEAR official archive catalog"
            echo
            echo '```json'
            cat "$LOCAL_ROOT/state/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch next bounded run
        if: >-
          ${{
            inputs.auto_continue &&
            steps.discovery.outputs.should_continue == 'true' &&
            (
              steps.discovery.outputs.pages != '0' ||
              steps.discovery.outputs.errors != '0'
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run npr-official-archive-catalog.yml \
            --ref "$GITHUB_REF_NAME" \
            -f year="$SAMPLE_YEAR" \
            -f max_pages="$MAX_PAGES" \
            -f auto_continue=true

      - name: Wake parser validation watchdog
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/kick-parser-watchdog.sh
