name: News archive watchdog

on:
  schedule:
    # Offset from parser-validation-watchdog (17,47) so both planners do not
    # race while filling the same two sustained-work slots.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: news-archive-watchdog
  cancel-in-progress: false

env:
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  MAX_STANDARD_CONCURRENCY: "2"
  MAX_DISPATCH_PER_RUN: "2"
  DISPATCH_REF: ${{ github.ref_name }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Fill available catalog slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/runs.json"
          active_titles="$RUNNER_TEMP/active-titles.txt"
          # High-frequency Common Crawl chains can occupy the first 100
          # repository results. Scope the scan to this dispatch ref and keep
          # a large page so active catalog/parser jobs are not missed.
          gh run list --repo "$GITHUB_REPOSITORY" \
            --branch "$DISPATCH_REF" --limit 1000 \
            --json status,displayTitle > "$runs"
          jq -r '
            .[]
            | select(
                .status == "in_progress"
                or .status == "queued"
                or .status == "waiting"
                or .status == "pending"
                or .status == "requested"
              )
            | .displayTitle
            | select(
                startswith("news-raw-")
                or contains("-common-crawl-")
                or startswith("parser-")
              )
          ' "$runs" > "$active_titles"
          active_count="$(wc -l < "$active_titles")"
          available=$((MAX_STANDARD_CONCURRENCY - active_count))
          if [ "$available" -lt 1 ]; then
            echo "No sustained catalog/validation slot is available."
            exit 0
          fi
          if [ "$available" -gt "$MAX_DISPATCH_PER_RUN" ]; then
            available="$MAX_DISPATCH_PER_RUN"
          fi

          # Ordered by the current convergence objective. Catalog completion
          # is read from B2 before dispatch, so a finished shard cannot starve
          # later entries. These jobs intentionally capture zero articles:
          # formal validation stores only its selected canonical raw samples,
          # while catalog discovery itself stays compact and resumable.
          #
          # Keep every in-scope publisher eligible. These are catalog-only
          # passes, so a thin or exhausted shard can be recorded without
          # downloading a second copy of the formal validation cohort. The
          # parser-validation watchdog independently decides whether a year
          # has enough unseen candidates for its 800-row sample.
          queue='[
            {"kind":"common-crawl","publisher":"aljazeera","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest","pages":"1","queries":"8","hydrations":"200","target":"1200","runner":"ubuntu-latest"},
            {"kind":"common-crawl","publisher":"scmp","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest","pages":"1","queries":"8","hydrations":"200","target":"1200","runner":"ubuntu-latest"},
            {"kind":"common-crawl","publisher":"aljazeera","fromYear":"2010","toYear":"2015","collectionFromYear":"2013","collectionToYear":"2016","collectionOrder":"oldest","pages":"1","queries":"8","hydrations":"200","target":"1200","runner":"ubuntu-latest"},
            {"kind":"common-crawl","publisher":"scmp","fromYear":"2010","toYear":"2015","collectionFromYear":"2013","collectionToYear":"2016","collectionOrder":"oldest","pages":"1","queries":"8","hydrations":"200","target":"1200","runner":"ubuntu-latest"},
            {"publisher":"axios","fromYear":"2017","toYear":"2026","mode":"sitemap-wayback","units":"30","runner":"ubuntu-latest"},
            {"publisher":"axios","fromYear":"2017","toYear":"2026","mode":"wayback-urlkey","units":"5","runner":"ubuntu-latest"},
            {"publisher":"ft","fromYear":"2010","toYear":"2015","mode":"sitemap-wayback","units":"1","runner":"ubuntu-latest"},
            {"publisher":"ft","fromYear":"2016","toYear":"2026","mode":"sitemap-wayback","units":"1","runner":"ubuntu-latest"},
            {"publisher":"wsj","fromYear":"2010","toYear":"2015","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"wsj","fromYear":"2016","toYear":"2026","mode":"wayback","units":"10","runner":"ubuntu-latest"},
            {"publisher":"nyt","fromYear":"2010","toYear":"2015","mode":"sitemap-wayback","units":"5","runner":"ubuntu-latest"},
            {"publisher":"nyt","fromYear":"2016","toYear":"2026","mode":"sitemap-wayback","units":"5","runner":"ubuntu-latest"},
            {"publisher":"ap","fromYear":"2010","toYear":"2015","mode":"sitemap-wayback","units":"5","runner":"ubuntu-latest"},
            {"publisher":"ap","fromYear":"2016","toYear":"2026","mode":"sitemap-wayback","units":"5","runner":"ubuntu-latest"},
            {"publisher":"npr","fromYear":"2010","toYear":"2015","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"npr","fromYear":"2016","toYear":"2026","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"nikkei","fromYear":"2010","toYear":"2015","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"nikkei","fromYear":"2016","toYear":"2026","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"zaobao","fromYear":"2016","toYear":"2026","mode":"sitemap-wayback","units":"30","runner":"ubuntu-latest"},
            {"publisher":"aljazeera","fromYear":"2010","toYear":"2015","mode":"sitemap-wayback","units":"30","runner":"ubuntu-latest"},
            {"publisher":"aljazeera","fromYear":"2016","toYear":"2026","mode":"sitemap-wayback","units":"30","runner":"ubuntu-latest"},
            {"publisher":"scmp","fromYear":"2010","toYear":"2015","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"},
            {"publisher":"scmp","fromYear":"2016","toYear":"2026","mode":"wayback-urlkey","units":"10","runner":"ubuntu-latest"}
          ]'

          dispatched=0
          while IFS= read -r task; do
            kind="$(jq -r '.kind // "archive"' <<<"$task")"
            publisher="$(jq -r '.publisher' <<<"$task")"
            from_year="$(jq -r '.fromYear' <<<"$task")"
            to_year="$(jq -r '.toYear' <<<"$task")"
            runner="$(jq -r '.runner' <<<"$task")"
            if [ "$kind" = "common-crawl" ]; then
              title="${publisher}-common-crawl-${from_year}-${to_year}"
              if grep -Fxq "$title" "$active_titles"; then
                echo "Common Crawl chain already active: $title"
                continue
              fi
              source_root="${publisher}/${from_year}-${to_year}/commoncrawl-prefix"
              summary="$RUNNER_TEMP/common-crawl-summary-${publisher}-${from_year}-${to_year}.json"
              if rclone copyto \
                  "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/state/summary.json" \
                  "$summary" \
                  --timeout 20s --contimeout 10s \
                  --retries 1 --low-level-retries 1 \
                  >/dev/null 2>&1 \
                && jq -e '.shouldContinue == false' "$summary" >/dev/null; then
                echo "Common Crawl catalog already complete: $title"
                continue
              fi
              gh workflow run nikkei-common-crawl-catalog.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$DISPATCH_REF" \
                -f publisher="$publisher" \
                -f from_year="$from_year" \
                -f to_year="$to_year" \
                -f collection_from_year="$(jq -r '.collectionFromYear' <<<"$task")" \
                -f collection_to_year="$(jq -r '.collectionToYear' <<<"$task")" \
                -f collection_order="$(jq -r '.collectionOrder' <<<"$task")" \
                -f max_pages="$(jq -r '.pages' <<<"$task")" \
                -f max_queries="$(jq -r '.queries' <<<"$task")" \
                -f max_hydrations="$(jq -r '.hydrations' <<<"$task")" \
                -f target_articles_per_year="$(jq -r '.target' <<<"$task")" \
                -f auto_continue=true
              echo "Dispatched Common Crawl catalog: $title"
              dispatched=$((dispatched + 1))
              if [ "$dispatched" -ge "$available" ]; then
                break
              fi
              continue
            fi
            mode="$(jq -r '.mode' <<<"$task")"
            units="$(jq -r '.units' <<<"$task")"
            title="news-raw-${publisher}-${from_year}-${to_year}-${mode}"
            if grep -Fxq "$title" "$active_titles"; then
              echo "Shard already active: $title"
              continue
            fi

            source_root="${publisher}/${from_year}-${to_year}/${mode}"
            status="$RUNNER_TEMP/catalog-status-${publisher}-${from_year}-${to_year}-${mode}.json"
            summary="$RUNNER_TEMP/manifest-summary-${publisher}-${from_year}-${to_year}-${mode}.json"
            catalog_complete=false
            if rclone copyto \
                "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/status.json" \
                "$status" \
                --timeout 20s --contimeout 10s \
                --retries 1 --low-level-retries 1 \
                >/dev/null 2>&1; then
              if jq -e \
                  --arg publisher "$publisher" \
                  --argjson from_year "$from_year" \
                  --argjson to_year "$to_year" \
                  --arg mode "$mode" \
                  '.formatVersion == "jojo-source-catalog-status/1"
                    and .publisher == $publisher
                    and .fromYear == $from_year
                    and .toYear == $to_year
                    and .manifestMode == $mode
                    and .complete == true
                    and .shouldContinue == false' \
                  "$status" >/dev/null; then
                catalog_complete=true
              fi
            elif rclone copyto \
                "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/manifest-summary.json" \
                "$summary" \
                --timeout 20s --contimeout 10s \
                --retries 1 --low-level-retries 1 \
                >/dev/null 2>&1; then
              # Compatibility for any pre-status sidecar that explicitly
              # carried a completion bit. Ordinary manifest summaries only
              # describe capacity and must not be treated as completion.
              if jq -e '.complete == true' "$summary" >/dev/null; then
                catalog_complete=true
              fi
            fi
            if [ "$catalog_complete" = true ]; then
              echo "Catalog already complete: $title"
              continue
            fi

            gh workflow run news-raw-archive.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$DISPATCH_REF" \
              -f publisher="$publisher" \
              -f from_year="$from_year" \
              -f to_year="$to_year" \
              -f manifest_mode="$mode" \
              -f max_discovery_pages="$units" \
              -f max_captures=0 \
              -f workers=4 \
              -f max_runtime_minutes=300 \
              -f auto_continue=true \
              -f runner_os="$runner"
            echo "Dispatched catalog-only shard: $title"
            dispatched=$((dispatched + 1))
            if [ "$dispatched" -ge "$available" ]; then
              break
            fi
          done < <(jq -c '.[]' <<<"$queue")
          echo "Dispatched $dispatched catalog task(s); active before=$active_count."
