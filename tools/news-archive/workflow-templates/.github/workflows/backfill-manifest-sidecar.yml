name: Backfill manifest capacity sidecar

run-name: >-
  manifest-sidecar-${{ inputs.publisher }}-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.manifest_mode }}

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Publisher whose existing manifest needs a capacity sidecar."
        required: true
        type: string
      from_year:
        description: "Manifest window start year."
        required: true
        type: string
      to_year:
        description: "Manifest window end year."
        required: true
        type: string
      manifest_mode:
        description: "Existing manifest mode."
        required: true
        default: "sitemap-wayback"
        type: string

permissions:
  contents: read

concurrency:
  group: manifest-sidecar-${{ inputs.publisher }}-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.manifest_mode }}
  cancel-in-progress: false

env:
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Summarize existing manifest and publish sidecar
        env:
          PUBLISHER: ${{ inputs.publisher }}
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          MANIFEST_MODE: ${{ inputs.manifest_mode }}
        run: |
          set -euo pipefail
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${PUBLISHER}/${FROM_YEAR}-${TO_YEAR}/${MANIFEST_MODE}"
          manifest="$RUNNER_TEMP/manifest.jsonl.gz"
          summary="$RUNNER_TEMP/manifest-summary.json"
          rclone copyto \
            "${remote_root}/catalog/manifest.jsonl.gz" \
            "$manifest" \
            --retries 8 --low-level-retries 20
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$manifest" \
            --publisher "$PUBLISHER" \
            --output "$summary"
          rclone copyto \
            "$summary" \
            "${remote_root}/catalog/manifest-summary.json" \
            --retries 8 --low-level-retries 20
          cat "$summary"
