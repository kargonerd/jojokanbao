name: Publisher Common Crawl catalog

run-name: >-
  ${{ inputs.publisher }}-${{ inputs.source_variant }}-common-crawl-${{ inputs.from_year }}-${{ inputs.to_year }}

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Configured publisher identifier."
        required: true
        default: "nikkei"
        type: string
      source_variant:
        description: "Canonical source or an isolated capacity probe."
        required: true
        default: "canonical"
        type: choice
        options:
          - canonical
          - nikkei-asia-probe
          - wsj-legacy-probe
      from_year:
        description: "First publication year to retain."
        required: true
        default: "2010"
        type: string
      to_year:
        description: "Last publication year to retain."
        required: true
        default: "2015"
        type: string
      collection_from_year:
        description: "First Common Crawl collection year to inspect."
        required: true
        default: "2013"
        type: string
      collection_to_year:
        description: "Last Common Crawl collection year to inspect."
        required: true
        default: "2016"
        type: string
      collection_order:
        description: "Order in which Common Crawl collections are advanced."
        required: true
        default: "oldest"
        type: choice
        options:
          - oldest
          - newest
      max_pages:
        description: "Maximum Common Crawl index pages in this bounded run."
        required: true
        default: "1"
        type: string
      max_queries:
        description: "Maximum prefix-query advances, including empty indexes."
        required: true
        default: "8"
        type: string
      max_hydrations:
        description: "Maximum WARC pages used to recover publication dates."
        required: true
        default: "200"
        type: string
      target_articles_per_year:
        description: "Stop catalog discovery after this many URLs per publication year."
        required: true
        default: "1200"
        type: string
      auto_continue:
        description: "Dispatch the next bounded run after checkpointing."
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: >-
    ${{ inputs.publisher }}-${{ inputs.source_variant }}-common-crawl-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.collection_from_year }}-${{ inputs.collection_to_year }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  PUBLISHER: ${{ inputs.publisher }}
  SOURCE_VARIANT: ${{ inputs.source_variant }}
  FROM_YEAR: ${{ inputs.from_year }}
  TO_YEAR: ${{ inputs.to_year }}
  COLLECTION_FROM_YEAR: ${{ inputs.collection_from_year }}
  COLLECTION_TO_YEAR: ${{ inputs.collection_to_year }}
  COLLECTION_ORDER: ${{ inputs.collection_order }}
  MAX_PAGES: ${{ inputs.max_pages }}
  MAX_QUERIES: ${{ inputs.max_queries }}
  MAX_HYDRATIONS: ${{ inputs.max_hydrations }}
  TARGET_ARTICLES_PER_YEAR: ${{ inputs.target_articles_per_year }}
  AUTO_CONTINUE: ${{ inputs.auto_continue }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r tools/news-archive/requirements.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Resolve catalog paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for value in "$FROM_YEAR" "$TO_YEAR" \
              "$COLLECTION_FROM_YEAR" "$COLLECTION_TO_YEAR"; do
            if ! [[ "$value" =~ ^20[0-9]{2}$ ]]; then
              echo "All year inputs must be four-digit years." >&2
              exit 2
            fi
          done
          if [ "$FROM_YEAR" -gt "$TO_YEAR" ] || \
             [ "$COLLECTION_FROM_YEAR" -gt "$COLLECTION_TO_YEAR" ]; then
            echo "Invalid publication or collection window." >&2
            exit 2
          fi
          if ! [[ "$PUBLISHER" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "publisher must be a lowercase configured identifier." >&2
            exit 2
          fi
          if [[ "$SOURCE_VARIANT" != "canonical" && \
                "$SOURCE_VARIANT" != "nikkei-asia-probe" && \
                "$SOURCE_VARIANT" != "wsj-legacy-probe" ]]; then
            echo "unsupported source_variant: $SOURCE_VARIANT" >&2
            exit 2
          fi
          if [[ "$SOURCE_VARIANT" = "nikkei-asia-probe" && \
                "$PUBLISHER" != "nikkei" ]]; then
            echo "nikkei-asia-probe requires publisher=nikkei" >&2
            exit 2
          fi
          if [[ "$SOURCE_VARIANT" = "wsj-legacy-probe" && \
                "$PUBLISHER" != "wsj" ]]; then
            echo "wsj-legacy-probe requires publisher=wsj" >&2
            exit 2
          fi
          if [[ "$COLLECTION_ORDER" != "oldest" && \
                "$COLLECTION_ORDER" != "newest" ]]; then
            echo "collection_order must be oldest or newest." >&2
            exit 2
          fi
          for value in "$MAX_PAGES" "$MAX_QUERIES" \
              "$TARGET_ARTICLES_PER_YEAR"; do
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "All batch limits must be positive." >&2
              exit 2
            fi
          done
          if ! [[ "$MAX_HYDRATIONS" =~ ^[0-9]+$ ]]; then
            echo "max_hydrations must be non-negative." >&2
            exit 2
          fi
          local_root="$RUNNER_TEMP/${PUBLISHER}-common-crawl-${FROM_YEAR}-${TO_YEAR}"
          remote_mode="commoncrawl-prefix"
          if [ "$SOURCE_VARIANT" = "nikkei-asia-probe" ]; then
            remote_mode="commoncrawl-asia-probe"
          fi
          if [ "$SOURCE_VARIANT" = "wsj-legacy-probe" ]; then
            remote_mode="commoncrawl-legacy-probe"
          fi
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${PUBLISHER}/${FROM_YEAR}-${TO_YEAR}/${remote_mode}"
          mkdir -p "$local_root/catalog" "$local_root/state"
          {
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Restore discovery checkpoint
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if rclone lsf "${REMOTE_ROOT}/catalog" --files-only \
              | grep -Fxq "discovery.sqlite3.gz"; then
            rclone copyto \
              "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
              "$RUNNER_TEMP/discovery.sqlite3.gz" \
              --retries 8 --low-level-retries 20
            gzip -dc "$RUNNER_TEMP/discovery.sqlite3.gz" \
              > "$LOCAL_ROOT/catalog/discovery.sqlite3"
          fi

      - name: Discover and hydrate bounded publisher batch
        id: discovery
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          # Some publishers encode the publication day in their canonical
          # URL (for example WSJ's trailing epoch identifier, or Al
          # Jazeera's legacy date path). They do not need a WARC-body date
          # hydration pass, and the hydrator intentionally rejects them.
          # Keep the shared workflow reusable while making those catalog
          # runs discovery-only instead of failing after index collection.
          effective_max_hydrations="$MAX_HYDRATIONS"
          effective_max_pages="$MAX_PAGES"
          effective_max_queries="$MAX_QUERIES"
          effective_max_errors=4
          effective_page_size=1000
          case "$PUBLISHER" in
            wsj|aljazeera|axios|nyt|ap|zaobao)
              effective_max_hydrations=0
              ;;
          esac
          if [ "$PUBLISHER" = "aljazeera" ] || \
             [ "$PUBLISHER" = "scmp" ]; then
            # These catalogs are sparse and have thousands of empty prefix
            # advances. Keep each bounded checkpoint large enough to make
            # progress without changing the resumable state or article cap.
            effective_max_pages=32
            effective_max_queries=32
          fi
          if [ "$PUBLISHER" = "aljazeera" ] || \
             [ "$PUBLISHER" = "wsj" ] || \
             [ "$PUBLISHER" = "npr" ]; then
            # A few historical prefixes intermittently fail at the Common
            # Crawl index. Allow the same bounded run to skip a larger error
            # batch instead of auto-continuing after only four failures.
            effective_max_errors=32
          fi
          if [ "$SOURCE_VARIANT" = "nikkei-asia-probe" ]; then
            # The domain-wide Asia prefix spans multiple compressed index
            # blocks. Asking the index server for its default large page can
            # time out before returning any NDJSON, while one-block pages are
            # small, resumable and already proven to respond successfully.
            effective_page_size=1
            effective_max_errors=32
          fi
          if [ "$SOURCE_VARIANT" = "wsj-legacy-probe" ]; then
            # Legacy SB/news article keys do not encode a publication date.
            # Re-enable bounded WARC hydration only for this isolated probe;
            # canonical WSJ discovery remains URL-date-only and unchanged.
            effective_max_hydrations="$MAX_HYDRATIONS"
            effective_page_size=1
            effective_max_errors=32
          fi
          if [ "$PUBLISHER" = "wsj" ]; then
            # WSJ's legacy prefixes return very large compressed blocks. A
            # one-block page avoids index-side disconnects while retaining a
            # resumable checkpoint for the remaining pages.
            effective_page_size=1
          fi
          if [ "$PUBLISHER" = "ft" ]; then
            # FT's legacy UUID prefix is broad enough that the Common Crawl
            # server can truncate its default multi-block NDJSON response.
            # One compressed block keeps each page valid and resumable; this
            # is especially important for the 2016 and earlier collections.
            effective_page_size=1
          fi
          python tools/news-archive/tools/build_common_crawl_prefix_manifest.py \
            --publisher "$PUBLISHER" \
            --source-variant "$SOURCE_VARIANT" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --collection-from-year "$COLLECTION_FROM_YEAR" \
            --collection-to-year "$COLLECTION_TO_YEAR" \
            --collection-order "$COLLECTION_ORDER" \
            --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            --output "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --summary "$LOCAL_ROOT/state/summary.json" \
            --max-pages "$effective_max_pages" \
            --max-queries "$effective_max_queries" \
            --max-errors "$effective_max_errors" \
            --target-articles-per-year "$TARGET_ARTICLES_PER_YEAR" \
            --max-date-hydrations "$effective_max_hydrations" \
            --min-request-interval 3 \
            --data-min-request-interval 0.5 \
            --timeout 45 \
            --attempts 4 \
            --page-size "$effective_page_size" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish manifest and checkpoint
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          # Keep the Common Crawl catalog usable by the parser watchdog. The
          # discovery checkpoint is not itself a manifest-bound capacity
          # proof, so publish the same per-year sidecar used by the primary
          # archive workflows.
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --publisher "$PUBLISHER" \
            --output "$LOCAL_ROOT/catalog/manifest-summary.json"
          python tools/news-archive/tools/checkpoint_capture_state.py \
            --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            --output "$RUNNER_TEMP/discovery.sqlite3.gz"
          rclone copyto \
            "$RUNNER_TEMP/discovery.sqlite3.gz" \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/catalog/manifest-summary.json" \
            "${REMOTE_ROOT}/catalog/manifest-summary.json" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/state/summary.json" \
            "${REMOTE_ROOT}/state/summary.json" \
            --retries 8 --low-level-retries 20

      - name: Report catalog progress
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          {
            echo "### ${PUBLISHER} Common Crawl prefix catalog"
            echo
            echo '```json'
            cat "$LOCAL_ROOT/state/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch next bounded run
        if: >-
          ${{
            inputs.auto_continue &&
            steps.discovery.outputs.should_continue == 'true' &&
            (steps.discovery.outputs.advances != '0' ||
             steps.discovery.outputs.hydration_attempted != '0')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run nikkei-common-crawl-catalog.yml \
            --ref "$GITHUB_REF_NAME" \
            -f publisher="$PUBLISHER" \
            -f source_variant="$SOURCE_VARIANT" \
            -f from_year="$FROM_YEAR" \
            -f to_year="$TO_YEAR" \
            -f collection_from_year="$COLLECTION_FROM_YEAR" \
            -f collection_to_year="$COLLECTION_TO_YEAR" \
            -f collection_order="$COLLECTION_ORDER" \
            -f max_pages="$MAX_PAGES" \
            -f max_queries="$MAX_QUERIES" \
            -f max_hydrations="$MAX_HYDRATIONS" \
            -f target_articles_per_year="$TARGET_ARTICLES_PER_YEAR" \
            -f auto_continue=true

      - name: Wake parser validation watchdog
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/kick-parser-watchdog.sh
