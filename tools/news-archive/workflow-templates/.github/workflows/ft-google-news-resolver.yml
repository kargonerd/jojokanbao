name: FT Google News URL resolver

run-name: resolve-ft-url

on:
  workflow_dispatch:
    inputs:
      headline:
        description: "Exact FT headline."
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/news-archive/requirements.txt

      - name: Resolve canonical URL
        run: >-
          python tools/news-archive/tools/resolve_ft_google_news_url.py
          --headline "$HEADLINE"
        env:
          HEADLINE: ${{ inputs.headline }}
