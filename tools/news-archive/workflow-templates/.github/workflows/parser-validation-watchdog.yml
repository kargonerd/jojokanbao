name: Parser validation watchdog

on:
  schedule:
    # Periodically fill free validation slots. Accelerator jobs also chain
    # their own batches, so this is a conservative recovery/backfill cadence.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: parser-validation-watchdog
  cancel-in-progress: false

env:
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  # This is a public research runner with a dedicated 200-node Mihomo pool.
  # Keep fifteen parser-validation jobs in flight so source-limited years do
  # not serialize the whole ledger. Three catalog slots and the watchdog
  # itself still fit within the hosted-runner concurrency budget.
  MAX_STANDARD_CONCURRENCY: "15"
  # Restoring the full B2 validation ledger takes several minutes. Fill up to
  # four free parser slots per pass while the independent fifteen-job ceiling
  # below remains authoritative.
  MAX_DISPATCH_PER_RUN: "4"
  # Reserve at most one refresh dispatch when superseded parser cohorts are
  # still draining. This prevents a parser fix from waiting behind a stale
  # long-running capture chain without broadly increasing concurrency.
  MAX_SUPERSEDED_REFRESH_DISPATCH: "1"
  # GitHub can leave workflow_dispatch shells permanently reported as queued
  # even though they have zero jobs and both cancel/delete APIs treat them as
  # completed. Reserve capacity for a genuinely starting generic shell, but
  # stop letting a 30-minute-old title-less shell block the ledger forever.
  GENERIC_QUEUE_GRACE_SECONDS: "1800"
  # Keep two independent catalog chains moving while the parser-validation
  # scheduler continues to reserve standard slots for 800-sample cohorts.
  # Common Crawl workflows are keyed by publisher/window, so this does not
  # collide with a different publisher's resumable chain.
  # Catalog jobs persist compact URL/date checkpoints. Keep a third slot for
  # a targeted recovery chain while the two broad SCMP windows drain their
  # long undated tails; parser-validation concurrency remains independent.
  MAX_CATALOG_CONCURRENCY: "3"
  # Bloomberg has completed the current research acceptance cycle. Keep every
  # other currently requested publisher eligible for per-year 800-row
  # validation; Caixin is intentionally paused and is not dispatched here.
  VALIDATION_PUBLISHERS: >-
    ft wsj nyt ap axios npr nikkei zaobao aljazeera scmp
  # Manual runs from a parser-iteration branch must dispatch jobs from that
  # same ref; scheduled runs on the default branch continue to use master.
  DISPATCH_REF: ${{ github.ref_name }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install rclone
        run: |
          # Hosted-runner apt mirrors occasionally stall. Keep the watchdog
          # recoverable and fall back to the upstream static binary instead
          # of spending its whole timeout waiting on package metadata.
          if ! timeout 120 sudo apt-get update || \
             ! timeout 120 sudo apt-get install -y rclone; then
            rclone_tmp="$(mktemp -d)"
            curl -fsSL --retry 4 --retry-delay 2 \
              -o "$rclone_tmp/rclone.zip" \
              https://downloads.rclone.org/rclone-current-linux-amd64.zip
            unzip -q "$rclone_tmp/rclone.zip" -d "$rclone_tmp"
            rclone_binary="$(find "$rclone_tmp" -type f -name rclone -print -quit)"
            test -n "$rclone_binary"
            sudo install -m 0755 "$rclone_binary" /usr/local/bin/rclone
          fi

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Restore validation summaries
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive-state"
          copy_summary() {
            local remote_dir="$1"
            local destination="$2"
            local errors="$RUNNER_TEMP/summary-listing-errors-${BASHPID}-${RANDOM}.txt"
            # Probe the one object we need instead of enumerating every
            # object in the state directory. B2 buckets contain many
            # superseded checkpoints, and directory listings can dominate
            # this watchdog's 15-minute budget. Retries also absorb a
            # transient 5xx while the object metadata is being read.
            summary_remote="$remote_dir/summary.json"
            object_listing=""
            if ! object_listing="$(
              rclone lsl "$summary_remote" \
                --timeout 30s --contimeout 10s \
                --retries 3 --low-level-retries 6 \
                2>"$errors"
            )"; then
              if grep -qiE "directory not found|object not found" "$errors"; then
                return 0
              fi
              cat "$errors" >&2
              return 1
            fi
            if [ -n "$object_listing" ]; then
              mkdir -p "$destination"
              rclone copyto "$summary_remote" \
                "$destination/summary.json" \
                --retries 8 --low-level-retries 20
            fi
          }
          restore_source_root() {
            local source_root="$1"
            local result_root="$2"
            mkdir -p "$result_root"
            copy_summary \
              "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/state" \
              "$RUNNER_TEMP/archive-state/${source_root}/state"
            local object_listing=""
            if object_listing="$(
              rclone lsl \
                "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/manifest.jsonl.gz" \
                --timeout 30s --contimeout 10s \
                --retries 3 --low-level-retries 6 \
                2>/dev/null
            )" && [ -n "$object_listing" ]; then
              printf '%s\n' "$source_root" > "$result_root/available"
              local capacity_remote="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/manifest-summary.json"
              local capacity_listing=""
              if capacity_listing="$(
                rclone lsl "$capacity_remote" \
                  --timeout 30s --contimeout 10s \
                  --retries 3 --low-level-retries 6 \
                  2>/dev/null
              )" && [ -n "$capacity_listing" ]; then
                local capacity_local="$source_capacity_root/${source_root}/manifest-summary.json"
                mkdir -p "$(dirname "$capacity_local")"
                rclone copyto "$capacity_remote" "$capacity_local" \
                  --retries 8 --low-level-retries 20
              fi
            fi
            local status_remote="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/catalog/status.json"
            local status_listing=""
            if status_listing="$(
              rclone lsl "$status_remote" \
                --timeout 30s --contimeout 10s \
                --retries 3 --low-level-retries 6 \
                2>/dev/null
            )" && [ -n "$status_listing" ]; then
              local status_local="$source_catalog_status_root/${source_root}/catalog/status.json"
              mkdir -p "$(dirname "$status_local")"
              rclone copyto "$status_remote" "$status_local" \
                --retries 8 --low-level-retries 20
            fi
          }
          source_roots=(
            "ap/2010-2015/sitemap-wayback"
            "ap/2016-2026/sitemap-wayback"
            "bloomberg/2010-2015/sitemap-wayback"
            "bloomberg/2016-2026/sitemap-wayback"
            "ft/2010-2015/sitemap-wayback"
            "ft/2016-2026/sitemap-wayback"
            "nyt/2010-2015/sitemap-wayback"
            "nyt/2016-2026/sitemap-wayback"
            "reuters/2010-2015/wayback-urlkey"
            "reuters/2016-2020/wayback-urlkey"
            "reuters/2021-2026/reuters-sitemap-wayback"
            "wsj/2010-2015/wayback-urlkey"
            "wsj/2016-2026/wayback-urlkey"
            "wsj/2016-2026/wayback"
            "axios/2017-2026/wayback-urlkey"
            "npr/2010-2015/wayback-urlkey"
            "npr/2016-2026/wayback-urlkey"
            "nikkei/2010-2015/wayback-urlkey"
            "nikkei/2016-2026/wayback-urlkey"
            "zaobao/2016-2026/sitemap-wayback"
            "aljazeera/2010-2015/sitemap-wayback"
            "aljazeera/2016-2026/sitemap-wayback"
            "scmp/2010-2015/wayback-urlkey"
            "scmp/2016-2026/wayback-urlkey"
            # Official SCMP archives are supplemental validation sources but
            # also first-class resumable catalog targets. Restore their
            # status sidecars here so a completed chain is not redispatched.
            "scmp/2010-2015/sitemap-wayback"
            "scmp/2016-2026/sitemap-wayback"
          )
          available_source_shards="$RUNNER_TEMP/available-source-shards.txt"
          source_capacity_root="$RUNNER_TEMP/source-capacity"
          source_catalog_status_root="$RUNNER_TEMP/source-catalog-status"
          mkdir -p "$source_capacity_root"
          mkdir -p "$source_catalog_status_root"
          : > "$available_source_shards"
          source_restore_root="$RUNNER_TEMP/source-root-restore"
          mkdir -p "$source_restore_root"
          source_restore_pids=()
          source_restore_results=()
          source_restore_parallelism=8
          wait_for_source_restore_batch() {
            local pid
            for pid in "${source_restore_pids[@]}"; do
              wait "$pid"
            done
            source_restore_pids=()
          }
          for source_root in "${source_roots[@]}"; do
            result_root="$source_restore_root/${#source_restore_results[@]}"
            source_restore_results+=("$result_root")
            (
              restore_source_root "$source_root" "$result_root"
            ) &
            source_restore_pids+=("$!")
            if [ "${#source_restore_pids[@]}" -ge "$source_restore_parallelism" ]; then
              wait_for_source_restore_batch
            fi
          done
          wait_for_source_restore_batch
          for result_root in "${source_restore_results[@]}"; do
            if [ -f "$result_root/available" ]; then
              cat "$result_root/available" >> "$available_source_shards"
            fi
          done
          sort -u "$available_source_shards" -o "$available_source_shards"
          # Supplemental catalogs are merged by the accelerator per year.
          # Restore their capacity sidecars so a thin primary Wayback shard
          # does not hide a year with at least 800 Common Crawl candidates.
          # Restore capacity sidecars for the other catalog-only supplements
          # as well. Without these, the planner treats an omitted year as
          # unknown and can dispatch cells whose merged source has no unseen
          # candidates (or no rows at all), producing avoidable validation
          # failures instead of recording a capacity-deficient cell.
          supplemental_capacity_roots=(
            "ap/2010-2015/legacy-archive"
            # Axios validation merges both supplements. The sitemap catalog
            # is the authoritative high-capacity source for current years
            # (including 2026), so its sidecar must participate in the
            # pre-dispatch upper bound just like Common Crawl.
            "axios/2017-2026/sitemap-wayback"
            "axios/2017-2026/commoncrawl-prefix"
            "axios/2017-2026/axios-local-sitemap"
            "axios/2017-2017/commoncrawl-prefix"
            "axios/2018-2018/commoncrawl-prefix"
            "axios/2026-2026/commoncrawl-prefix"
            "ft/2010-2015/commoncrawl-prefix"
            "ft/2016-2026/commoncrawl-prefix"
            "reuters/2010-2015/commoncrawl-prefix"
            "reuters/2016-2020/commoncrawl-prefix"
            "reuters/2021-2026/commoncrawl-prefix"
            "aljazeera/2010-2015/commoncrawl-prefix"
            "aljazeera/2016-2026/commoncrawl-prefix"
            "aljazeera/2010-2015/wayback-urlkey"
            "aljazeera/2016-2026/wayback-urlkey"
            "aljazeera/2016-2016/commoncrawl-prefix"
            "aljazeera/2017-2017/commoncrawl-prefix"
            "aljazeera/2018-2018/commoncrawl-prefix"
            "nikkei/2010-2015/commoncrawl-prefix"
            "nikkei/2016-2026/commoncrawl-prefix"
            "nikkei/2010-2016/commoncrawl-asia-probe"
            "nikkei/2010-2010/commoncrawl-prefix"
            "nikkei/2011-2011/commoncrawl-prefix"
            "wsj/2010-2015/commoncrawl-prefix"
            "wsj/2016-2026/commoncrawl-prefix"
            "wsj/2010-2013/commoncrawl-legacy-probe"
            "scmp/2010-2015/commoncrawl-prefix"
            "scmp/2016-2026/commoncrawl-prefix"
            "npr/2010-2015/commoncrawl-prefix"
          )
          for supplemental_year in $(seq 2010 2026); do
            supplemental_capacity_roots+=(
              "npr/${supplemental_year}-${supplemental_year}/commoncrawl-prefix"
              "npr/${supplemental_year}-${supplemental_year}/official-archive"
            )
          done
          # The broad NPR catalog covers 2012--2016 and is merged by the
          # accelerator for those cells alongside the per-year supplements.
          supplemental_capacity_roots+=(
            "npr/2012-2016/commoncrawl-prefix"
            "npr/2013-2026/commoncrawl-prefix"
          )
          for supplemental_root in "${supplemental_capacity_roots[@]}"; do
            capacity_catalog="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${supplemental_root}/catalog"
            # Every standard catalog publishes this exact sidecar name. Probe
            # it directly before the wildcard listing: some B2/rclone listing
            # combinations can omit an otherwise readable object, which left
            # NPR's completed official-archive capacity invisible here.
            default_capacity_name="manifest-summary.json"
            default_capacity_remote="${capacity_catalog}/${default_capacity_name}"
            default_capacity_listing="$(
              rclone lsl "$default_capacity_remote" \
                --timeout 30s --contimeout 10s \
                --retries 3 --low-level-retries 6 \
                2>/dev/null || true
            )"
            if [ -n "$default_capacity_listing" ]; then
              default_capacity_local="${source_capacity_root}/${supplemental_root}/${default_capacity_name}"
              mkdir -p "$(dirname "$default_capacity_local")"
              rclone copyto "$default_capacity_remote" "$default_capacity_local" \
                --retries 8 --low-level-retries 20
            fi
            # AP publishes one sidecar per supplemental manifest (the legacy,
            # Yahoo, and Big Story catalogs coexist under one source root).
            # Restore every matching sidecar; the Python planner merges them
            # conservatively by taking the per-year maximum.
            capacity_listing="$(
              rclone lsf "$capacity_catalog" --files-only \
                --include "*manifest-summary.json" \
                --timeout 30s --contimeout 10s \
                --retries 3 --low-level-retries 6 \
                2>/dev/null || true
            )"
            while IFS= read -r capacity_name; do
              [ -n "$capacity_name" ] || continue
              # The exact standard sidecar was restored above. Keep this
              # listing pass only for named supplemental manifests.
              [ "$capacity_name" != "$default_capacity_name" ] || continue
              capacity_remote="${capacity_catalog}/${capacity_name}"
              capacity_local="${source_capacity_root}/${supplemental_root}/${capacity_name}"
              mkdir -p "$(dirname "$capacity_local")"
              rclone copyto "$capacity_remote" "$capacity_local" \
                --retries 8 --low-level-retries 20
            done <<< "$capacity_listing"
          done
          # Keep a narrow, non-secret diagnostic for the NPR capacity source
          # that previously diverged between local B2 reads and the hosted
          # watchdog. This makes future regressions distinguish remote
          # visibility from local planner loading without dumping credentials
          # or the full capacity inventory.
          npr_2014_capacity_local="${source_capacity_root}/npr/2014-2014/official-archive/manifest-summary.json"
          npr_2014_capacity_remote="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/npr/2014-2014/official-archive/catalog/manifest-summary.json"
          if [ -f "$npr_2014_capacity_local" ]; then
            jq -c '{source:"npr/2014-2014/official-archive",yearCounts}' \
              "$npr_2014_capacity_local"
          elif npr_2014_capacity_probe="$(
            rclone lsl "$npr_2014_capacity_remote" \
              --timeout 30s --contimeout 10s \
              --retries 3 --low-level-retries 6 2>&1
          )"; then
            echo "NPR 2014 capacity sidecar readable but not restored: ${npr_2014_capacity_probe}"
          else
            echo "NPR 2014 capacity sidecar unreadable: ${npr_2014_capacity_probe}" >&2
          fi
          # Formal parser-validation summaries are execution state under v2,
          # not part of a publisher's v1 canonical raw source tree. Restore
          # both the original validation cohort and formal holdout cohorts;
          # a current-version holdout that passes all gates is authoritative
          # convergence evidence and must not be dispatched again. Smoke
          # cohorts remain deliberately excluded.
          # Keep the hierarchical listing on B2.  --fast-list first
          # materializes every superseded capture object in this prefix,
          # which can stall the watchdog before planning starts.
          rclone copy \
            "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v2/validation-state" \
            "$RUNNER_TEMP/archive-state" \
            --include "validation/*/*/state/summary.json" \
            --include "holdout-v*/*/*/state/summary.json" \
            --include "validation/*/*/state/rotation-audit.json" \
            --include "holdout-v*/*/*/state/rotation-audit.json" \
            --include "validation/*/*/state/content-audit.json" \
            --include "holdout-v*/*/*/state/content-audit.json" \
            --transfers 32 --checkers 64 \
            --retries 8 --low-level-retries 20

      - name: Plan available validation slots
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/runs.json"
          parser_runs="$RUNNER_TEMP/parser-runs.json"
          active="$RUNNER_TEMP/active-titles.txt"
          now_epoch="$(date +%s)"
          list_runs_with_retry() {
            local output="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh run list "$@" > "$output"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "GitHub run listing failed (attempt ${attempt}/5); retrying..." >&2
                sleep $((attempt * 3))
              fi
            done
            echo "GitHub run listing failed after 5 attempts." >&2
            return 1
          }
          # Catalog workflows are intentionally frequent and can occupy the
          # first 100 repository-wide results. Query all refs so a default-
          # branch watchdog does not duplicate an in-flight research-branch
          # capture or holdout while a merged branch drains. Query parser runs
          # separately so the standard-concurrency count cannot miss an older
          # holdout.
          list_runs_with_retry "$runs" \
            --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json status,displayTitle,workflowName,createdAt
          list_runs_with_retry "$parser_runs" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow parser-validation-accelerator.yml \
            --limit 1000 \
            --json status,displayTitle,createdAt
          # GitHub occasionally leaves a queued/waiting run stranded for many
          # hours (and the cancel API may return 500). Do not let such stale
          # scheduler entries consume validation capacity; in-progress runs
          # are always retained in the active set.
          jq -r --argjson now "$now_epoch" '
            .[]
            | select(
                .status == "in_progress"
                or (
                  (.status == "queued"
                    or .status == "waiting"
                    or .status == "pending"
                    or .status == "requested")
                  and ((try (.createdAt | fromdateiso8601) catch 0)
                    >= ($now - 18000))
                )
              )
            | .displayTitle
          ' "$runs" > "$active"
          # Catalog jobs have their own MAX_CATALOG_CONCURRENCY budget and
          # must not consume the two standard parser-validation slots. The
          # active-title file above still includes every workflow so the
          # planners avoid duplicate catalog or parser dispatches; only the
          # parser run names are counted for standard concurrency here.
          # A workflow_dispatch run can sit in GitHub's runner queue before
          # its input-derived run-name is evaluated. During that interval the
          # API reports the generic workflow title, "Parser validation
          # accelerator". Count those recent entries as reserved slots too;
          # otherwise every watchdog tick dispatches more work for capacity
          # that is already queued and eventually produces startup_failure.
          active_count="$(
            jq --argjson now "$now_epoch" \
              --argjson generic_grace "$GENERIC_QUEUE_GRACE_SECONDS" '[
              .[]
              | select(
                  (
                    .status == "in_progress"
                    or (
                      (.status == "queued"
                        or .status == "waiting"
                        or .status == "pending"
                        or .status == "requested")
                      and ((try (.createdAt | fromdateiso8601) catch 0)
                        >= ($now - 18000))
                    )
                  )
                  and (
                    (.displayTitle
                      | test("^parser-(validation|holdout-v[0-9]+|smoke-v[0-9]+)-"))
                    or (
                      .displayTitle == "Parser validation accelerator"
                      and (
                        .status == "in_progress"
                        or ((try (.createdAt | fromdateiso8601) catch 0)
                          >= ($now - $generic_grace))
                      )
                    )
                  )
              )
            ] | length' "$parser_runs"
          )"
          generic_catalog_pending_count="$(
            jq --argjson now "$now_epoch" \
              --argjson generic_grace "$GENERIC_QUEUE_GRACE_SECONDS" '[
              .[]
              | select(
                  (
                    .status == "queued"
                    or .status == "waiting"
                    or .status == "pending"
                    or .status == "requested"
                  )
                  and ((try (.createdAt | fromdateiso8601) catch 0)
                    >= ($now - $generic_grace))
                  and (
                    (.workflowName == "Publisher Common Crawl catalog"
                      and .displayTitle == "Publisher Common Crawl catalog")
                    or (.workflowName == "News raw archive"
                      and .displayTitle == "News raw archive")
                  )
                )
            ] | length' "$runs"
          )"
          # Classify active parser runs against the current required cohort.
          # A superseded holdout may still be downloading a large old batch,
          # but it must not starve the fresh parser cohort that replaced it.
          # The probe reuses the restored B2 state and emits only a compact
          # JSON plan; its normal task list is disabled with max-dispatch=0.
          validation_probe="$RUNNER_TEMP/validation-capacity-probe.json"
          python \
            tools/news-archive/tools/plan_parser_validation_watchdog.py \
            --state-root "$RUNNER_TEMP/archive-state" \
            --active-titles "$active" \
            --available-source-shards \
              "$RUNNER_TEMP/available-source-shards.txt" \
            --source-capacity-root "$RUNNER_TEMP/source-capacity" \
            --max-dispatch 0 \
            --publishers $VALIDATION_PUBLISHERS \
            --output "$validation_probe" \
            > "$RUNNER_TEMP/validation-capacity-probe.log"
          superseded_active_count="$(
            jq -r '.activeSupersededRunCount // 0' "$validation_probe"
          )"
          effective_active_count=$((active_count - superseded_active_count))
          if [ "$effective_active_count" -lt 0 ]; then
            effective_active_count=0
          fi
          echo "Active parser runs total=$active_count; superseded parser runs exempt=$superseded_active_count; effective=$effective_active_count."
          # MAX_STANDARD_CONCURRENCY is the parser-job budget, not the total
          # hosted-runner budget. The watchdog is not part of active_count and
          # must not be added back here, otherwise 14 live parser jobs dispatch
          # two more and overshoot the configured fifteen-job ceiling.
          available=$((MAX_STANDARD_CONCURRENCY - effective_active_count))
          if [ "$available" -lt 0 ]; then
            available=0
          fi
          if [ "$available" -lt 1 ] && [ "$superseded_active_count" -gt 0 ]; then
            available="$MAX_SUPERSEDED_REFRESH_DISPATCH"
            echo "Reserved one parser refresh slot while superseded cohorts drain."
          fi
          dispatches="$available"
          if [ "$dispatches" -gt "$MAX_DISPATCH_PER_RUN" ]; then
            dispatches="$MAX_DISPATCH_PER_RUN"
          fi
          catalog_dispatch_limit="$dispatches"
          if [ "$catalog_dispatch_limit" -gt 0 ]; then
            # Keep one dispatch for a parser-validation cohort whenever any
            # standard slot is available. Catalog chains may continue through
            # later watchdog ticks, while parser iteration must not starve.
            catalog_dispatch_limit=$((catalog_dispatch_limit - 1))
            echo "Keeping one dispatch slot reserved for parser validation."
          fi
          if [ "$superseded_active_count" -gt 0 ] \
            && [ "$catalog_dispatch_limit" -gt 0 ]; then
            catalog_dispatch_limit=$((catalog_dispatch_limit - 1))
            echo "Keeping one dispatch slot reserved for a fresh parser cohort."
          fi
          if [ "$generic_catalog_pending_count" -gt 0 ]; then
            # The generic title does not reveal which publisher/window is
            # queued, so conservatively wait for it to acquire a runner and
            # expose its run-name before planning another catalog.
            catalog_dispatch_limit=0
            echo "Catalog runner queue already has $generic_catalog_pending_count unresolved generic dispatch(es); suppressing another catalog dispatch."
          fi
          python \
            tools/news-archive/tools/plan_source_catalog_watchdog.py \
            --status-root "$RUNNER_TEMP/source-catalog-status" \
            --active-titles "$active" \
            --available-source-shards \
              "$RUNNER_TEMP/available-source-shards.txt" \
            --max-dispatch "$catalog_dispatch_limit" \
            --max-active-catalogs "$MAX_CATALOG_CONCURRENCY" \
            --output "$RUNNER_TEMP/source-catalog-plan.json"
          catalog_dispatches="$(
            jq '.tasks | length' "$RUNNER_TEMP/source-catalog-plan.json"
          )"
          validation_dispatches=$((dispatches - catalog_dispatches))
          if [ "$validation_dispatches" -lt 0 ]; then
            validation_dispatches=0
          fi
          python \
            tools/news-archive/tools/plan_parser_validation_watchdog.py \
            --state-root "$RUNNER_TEMP/archive-state" \
            --active-titles "$active" \
            --available-source-shards \
              "$RUNNER_TEMP/available-source-shards.txt" \
            --source-capacity-root "$RUNNER_TEMP/source-capacity" \
            --max-dispatch "$validation_dispatches" \
            --publishers $VALIDATION_PUBLISHERS \
            --output "$RUNNER_TEMP/validation-plan.json"
          echo "catalog_tasks=$(jq -c '.tasks' \
            "$RUNNER_TEMP/source-catalog-plan.json")" >> "$GITHUB_OUTPUT"
          echo "validation_tasks=$(jq -c '.tasks' \
            "$RUNNER_TEMP/validation-plan.json")" >> "$GITHUB_OUTPUT"
          echo "capacity_deficient_cells=$(jq -r '.capacityDeficientCells // 0' \
            "$RUNNER_TEMP/validation-plan.json")" >> "$GITHUB_OUTPUT"
          echo "capacity_deficient_npr_years=$(jq -c \
            '[.cellProgress[] | select(.publisher == "npr" and .capacityDeficient == true) | .year]' \
            "$RUNNER_TEMP/validation-plan.json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Parser validation watchdog"
            echo
            echo '```json'
            jq -n \
              --slurpfile catalogs "$RUNNER_TEMP/source-catalog-plan.json" \
              --slurpfile validations "$RUNNER_TEMP/validation-plan.json" \
              '{
                sourceCatalogs: $catalogs[0],
                parserValidation: {
                  targetCells: $validations[0].targetCells,
                  readyCells: $validations[0].readyCells,
                  activeCells: $validations[0].activeCells,
                  pendingCells: $validations[0].pendingCells,
                  summariesRead: $validations[0].summariesRead,
                  ready: [
                    $validations[0].cellProgress[]
                    | select(.ready == true)
                    | {
                        publisher,
                        year,
                        evaluated,
                        completeRate,
                        qaPassRate,
                        parserVersion,
                        selectedCohort
                      }
                  ],
                  capacityDeficient: [
                    $validations[0].cellProgress[]
                    | select(.capacityDeficient == true)
                    | {
                        publisher,
                        year,
                        eligibleCandidates,
                        eligibleCandidateUpperBound,
                        replayableEvaluated,
                        captureStateExhausted,
                        selectedCohort
                      }
                  ],
                  unresolved: [
                    $validations[0].cellProgress[]
                    | select(.ready == false)
                  ],
                  tasks: $validations[0].tasks
                }
              }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch missing or incomplete source catalogs
        if: ${{ steps.plan.outputs.catalog_tasks != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TASKS: ${{ steps.plan.outputs.catalog_tasks }}
        run: |
          set -euo pipefail
          while IFS= read -r task; do
            publisher="$(jq -r '.publisher' <<<"$task")"
            from_year="$(jq -r '.fromYear' <<<"$task")"
            to_year="$(jq -r '.toYear' <<<"$task")"
            mode="$(jq -r '.manifestMode' <<<"$task")"
            pages="$(jq -r '.maxDiscoveryPages' <<<"$task")"
            runner="$(jq -r '.runnerOs' <<<"$task")"
            gh workflow run news-raw-archive.yml \
              --ref "$DISPATCH_REF" \
              -f publisher="$publisher" \
              -f from_year="$from_year" \
              -f to_year="$to_year" \
              -f manifest_mode="$mode" \
              -f max_discovery_pages="$pages" \
              -f max_captures=0 \
              -f workers=1 \
              -f max_runtime_minutes=300 \
              -f auto_continue=true \
              -f stop_when_validation_ready=false \
              -f runner_os="$runner"
            echo "Dispatched source catalog $publisher/$from_year-$to_year/$mode."
          done < <(jq -c '.[]' <<<"$TASKS")

      # The ordinary source-catalog planner only knows about workflows that
      # publish catalog/status.json. Common Crawl prefix catalogs are a
      # separate resumable workflow and publish state/summary.json instead.
      # Advance one of the capacity-recovery chains when the parser planner
      # has no ordinary validation/source task to dispatch. This keeps the
      # branch self-contained; it does not depend on the disabled legacy
      # news-archive watchdog on the default branch.
      - name: Dispatch supplemental Common Crawl catalog
        if: >-
           ${{
             steps.plan.outputs.catalog_tasks == '[]' &&
             (
               steps.plan.outputs.validation_tasks == '[]' ||
               steps.plan.outputs.capacity_deficient_cells != '0'
             )
           }}
        env:
          GH_TOKEN: ${{ github.token }}
          B2_REMOTE: jojo-b2
          CAPACITY_DEFICIENT_CELLS: ${{ steps.plan.outputs.capacity_deficient_cells }}
          CAPACITY_DEFICIENT_NPR_YEARS: ${{ steps.plan.outputs.capacity_deficient_npr_years }}
        run: |
          set -euo pipefail
          active_titles="$RUNNER_TEMP/active-titles.txt"
          # The bootstrap source planner has already reported no ordinary
          # task. Keep the supplemental capacity-recovery chains within the
          # MAX_CATALOG_CONCURRENCY budget. They may run alongside baseline
          # archive jobs because they only build compact catalogs and do not
          # download validation HTML.
          parser_active_count="$(grep -Ec '^parser-' "$active_titles" || true)"
          capacity_deficient_cells="${CAPACITY_DEFICIENT_CELLS:-0}"
          if [ "$parser_active_count" -ge 2 ] && \
             [ "$capacity_deficient_cells" -eq 0 ]; then
            echo "Both standard parser slots are occupied; skip supplemental dispatch."
            exit 0
          fi
          active_catalog_count="$(grep -Ec '^((ft|wsj|aljazeera|scmp|npr|axios|nikkei)-([a-z0-9-]+-)?common-crawl-|npr-official-archive-|NPR official archive catalog$|Publisher Common Crawl catalog$|News raw archive$)' \
              "$active_titles" || true)"
          catalog_concurrency_limit="$MAX_CATALOG_CONCURRENCY"
          if [ "$capacity_deficient_cells" -gt 0 ]; then
            # Broad Common Crawl chains can occupy every ordinary catalog
            # slot while a sparse year is already proven capacity-deficient.
            # Temporarily add one bounded recovery slot so the first NPR
            # targeted queue entry is not starved by those long chains. This
            # does not change the two-run parser budget and applies only while
            # the validation planner reports a real capacity shortfall.
            catalog_concurrency_limit=$((MAX_CATALOG_CONCURRENCY + 1))
            echo "Capacity recovery active; reserving one supplemental catalog slot ($catalog_concurrency_limit total)."
          fi
          if [ "$active_catalog_count" -ge "$catalog_concurrency_limit" ]; then
            echo "Supplemental Common Crawl concurrency is full ($active_catalog_count/$catalog_concurrency_limit); skip dispatch."
            exit 0
          fi
          catalog_slots=$((catalog_concurrency_limit - active_catalog_count))
          echo "Supplemental Common Crawl slots available: $catalog_slots"
          # NPR's own date archive exposes sectioned canonical URLs that the
          # root-only Wayback/Common Crawl prefixes cannot enumerate. Advance
          # at most one such chain per watchdog tick to keep a polite global
          # request rate while still reserving the remaining catalog slots
          # for other capacity-deficient publishers.
          active_npr_official_count="$(grep -Ec \
            '^npr-official-archive-' "$active_titles" || true)"
          if [ "$active_npr_official_count" -eq 0 ]; then
            while IFS= read -r official_year; do
              [ -n "$official_year" ] || continue
              official_summary="$RUNNER_TEMP/npr-official-${official_year}.json"
              official_remote="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/npr/${official_year}-${official_year}/official-archive/state/summary.json"
              if rclone copyto "$official_remote" "$official_summary" \
                  --timeout 20s --contimeout 10s --retries 2 \
                  --low-level-retries 4 >/dev/null 2>&1 \
                && jq -e '.complete == true' "$official_summary" \
                  >/dev/null; then
                echo "NPR official archive already complete: $official_year"
                continue
              fi
              gh workflow run npr-official-archive-catalog.yml \
                --ref "$DISPATCH_REF" \
                -f year="$official_year" \
                -f max_pages=300 \
                -f auto_continue=true
              echo "Dispatched NPR official archive catalog: $official_year"
              catalog_slots=$((catalog_slots - 1))
              break
            done < <(jq -r '.[]' <<<"${CAPACITY_DEFICIENT_NPR_YEARS:-[]}")
          else
            echo "An NPR official archive chain is already active."
          fi
          if [ "$catalog_slots" -le 0 ]; then
            exit 0
          fi
          # Capacity-deficient publishers come first so that two parallel
          # slots cannot be consumed by WSJ's two historical windows alone.
          # Once these queues are exhausted, the WSJ windows resume as the
          # remaining broad source-recovery work.
          queue='[
            {"publisher":"npr","fromYear":"2010","toYear":"2010","collectionFromYear":"2013","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"npr","fromYear":"2013","toYear":"2013","collectionFromYear":"2013","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"npr","fromYear":"2014","toYear":"2014","collectionFromYear":"2014","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"npr","fromYear":"2015","toYear":"2015","collectionFromYear":"2014","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"npr","fromYear":"2016","toYear":"2016","collectionFromYear":"2014","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"axios","fromYear":"2017","toYear":"2017","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"axios","fromYear":"2018","toYear":"2018","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"axios","fromYear":"2026","toYear":"2026","collectionFromYear":"2025","collectionToYear":"2026","collectionOrder":"newest"},
            {"publisher":"nikkei","fromYear":"2010","toYear":"2010","collectionFromYear":"2013","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"nikkei","fromYear":"2011","toYear":"2011","collectionFromYear":"2013","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"aljazeera","fromYear":"2016","toYear":"2016","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"aljazeera","fromYear":"2017","toYear":"2017","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"aljazeera","fromYear":"2018","toYear":"2018","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"oldest"},
            {"publisher":"ft","fromYear":"2010","toYear":"2015","collectionFromYear":"2014","collectionToYear":"2026","collectionOrder":"newest"},
            {"publisher":"ft","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"newest"},
            {"publisher":"scmp","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026"},
            {"publisher":"aljazeera","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026"},
            {"publisher":"scmp","fromYear":"2010","toYear":"2015","collectionFromYear":"2013","collectionToYear":"2016"},
            {"publisher":"aljazeera","fromYear":"2010","toYear":"2015","collectionFromYear":"2013","collectionToYear":"2016"},
            {"publisher":"wsj","fromYear":"2010","toYear":"2015","collectionFromYear":"2014","collectionToYear":"2016","collectionOrder":"newest"},
            {"publisher":"wsj","fromYear":"2016","toYear":"2026","collectionFromYear":"2017","collectionToYear":"2026","collectionOrder":"newest"}
          ]'
          while IFS= read -r task; do
            publisher="$(jq -r '.publisher' <<<"$task")"
            from_year="$(jq -r '.fromYear' <<<"$task")"
            to_year="$(jq -r '.toYear' <<<"$task")"
            title="${publisher}-common-crawl-${from_year}-${to_year}"
            canonical_title="${publisher}-canonical-common-crawl-${from_year}-${to_year}"
            if grep -Fxq "$title" "$active_titles" || \
               grep -Fxq "$canonical_title" "$active_titles"; then
              echo "Common Crawl chain already active: $canonical_title"
              continue
            fi
            target_articles=1200
            if [ "$from_year" = "$to_year" ] && \
               [[ "$publisher" =~ ^(npr|axios|nikkei|aljazeera)$ ]]; then
              # These cells have already consumed several independent
              # 800-article cohorts. A 1,200-URL supplement is mostly a
              # subset of the broad catalog and contributes no unseen
              # capacity. Reopen target-complete Common Crawl queries and
              # scan the historical collections until 25k distinct URLs or
              # genuine query exhaustion. Only compact catalog metadata is
              # stored here; selected HTML is still fetched by validation.
              target_articles=25000
            fi
            source_root="${publisher}/${from_year}-${to_year}/commoncrawl-prefix"
            summary="$RUNNER_TEMP/common-crawl-${publisher}-${from_year}-${to_year}.json"
            if rclone copyto \
                "${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${source_root}/state/summary.json" \
                "$summary" \
                --timeout 20s --contimeout 10s \
                --retries 2 --low-level-retries 4 \
                >/dev/null 2>&1 \
              && jq -e '.shouldContinue == false' "$summary" >/dev/null \
              && [ "$(jq -r '.targetArticlesPerYear // 0' "$summary")" \
                   -ge "$target_articles" ]; then
              echo "Common Crawl catalog already complete: $title"
              continue
            fi
            # Keep 50% headroom above the 800-article validation target.
            # Common Crawl catalogs only persist compact URL/date metadata;
            # their WARC date hydration is not a raw-article upload.  SCMP's
            # legacy URL family has a large undated tail, so use a larger
            # bounded hydration batch there to avoid hundreds of tiny chained
            # runs while retaining the request limiter in the catalog tool.
            hydrations=200
            queries=8
            pages=1
            if [ "$from_year" = "$to_year" ]; then
              # Sparse-year recovery scans multiple query/collection pages
              # in one durable checkpoint instead of repeatedly paying the
              # workflow startup cost for a single catalog page.
              pages=8
              queries=16
              hydrations=500
            fi
            if [ "$publisher" = "scmp" ]; then
              hydrations=1000
            fi
            if [ "$publisher" = "npr" ]; then
              # NPR's broad 2013--2026 chain can spend several checkpoints
              # retrying a single legacy prefix. Split sparse years into
              # independent resumable catalogs so one Common Crawl failure
              # cannot hide otherwise recoverable 2014/2016 capacity.
              pages=8
              queries=16
              hydrations=500
            fi
            if [ "$publisher" = "ft" ]; then
              # FT URLs do not encode their publication date, so the
              # catalog must hydrate WARC records to assign validation years.
              # Use a larger bounded batch while retaining the shared rate
              # limiter and resumable checkpoint.
              pages=8
              queries=16
              hydrations=500
            fi
            case "$publisher" in
              wsj|aljazeera|axios|nyt|ap|zaobao)
                # These sources expose a publication date in the canonical
                # URL or are catalogued through a publisher-specific source;
                # the shared WARC date hydrator does not support them.
                hydrations=0
                ;;
            esac
            if [ "$publisher" = "wsj" ]; then
              # WSJ has sparse but useful captures in the 2014-2016
              # collections. Scan a larger bounded slice so the catalog does
              # not spend dozens of runs exhausting empty legacy prefixes.
              queries=32
              pages=32
            fi
            gh workflow run nikkei-common-crawl-catalog.yml \
              --ref "$DISPATCH_REF" \
              -f publisher="$publisher" \
              -f from_year="$from_year" \
              -f to_year="$to_year" \
              -f collection_from_year="$(jq -r '.collectionFromYear' <<<"$task")" \
              -f collection_to_year="$(jq -r '.collectionToYear' <<<"$task")" \
              -f collection_order="$(jq -r '.collectionOrder // "oldest"' <<<"$task")" \
              -f max_pages="$pages" \
              -f max_queries="$queries" \
              -f max_hydrations="$hydrations" \
              -f target_articles_per_year="$target_articles" \
              -f auto_continue=true
            echo "Dispatched supplemental Common Crawl catalog: $title"
            catalog_slots=$((catalog_slots - 1))
            if [ "$catalog_slots" -le 0 ]; then
              break
            fi
          done < <(jq -c '.[]' <<<"$queue")

      - name: Dispatch missing publisher years
        if: ${{ steps.plan.outputs.validation_tasks != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TASKS: ${{ steps.plan.outputs.validation_tasks }}
        run: |
          set -euo pipefail
          while IFS= read -r task; do
            publisher="$(jq -r '.publisher' <<<"$task")"
            year="$(jq -r '.year' <<<"$task")"
            cohort="$(jq -r '.cohort' <<<"$task")"
            shard="$(jq -r '.sourceManifestShard' <<<"$task")"
            runner="$(jq -r '.runnerOs' <<<"$task")"
            workers=2
            if [ "$publisher" = "ft" ] || [ "$publisher" = "wsj" ]; then
              # These publishers have slow archive responses. The capture
              # client still enforces one global request every 0.5 seconds;
              # four workers only hide response latency behind that limiter.
              workers=4
            fi
            current_evaluated="$(jq -r '.currentEvaluated // 0' <<<"$task")"
            # Do not run the full public Infini-News Parquet metadata scan
            # inside every fresh FT parser cohort.  A new zero-overlap cohort
            # has no local direct-discovery checkpoint, so enabling it here
            # re-reads thousands of HF files before the first archive capture
            # and can spend the whole hosted-runner window on rate-limited
            # metadata.  The validation batch uses the existing manifest,
            # Wayback/Common Crawl and FT syndication candidates; direct
            # discovery is maintained separately as a reusable catalog.
            enable_ft_infini_direct_discovery=false
            if [ "$publisher" = "ft" ] && [ "$year" -ge 2016 ] && \
               [ "$current_evaluated" -lt 200 ]; then
              # Sparse FT years are otherwise dominated by Wayback transport
              # failures. Pay the direct-catalog cost once for a fresh cohort
              # while it is still far from the 800-sample gate; subsequent
              # continuations reuse the durable catalog/checkpoint.
              enable_ft_infini_direct_discovery=true
              echo "Enabling bounded FT Infini-News discovery for $year at $current_evaluated evaluated samples."
            fi
          # Each dispatched validation run starts with an 800-article budget,
          # matching the project's independent-sample acceptance gate.
          gh workflow run parser-validation-accelerator.yml \
              --ref "$DISPATCH_REF" \
              -f publisher="$publisher" \
              -f cohort="$cohort" \
              -f year="$year" \
              -f source_manifest_shard="$shard" \
              -f max_captures=800 \
              -f workers="$workers" \
              -f max_runtime_minutes=300 \
              -f auto_continue=true \
              -f enable_ft_infini_direct_discovery="$enable_ft_infini_direct_discovery" \
              -f runner_os="$runner"
            echo "Dispatched $cohort $publisher/$year from $shard on $runner."
          done < <(jq -c '.[]' <<<"$TASKS")
