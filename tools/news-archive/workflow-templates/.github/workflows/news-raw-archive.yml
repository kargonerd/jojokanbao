name: News raw archive

run-name: >-
  news-raw-${{ inputs.publisher }}-${{ inputs.from_year }}-${{ inputs.to_year }}-${{ inputs.manifest_mode }}

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Publisher archive to advance."
        required: true
        type: choice
        options:
          - ap
          - wsj
          - bloomberg
          - nyt
          - reuters
          - ft
          - axios
          - npr
          - nikkei
          - zaobao
          - aljazeera
          - scmp
          - caixin
      from_year:
        description: "First discovery/capture year."
        required: true
        default: "2016"
        type: string
      to_year:
        description: "Last discovery/capture year."
        required: true
        default: "2026"
        type: string
      manifest_mode:
        description: "Catalog source for this publisher window."
        required: true
        default: "wayback"
        type: choice
        options:
          - sitemap-wayback
          - axios-local-sitemap
          - reuters-sitemap-wayback
          - wayback
          - wayback-urlkey
          - committed-bloomberg-2020
      max_discovery_pages:
        description: "Maximum CDX pages or sitemap files in this run."
        required: true
        default: "5"
        type: string
      max_captures:
        description: "Maximum raw HTML captures; use 0 for catalog-only."
        required: true
        default: "500"
        type: string
      workers:
        description: "Concurrent archive replay downloads."
        required: true
        default: "4"
        type: string
      max_runtime_minutes:
        description: "Stop starting captures after this many minutes."
        required: true
        default: "300"
        type: string
      auto_continue:
        description: "Dispatch the next bounded run after a durable checkpoint."
        required: true
        default: true
        type: boolean
      stop_when_validation_ready:
        description: "Release the runner once every validation year passes 800-sample QA."
        required: true
        default: false
        type: boolean
      runner_os:
        description: "Standard GitHub-hosted runner network used for capture."
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - macos-15-intel

permissions:
  actions: write
  contents: read

concurrency:
  # SCMP declares one ten-second crawl delay for the whole site. Its two
  # historical windows therefore share a single concurrency group; otherwise
  # two individually compliant workers would double the aggregate cadence.
  group: ${{ inputs.publisher == 'scmp' && inputs.manifest_mode == 'sitemap-wayback' && 'news-raw-scmp-sitemap-wayback' || format('news-raw-{0}-{1}-{2}-{3}', inputs.publisher, inputs.from_year, inputs.to_year, inputs.manifest_mode) }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  ARCHIVE_ROOT: ${{ github.workspace }}/.archive-work
  PUBLISHER: ${{ inputs.publisher }}
  FROM_YEAR: ${{ inputs.from_year }}
  TO_YEAR: ${{ inputs.to_year }}
  MANIFEST_MODE: ${{ inputs.manifest_mode }}
  MAX_DISCOVERY_PAGES: ${{ inputs.max_discovery_pages }}
  MAX_CAPTURES: ${{ inputs.max_captures }}
  DOWNLOAD_WORKERS: ${{ inputs.workers }}
  MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
  MAX_RECORD_ATTEMPTS: "3"

jobs:
  advance:
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r tools/news-archive/requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y rclone
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install rclone coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" \
              >> "$GITHUB_PATH"
          else
            echo "Unsupported runner OS: $RUNNER_OS" >&2
            exit 2
          fi

      - name: Start optional Mihomo archive proxy pool
        shell: bash
        env:
          # Keep the subscription URL in Actions secrets.  The setup script
          # reads it from the environment and never prints or checkpoints it.
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLASH_SUBSCRIPTION_URL:-}" ]; then
            echo "CLASH_SUBSCRIPTION_URL is not configured; using the runner network."
            exit 0
          fi
          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "::warning::The optional Mihomo pool is currently enabled only on Linux; using the runner network."
            exit 0
          fi
          mihomo_version="v1.19.19"
          mihomo_dir="$RUNNER_TEMP/mihomo"
          mkdir -p "$mihomo_dir"
          archive="$mihomo_dir/mihomo.gz"
          binary="$mihomo_dir/mihomo"
          # The pool is only a transport accelerator. A stale node or a
          # transient binary download must not prevent catalog/capture work
          # from continuing on the hosted-runner network.
          if ! (
            set -euo pipefail
            curl -fsSL --retry 4 --retry-delay 2 \
              -o "$archive" \
              "https://github.com/MetaCubeX/mihomo/releases/download/${mihomo_version}/mihomo-linux-amd64-compatible-${mihomo_version}.gz"
            echo "45fbee22e63ec27319573efe1ccc8aa829c3f98c16ffc94a2d5ea86531e358b0  $archive" \
              | sha256sum --check --status -
            gzip -dc "$archive" > "$binary"
            chmod 700 "$binary"
            python tools/news-archive/tools/start_mihomo_proxy.py \
              --mihomo-binary "$binary" \
              --state-dir "$mihomo_dir/state" \
              --github-env "$GITHUB_ENV"
          ); then
            echo "::warning::Optional Mihomo pool unavailable; continuing on the runner network."
          fi

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Resolve archive paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MANIFEST_MODE" = "committed-bloomberg-2020" ]; then
            if [ "$PUBLISHER" != "bloomberg" ] ||
               [ "$FROM_YEAR" != "2020" ] ||
               [ "$TO_YEAR" != "2020" ]; then
              echo "The committed catalog is only valid for Bloomberg 2020." >&2
              exit 2
            fi
          fi
          if [ "$MANIFEST_MODE" = "reuters-sitemap-wayback" ] &&
             [ "$PUBLISHER" != "reuters" ]; then
            echo "reuters-sitemap-wayback is only valid for Reuters." >&2
            exit 2
          fi
          if [ "$MANIFEST_MODE" = "axios-local-sitemap" ] &&
             [ "$PUBLISHER" != "axios" ]; then
            echo "axios-local-sitemap is only valid for Axios." >&2
            exit 2
          fi
          if [ "$MANIFEST_MODE" = "wayback-urlkey" ] &&
             [[ ! "$PUBLISHER" =~ ^(wsj|reuters|axios|npr|nikkei|zaobao|aljazeera|scmp|caixin)$ ]]; then
            echo "wayback-urlkey does not support this publisher." >&2
            exit 2
          fi
          if [ "$MANIFEST_MODE" = "sitemap-wayback" ] &&
             [[ ! "$PUBLISHER" =~ ^(ap|bloomberg|nyt|ft|axios|aljazeera|zaobao|scmp)$ ]]; then
            echo "sitemap-wayback supports AP, Bloomberg, NYT, FT, Axios, Al Jazeera, Zaobao, and SCMP." >&2
            exit 2
          fi
          shard="${PUBLISHER}/${FROM_YEAR}-${TO_YEAR}/${MANIFEST_MODE}"
          local_root="${ARCHIVE_ROOT}/${shard}"
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${shard}"
          mkdir -p "$local_root/catalog" "$local_root/raw"
          {
            echo "shard=$shard"
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Restore discovery and capture checkpoints
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          restore_if_present() {
            remote_file="$1"
            local_file="$2"
            remote_dir="${remote_file%/*}"
            remote_name="${remote_file##*/}"
            listing="$RUNNER_TEMP/rclone-listing.txt"
            errors="$RUNNER_TEMP/rclone-listing-errors.txt"
            if ! rclone lsf "$remote_dir" --files-only >"$listing" 2>"$errors"; then
              if grep -qiE "directory not found|object not found" "$errors"; then
                return 0
              fi
              cat "$errors" >&2
              return 1
            fi
            if grep -Fxq "$remote_name" "$listing"; then
              mkdir -p "$(dirname "$local_file")"
              rclone copyto "$remote_file" "$local_file" \
                --retries 8 --low-level-retries 20
            fi
          }

          restore_if_present \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            "$RUNNER_TEMP/discovery.sqlite3.gz"
          if [ -f "$RUNNER_TEMP/discovery.sqlite3.gz" ]; then
            gzip -dc "$RUNNER_TEMP/discovery.sqlite3.gz" \
              > "$LOCAL_ROOT/catalog/discovery.sqlite3"
          fi

          restore_if_present \
            "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
            "$LOCAL_ROOT/catalog/manifest.jsonl.gz"

          if [ "$MAX_CAPTURES" != "0" ]; then
            restore_if_present \
              "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
              "$RUNNER_TEMP/capture.sqlite3.gz"
            if [ -f "$RUNNER_TEMP/capture.sqlite3.gz" ]; then
              gzip -dc "$RUNNER_TEMP/capture.sqlite3.gz" \
                > "$LOCAL_ROOT/raw/capture.sqlite3"
            fi
          fi

      - name: Advance or select manifest
        id: catalog
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          manifest="$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          if [ "$MANIFEST_MODE" = "committed-bloomberg-2020" ]; then
            cp \
              tools/news-archive/data/bloomberg-2020-archive-manifest.jsonl.gz \
              "$manifest"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "capture_ready=true" >> "$GITHUB_OUTPUT"
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live_catalog_checkpoint() {
            local state="$LOCAL_ROOT/catalog/discovery.sqlite3"
            local checkpoint="$RUNNER_TEMP/discovery-live.sqlite3.gz"
            if [ ! -f "$state" ]; then
              return 0
            fi
            if ! python \
              tools/news-archive/tools/checkpoint_capture_state.py \
              --state "$state" \
              --output "$checkpoint"; then
              echo "::warning::Could not snapshot live discovery state."
              return 0
            fi
            # This is a recovery checkpoint, not the final durable publish.
            # Never let a transient B2 stall suspend the catalog worker.
            if ! timeout 30 rclone copyto \
                "$checkpoint" \
                "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
                --timeout 20s --contimeout 10s \
                --retries 2 --low-level-retries 2; then
              echo "::warning::Live discovery checkpoint upload failed."
              return 0
            fi
            echo "Published live discovery checkpoint."
          }
          run_catalog() {
            if [ "$MAX_DISCOVERY_PAGES" = "0" ]; then
              # A sidecar-only checkpoint refreshes scheduling metadata for
              # an existing manifest without rediscovering URLs or touching
              # raw objects. This is intentionally bounded and resumable.
              if [ ! -s "$manifest" ]; then
                echo "Manifest-sidecar refresh requires an existing manifest." >&2
                return 2
              fi
              echo "complete=true" >> "$GITHUB_OUTPUT"
              echo "capture_ready=true" >> "$GITHUB_OUTPUT"
              echo "should_continue=false" >> "$GITHUB_OUTPUT"
              return 0
            fi
            if [ "$MANIFEST_MODE" = "sitemap-wayback" ]; then
              sitemap_interval=1.0
              if [ "$PUBLISHER" = "scmp" ]; then
                # SCMP's robots.txt requests a ten-second crawl delay. This
                # catalog reads only the official XML sitemap endpoints, but
                # it still follows the publisher's declared request cadence.
                sitemap_interval=10.0
              fi
              python tools/news-archive/tools/build_sitemap_manifest.py \
                --publisher "$PUBLISHER" \
                --from-year "$FROM_YEAR" \
                --to-year "$TO_YEAR" \
                --output "$manifest" \
                --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
                --max-sitemaps "$MAX_DISCOVERY_PAGES" \
                --min-request-interval "$sitemap_interval" \
                --github-output "$GITHUB_OUTPUT"
            elif [ "$MANIFEST_MODE" = "axios-local-sitemap" ]; then
              python tools/news-archive/tools/build_sitemap_manifest.py \
                --publisher axios \
                --source-variant axios-local \
                --from-year "$FROM_YEAR" \
                --to-year "$TO_YEAR" \
                --output "$manifest" \
                --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
                --max-sitemaps "$MAX_DISCOVERY_PAGES" \
                --min-request-interval 0.5 \
                --github-output "$GITHUB_OUTPUT"
            elif [ "$MANIFEST_MODE" = "reuters-sitemap-wayback" ]; then
              python tools/news-archive/tools/build_reuters_sitemap_manifest.py \
                --publisher "$PUBLISHER" \
                --from-year "$FROM_YEAR" \
                --to-year "$TO_YEAR" \
                --output "$manifest" \
                --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
                --max-sitemaps "$MAX_DISCOVERY_PAGES" \
                --min-request-interval 0.5 \
                --github-output "$GITHUB_OUTPUT"
            elif [ "$MANIFEST_MODE" = "wayback-urlkey" ]; then
              wayback_page_limit=2000
              discovery_interval=1.0
              if [ "$PUBLISHER" = "wsj" ] &&
                 [ "$FROM_YEAR" -le 2013 ]; then
                # The legacy online.wsj.com query is extremely broad. Smaller
                # resumable pages avoid multi-minute 200 responses that CDX
                # proxies sometimes truncate before the resume key.
                wayback_page_limit=250
              fi
              if [ "$PUBLISHER" = "wsj" ] &&
                 [ "$MAX_CAPTURES" = "0" ]; then
                # Infini-News calls are globally rate limited across workers.
                # Two metadata requests per second stayed stable in probes
                # and halves catalog-only latency without changing capture
                # traffic.
                discovery_interval=0.5
              fi
              wayback_catalog_args=()
              if [ "$MAX_CAPTURES" = "0" ]; then
                # A catalog-only run exists to expand independent holdout
                # capacity. Reaching the smaller capture-ready threshold must
                # not pause CDX while unresolved discovery queries remain.
                wayback_catalog_args+=(--continue-after-capture-ready)
              fi
              # A timed-out CDX page remains resumable in discovery state;
              # retry it in a later bounded run instead of holding a scarce
              # runner slot for the command defaults (90 seconds x 6).
              python tools/news-archive/tools/build_wayback_manifest.py \
                --publisher "$PUBLISHER" \
                --from-year "$FROM_YEAR" \
                --to-year "$TO_YEAR" \
                --output "$manifest" \
                --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
                --page-limit "$wayback_page_limit" \
                --max-pages "$MAX_DISCOVERY_PAGES" \
                --min-request-interval "$discovery_interval" \
                --timeout 30 \
                --attempts 2 \
                --collapse urlkey \
                --reset-incompatible-state \
                "${wayback_catalog_args[@]}" \
                --github-output "$GITHUB_OUTPUT"
            else
              python tools/news-archive/tools/build_wayback_manifest.py \
                --publisher "$PUBLISHER" \
                --from-year "$FROM_YEAR" \
                --to-year "$TO_YEAR" \
                --output "$manifest" \
                --state "$LOCAL_ROOT/catalog/discovery.sqlite3" \
                --page-limit 2000 \
                --max-pages "$MAX_DISCOVERY_PAGES" \
                --min-request-interval 1.0 \
                --reset-incompatible-state \
                --github-output "$GITHUB_OUTPUT"
            fi
          }
          set +e
          run_catalog &
          catalog_pid=$!
          while kill -0 "$catalog_pid" 2>/dev/null; do
            timeout 600 tail --pid="$catalog_pid" -f /dev/null
            wait_code=$?
            if [ "$wait_code" -eq 124 ]; then
              live_catalog_checkpoint
            else
              break
            fi
          done
          wait "$catalog_pid"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Merge Common Crawl supplemental manifest
        if: >-
          ${{
            (inputs.publisher == 'npr' ||
             inputs.publisher == 'axios' ||
             inputs.publisher == 'nikkei' ||
             inputs.publisher == 'reuters' ||
             inputs.publisher == 'scmp' ||
             inputs.publisher == 'caixin') &&
            inputs.manifest_mode == 'wayback-urlkey' ||
            (inputs.publisher == 'aljazeera' &&
             inputs.manifest_mode == 'sitemap-wayback')
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          supplemental_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/${PUBLISHER}/${FROM_YEAR}-${TO_YEAR}/commoncrawl-prefix"
          supplemental="$RUNNER_TEMP/common-crawl-manifest.jsonl.gz"
          merged="$RUNNER_TEMP/common-crawl-merged-manifest.jsonl.gz"
          if rclone lsf "${supplemental_root}/catalog" --files-only \
              | grep -Fxq "manifest.jsonl.gz"; then
            rclone copyto \
              "${supplemental_root}/catalog/manifest.jsonl.gz" \
              "$supplemental" \
              --retries 8 --low-level-retries 20
            python tools/news-archive/tools/merge_archive_manifests.py \
              --publisher "$PUBLISHER" \
              --input "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              --input "$supplemental" \
              --output "$merged"
            mv "$merged" "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          else
            echo "::notice::No ${PUBLISHER} Common Crawl supplemental manifest yet."
          fi

      - name: Merge AP legacy supplemental manifest
        if: >-
          ${{
            inputs.publisher == 'ap' &&
            inputs.manifest_mode == 'sitemap-wayback'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          supplemental_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/ap/${FROM_YEAR}-${TO_YEAR}/legacy-archive"
          supplemental="$RUNNER_TEMP/ap-legacy-manifest.jsonl.gz"
          merged="$RUNNER_TEMP/ap-merged-manifest.jsonl.gz"
          wayback_yahoo="$RUNNER_TEMP/ap-wayback-yahoo-manifest.jsonl.gz"
          wayback_yahoo_merged="$RUNNER_TEMP/ap-wayback-yahoo-merged-manifest.jsonl.gz"
          wayback_bigstory="$RUNNER_TEMP/ap-wayback-bigstory-manifest.jsonl.gz"
          wayback_bigstory_merged="$RUNNER_TEMP/ap-wayback-bigstory-merged-manifest.jsonl.gz"
          if rclone lsf "${supplemental_root}/catalog" --files-only \
              | grep -Fxq "manifest.jsonl.gz"; then
            rclone copyto \
              "${supplemental_root}/catalog/manifest.jsonl.gz" \
              "$supplemental" \
              --retries 8 --low-level-retries 20
            python tools/news-archive/tools/merge_archive_manifests.py \
              --publisher ap \
              --input "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              --input "$supplemental" \
              --output "$merged"
            mv "$merged" "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          else
            echo "::notice::No AP legacy supplemental manifest yet."
          fi
          if rclone lsf "${supplemental_root}/catalog" --files-only \
              | grep -Fxq "wayback-yahoo-manifest.jsonl.gz"; then
            rclone copyto \
              "${supplemental_root}/catalog/wayback-yahoo-manifest.jsonl.gz" \
              "$wayback_yahoo" \
              --retries 8 --low-level-retries 20
            python tools/news-archive/tools/merge_archive_manifests.py \
              --publisher ap \
              --input "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              --input "$wayback_yahoo" \
              --output "$wayback_yahoo_merged"
            mv "$wayback_yahoo_merged" "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          else
            echo "::notice::No AP Wayback Yahoo supplemental manifest yet."
          fi
          if rclone lsf "${supplemental_root}/catalog" --files-only \
              | grep -Fxq "wayback-bigstory-manifest.jsonl.gz"; then
            rclone copyto \
              "${supplemental_root}/catalog/wayback-bigstory-manifest.jsonl.gz" \
              "$wayback_bigstory" \
              --retries 8 --low-level-retries 20
            python tools/news-archive/tools/merge_archive_manifests.py \
              --publisher ap \
              --input "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              --input "$wayback_bigstory" \
              --output "$wayback_bigstory_merged"
            mv "$wayback_bigstory_merged" "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
          else
            echo "::notice::No AP Wayback Big Story supplemental manifest yet."
          fi

      - name: Summarize final capture manifest
        if: >-
          ${{
            !cancelled() &&
            hashFiles('.archive-work/**/catalog/manifest.jsonl.gz') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
            --publisher "$PUBLISHER" \
            --output "$LOCAL_ROOT/catalog/manifest-summary.json"

      - name: Write source catalog completion status
        if: >-
          ${{
            !cancelled() &&
            inputs.manifest_mode != 'committed-bloomberg-2020' &&
            steps.catalog.outputs.exit_code == '0' &&
            hashFiles('.archive-work/**/catalog/manifest.jsonl.gz') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python tools/news-archive/tools/write_source_catalog_status.py \
            --publisher "$PUBLISHER" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --manifest-mode "$MANIFEST_MODE" \
            --complete "${{ steps.catalog.outputs.complete }}" \
            --capture-ready "${{ steps.catalog.outputs.capture_ready }}" \
            --should-continue "${{ steps.catalog.outputs.should_continue }}" \
            --output "$LOCAL_ROOT/catalog/status.json"

      - name: Checkpoint discovery
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.manifest_mode != 'committed-bloomberg-2020' &&
            hashFiles('.archive-work/**/catalog/discovery.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path(os.environ["LOCAL_ROOT"]) / "catalog" / "discovery.sqlite3"
          connection = sqlite3.connect(path, timeout=60)
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          PY
          gzip -9 -c "$LOCAL_ROOT/catalog/discovery.sqlite3" \
            > "$RUNNER_TEMP/discovery.sqlite3.gz"

      - name: Publish discovery checkpoint and manifest
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.manifest_mode != 'committed-bloomberg-2020' &&
            hashFiles('.archive-work/**/catalog/discovery.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if [ -f "$LOCAL_ROOT/catalog/manifest.jsonl.gz" ]; then
            rclone copyto \
              "$LOCAL_ROOT/catalog/manifest.jsonl.gz" \
              "${REMOTE_ROOT}/catalog/manifest.jsonl.gz" \
              --retries 8 --low-level-retries 20
          fi
          if [ -f "$LOCAL_ROOT/catalog/manifest-summary.json" ]; then
            rclone copyto \
              "$LOCAL_ROOT/catalog/manifest-summary.json" \
              "${REMOTE_ROOT}/catalog/manifest-summary.json" \
              --retries 8 --low-level-retries 20
          fi
          if [ -f "$LOCAL_ROOT/catalog/status.json" ]; then
            rclone copyto \
              "$LOCAL_ROOT/catalog/status.json" \
              "${REMOTE_ROOT}/catalog/status.json" \
              --retries 8 --low-level-retries 20
          fi
          rclone copyto \
            "$RUNNER_TEMP/discovery.sqlite3.gz" \
            "${REMOTE_ROOT}/catalog/discovery.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Plan capture batch
        id: before
        if: >-
          ${{
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            )
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          args=(
            --state "$LOCAL_ROOT/raw/capture.sqlite3"
            --max-record-attempts "$MAX_RECORD_ATTEMPTS"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "${{ inputs.stop_when_validation_ready }}" = "true" ]; then
            args+=(--stop-at-validation-target)
          fi
          python tools/news-archive/tools/capture_action_state.py "${args[@]}"

      - name: Plan replay of previously captured parser samples
        id: validation_replay
        if: >-
          ${{
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            )
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python \
            tools/news-archive/tools/prepare_parser_validation_replay.py \
            --publisher "$PUBLISHER" \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --target-per-year 800 \
            --max-record-attempts "$MAX_RECORD_ATTEMPTS" \
            --max-replays 2000 \
            --files-from "$RUNNER_TEMP/parser-validation-files.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore previously captured parser sample HTML
        if: >-
          ${{
            inputs.max_captures != '0' &&
            steps.validation_replay.outputs.replays != '0'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          rclone copy \
            "${REMOTE_ROOT}/raw" \
            "$LOCAL_ROOT/raw" \
            --files-from "$RUNNER_TEMP/parser-validation-files.txt" \
            --transfers 16 --checkers 32 \
            --retries 8 --low-level-retries 20 \
            --stats 30s

      - name: Replay current parser against restored sample HTML
        if: >-
          ${{
            inputs.max_captures != '0' &&
            steps.validation_replay.outputs.replays != '0'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          python tools/news-archive/tools/revalidate_parser_samples.py \
            --publisher "$PUBLISHER" \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --archive-root "$LOCAL_ROOT/raw" \
            --max-replays 2000 \
            --progress-every 50 \
            --summary "$LOCAL_ROOT/raw/summary.json"

      - name: Publish parser validation replay checkpoint
        if: >-
          ${{
            inputs.max_captures != '0' &&
            steps.validation_replay.outputs.replays != '0'
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          python tools/news-archive/tools/checkpoint_capture_state.py \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --output "$RUNNER_TEMP/parser-replay.sqlite3.gz"
          rclone copyto \
            "$LOCAL_ROOT/raw/summary.json" \
            "${REMOTE_ROOT}/state/summary.json" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$RUNNER_TEMP/parser-replay.sqlite3.gz" \
            "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Capture bounded raw HTML batch
        id: capture
        if: >-
          ${{
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            (
              !inputs.stop_when_validation_ready ||
              steps.before.outputs.validation_target_reached != 'true' ||
              steps.validation_replay.outputs.replays != '0'
            )
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -uo pipefail
          live_checkpoint() {
            local checkpoint="$RUNNER_TEMP/capture-live.sqlite3.gz"
            if ! python \
              tools/news-archive/tools/checkpoint_capture_state.py \
              --state "$LOCAL_ROOT/raw/capture.sqlite3" \
              --output "$checkpoint"; then
              echo "::warning::Could not snapshot live capture state."
              return 0
            fi
            if [ -d "$LOCAL_ROOT/raw/objects" ]; then
              # Periodic recovery uploads must be bounded: the final publish
              # keeps the full retry budget once this capture batch exits.
              if ! timeout 120 rclone copy \
                  "$LOCAL_ROOT/raw/objects" \
                  "${REMOTE_ROOT}/raw/objects" \
                  --exclude '*.tmp' \
                  --checksum --ignore-existing --fast-list \
                  --transfers 32 --checkers 64 \
                  --timeout 30s --contimeout 10s \
                  --retries 2 --low-level-retries 2; then
                echo "::warning::Live object upload failed; state withheld."
                return 0
              fi
            fi
            if [ -d "$LOCAL_ROOT/raw/records" ]; then
              # Records are URL-addressed and may change after a bad capture
              # is requeued; B2 keeps prior object versions for recovery.
              if ! timeout 120 rclone copy \
                  "$LOCAL_ROOT/raw/records" \
                  "${REMOTE_ROOT}/raw/records" \
                  --exclude '*.tmp' \
                  --checksum --fast-list \
                  --transfers 32 --checkers 64 \
                  --timeout 30s --contimeout 10s \
                  --retries 2 --low-level-retries 2; then
                echo "::warning::Live record upload failed; state withheld."
                return 0
              fi
            fi
            if [ -f "$LOCAL_ROOT/raw/summary.json" ]; then
              if ! timeout 30 rclone copyto \
                "$LOCAL_ROOT/raw/summary.json" \
                "${REMOTE_ROOT}/state/summary.json" \
                --timeout 20s --contimeout 10s \
                --retries 2 --low-level-retries 2; then
                echo "::warning::Live capture summary upload timed out."
              fi
            fi
            gzip -dc "$checkpoint" \
              > "$RUNNER_TEMP/capture-live.sqlite3"
            python \
              tools/news-archive/tools/export_completed_capture_index.py \
              --state "$RUNNER_TEMP/capture-live.sqlite3" \
              --output "$RUNNER_TEMP/completed-captures.sqlite3"
            gzip -9 -c "$RUNNER_TEMP/completed-captures.sqlite3" \
              > "$RUNNER_TEMP/completed-captures.sqlite3.gz"
            if ! timeout 30 rclone copyto \
              "$RUNNER_TEMP/completed-captures.sqlite3.gz" \
              "${REMOTE_ROOT}/state/completed-captures.sqlite3.gz" \
              --timeout 20s --contimeout 10s \
              --retries 2 --low-level-retries 2; then
              echo "::warning::Live completed-capture index upload timed out."
              return 0
            fi
            # The snapshot was taken before object upload and is published
            # last, so every capture it references is already durable.
            if ! timeout 30 rclone copyto \
              "$checkpoint" \
              "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
              --timeout 20s --contimeout 10s \
              --retries 2 --low-level-retries 2; then
              echo "::warning::Live capture-state upload timed out."
              return 0
            fi
            echo "Published live capture checkpoint."
          }
          request_interval=0.5
          if [ "$PUBLISHER" = "nyt" ]; then
            # Shared GitHub runner addresses are frequently throttled by
            # Wayback. A slower global cadence produces more usable captures
            # than parallel 403 responses and repeated timemap failures.
            request_interval=1.5
          fi
          capture_workers="$DOWNLOAD_WORKERS"
          if [ -n "${ARCHIVE_HTTP_PROXY:-}" ] && [ "$capture_workers" -lt 8 ]; then
            # Eight bounded connections are enough to hide proxy/archive
            # latency while the ArchiveClient's global cadence remains in
            # force.  Do not turn the node pool into an unbounded fan-out.
            capture_workers=8
          fi
          args=(
            --publisher "$PUBLISHER"
            --manifest "$LOCAL_ROOT/catalog/manifest.jsonl.gz"
            --output-dir "$LOCAL_ROOT/raw"
            --workers "$capture_workers"
            --min-request-interval "$request_interval"
            --max-captures "$MAX_CAPTURES"
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"
            --max-record-attempts "$MAX_RECORD_ATTEMPTS"
            --validation-sample-per-year 800
            --validation-from-year "$FROM_YEAR"
            --validation-to-year "$TO_YEAR"
            --progress-every 25
            --minimum-free-gb 2
          )
          if [ "${{ steps.before.outputs.retry_errors }}" = "true" ]; then
            args+=(--retry-errors)
          fi
          if [ "$PUBLISHER" = "ft" ]; then
            args+=(
              --enable-arquivo-pt-fallback
              --enable-common-crawl-fallback
              --ft-syndication-catalog \
              "$LOCAL_ROOT/catalog/discovery.sqlite3"
            )
          fi
          if [ "${{ inputs.stop_when_validation_ready }}" = "true" ]; then
            args+=(
              --stop-when-validation-ready
              --stop-when-validation-target-reached
            )
          fi
          set +e
          python tools/news-archive/tools/capture_archive_batch.py "${args[@]}" &
          capture_pid=$!
          while kill -0 "$capture_pid" 2>/dev/null; do
            timeout 600 tail --pid="$capture_pid" -f /dev/null
            wait_code=$?
            if [ "$wait_code" -eq 124 ]; then
              live_checkpoint
            else
              break
            fi
          done
          wait "$capture_pid"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkpoint capture state
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path(os.environ["LOCAL_ROOT"]) / "raw" / "capture.sqlite3"
          connection = sqlite3.connect(path, timeout=60)
          connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          connection.close()
          PY
          gzip -9 -c "$LOCAL_ROOT/raw/capture.sqlite3" \
            > "$RUNNER_TEMP/capture.sqlite3.gz"
          python tools/news-archive/tools/export_completed_capture_index.py \
            --state "$LOCAL_ROOT/raw/capture.sqlite3" \
            --output "$RUNNER_TEMP/completed-captures.sqlite3"
          gzip -9 -c "$RUNNER_TEMP/completed-captures.sqlite3" \
            > "$RUNNER_TEMP/completed-captures.sqlite3.gz"

      - name: Publish raw objects, records, and capture checkpoint
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          if [ -d "$LOCAL_ROOT/raw/objects" ]; then
            rclone copy \
              "$LOCAL_ROOT/raw/objects" \
              "${REMOTE_ROOT}/raw/objects" \
              --exclude '*.tmp' \
              --checksum --ignore-existing --fast-list \
              --transfers 32 --checkers 64 \
              --retries 8 --low-level-retries 20 \
              --stats 30s
          fi
          if [ -d "$LOCAL_ROOT/raw/records" ]; then
            # Records are URL-addressed and intentionally replaceable after
            # recapture; raw HTML objects above remain content-addressed.
            rclone copy \
              "$LOCAL_ROOT/raw/records" \
              "${REMOTE_ROOT}/raw/records" \
              --exclude '*.tmp' \
              --checksum --fast-list \
              --transfers 32 --checkers 64 \
              --retries 8 --low-level-retries 20 \
              --stats 30s
          fi
          if [ -f "$LOCAL_ROOT/raw/summary.json" ]; then
            rclone copyto \
              "$LOCAL_ROOT/raw/summary.json" \
              "${REMOTE_ROOT}/state/summary.json" \
              --retries 8 --low-level-retries 20
          fi
          rclone copyto \
            "$RUNNER_TEMP/completed-captures.sqlite3.gz" \
            "${REMOTE_ROOT}/state/completed-captures.sqlite3.gz" \
            --retries 8 --low-level-retries 20
          # Publish state last so it never references objects absent from B2.
          rclone copyto \
            "$RUNNER_TEMP/capture.sqlite3.gz" \
            "${REMOTE_ROOT}/state/capture.sqlite3.gz" \
            --retries 8 --low-level-retries 20

      - name: Report remaining capture work
        id: after
        if: >-
          ${{
            always() &&
            !cancelled() &&
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            hashFiles('.archive-work/**/raw/capture.sqlite3') != ''
          }}
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          args=(
            --state "$LOCAL_ROOT/raw/capture.sqlite3"
            --max-record-attempts "$MAX_RECORD_ATTEMPTS"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "${{ inputs.stop_when_validation_ready }}" = "true" ]; then
            args+=(--stop-at-validation-target)
          fi
          python tools/news-archive/tools/capture_action_state.py "${args[@]}"

      - name: Dispatch next bounded run
        if: >-
          ${{
            inputs.auto_continue &&
            (
              !inputs.stop_when_validation_ready ||
              (
                steps.after.outputs.validation_ready != 'true' &&
                steps.after.outputs.validation_target_reached != 'true'
              )
            ) &&
            steps.catalog.outputs.exit_code == '0' &&
            (
              steps.catalog.outputs.should_continue == 'true' ||
              (
                steps.capture.outputs.exit_code == '0' &&
                steps.after.outputs.should_continue == 'true'
              )
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next_discovery_pages="$MAX_DISCOVERY_PAGES"
          actionable="${{ steps.after.outputs.actionable }}"
          if [[ "$actionable" =~ ^[1-9][0-9]*$ ]]; then
            next_discovery_pages=0
            echo "Draining $actionable actionable captures before expanding discovery."
          fi
          # The WSJ legacy catalog has tens of thousands of accepted URLs but
          # a long tail of paginated CDX queries. Ten-page catalog-only runs
          # spend more time reinstalling dependencies and checkpointing than
          # advancing discovery. Once a legacy continuation is already known
          # to be necessary, let one bounded runner drain up to 500 pages.
          if [ "$PUBLISHER" = "wsj" ] && \
             [ "$FROM_YEAR" = "2010" ] && \
             [ "$TO_YEAR" = "2015" ] && \
             [ "$MANIFEST_MODE" = "wayback-urlkey" ] && \
             [ "$MAX_CAPTURES" = "0" ]; then
            next_discovery_pages=500
            echo "Batching the legacy WSJ catalog tail into a 500-page continuation."
          fi

          for attempt in 1 2 3 4 5; do
            if gh workflow run news-raw-archive.yml \
              --ref "$GITHUB_REF_NAME" \
              -f publisher="$PUBLISHER" \
              -f from_year="$FROM_YEAR" \
              -f to_year="$TO_YEAR" \
              -f manifest_mode="$MANIFEST_MODE" \
              -f max_discovery_pages="$next_discovery_pages" \
              -f max_captures="$MAX_CAPTURES" \
              -f workers="$DOWNLOAD_WORKERS" \
              -f max_runtime_minutes="$MAX_RUNTIME_MINUTES" \
              -f auto_continue=true \
              -f stop_when_validation_ready="${{ inputs.stop_when_validation_ready }}" \
              -f runner_os="${{ inputs.runner_os }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::Archive continuation dispatch failed; retrying ($attempt/5)."
              sleep $((attempt * 5))
            fi
          done
          echo "Unable to dispatch the next archive batch after 5 attempts." >&2
          exit 1

      - name: Wake parser validation watchdog
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/kick-parser-watchdog.sh

      - name: Propagate capture failure after checkpoint
        if: >-
          ${{
            inputs.max_captures != '0' &&
            (
              steps.catalog.outputs.complete == 'true' ||
              steps.catalog.outputs.capture_ready == 'true'
            ) &&
            steps.capture.outputs.exit_code != '0'
          }}
        run: |
          echo "Capture process exited with code ${{ steps.capture.outputs.exit_code }}." >&2
          exit 1

      - name: Propagate discovery failure after checkpoint
        if: ${{ steps.catalog.outputs.exit_code != '0' }}
        run: |
          echo "Manifest discovery exited with code ${{ steps.catalog.outputs.exit_code }}." >&2
          exit 1

      - name: Stop optional Mihomo archive proxy pool
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -n "${MIHOMO_PID_FILE:-}" ] && [ -f "$MIHOMO_PID_FILE" ]; then
            pid="$(cat "$MIHOMO_PID_FILE")"
            kill "$pid" 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$pid" 2>/dev/null || true
          fi
          if [ -n "${MIHOMO_STATE_DIR:-}" ]; then
            rm -rf "$MIHOMO_STATE_DIR"
          fi
