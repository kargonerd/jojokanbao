name: AP Wayback Yahoo catalog

run-name: >-
  ap-wayback-yahoo-${{ inputs.from_year }}-${{ inputs.to_year }}

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "First AP publication year to discover."
        required: true
        default: "2010"
        type: string
      to_year:
        description: "Last AP publication year to discover."
        required: true
        default: "2012"
        type: string
      limit_per_month:
        description: "Fail-closed CDX result ceiling for each month."
        required: true
        default: "100000"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ap-wayback-yahoo-${{ inputs.from_year }}-${{ inputs.to_year }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  B2_ARCHIVE_KEY_ID: ${{ secrets.B2_ARCHIVE_KEY_ID }}
  B2_ARCHIVE_APPLICATION_KEY: ${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}
  B2_ARCHIVE_BUCKET: ${{ secrets.B2_ARCHIVE_BUCKET }}
  B2_REMOTE: jojo-b2
  FROM_YEAR: ${{ inputs.from_year }}
  TO_YEAR: ${{ inputs.to_year }}
  LIMIT_PER_MONTH: ${{ inputs.limit_per_month }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tools/news-archive/requirements.txt

      - name: Install archive dependencies
        run: |
          python -m pip install -r tools/news-archive/requirements.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Validate private B2 storage
        run: |
          python tools/news-archive/tools/verify_b2_private_bucket.py
          rclone config create "$B2_REMOTE" b2 \
            account "$B2_ARCHIVE_KEY_ID" \
            key "$B2_ARCHIVE_APPLICATION_KEY" \
            --non-interactive

      - name: Resolve catalog paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$FROM_YEAR" =~ ^20[0-9]{2}$ ]] ||
             ! [[ "$TO_YEAR" =~ ^20[0-9]{2}$ ]] ||
             [ "$FROM_YEAR" -gt "$TO_YEAR" ]; then
            echo "Invalid AP publication window." >&2
            exit 2
          fi
          if ! [[ "$LIMIT_PER_MONTH" =~ ^[1-9][0-9]*$ ]]; then
            echo "limit_per_month must be positive." >&2
            exit 2
          fi
          local_root="$RUNNER_TEMP/ap-wayback-yahoo-${FROM_YEAR}-${TO_YEAR}"
          # The validation accelerator merges AP legacy supplements from the
          # canonical 2010-2015 source window. Keep the output there even when
          # a bounded discovery run covers only 2010-2012; publishing under a
          # literal input-year range would make the catalog invisible to the
          # zero-overlap validator.
          remote_root="${B2_REMOTE}:${B2_ARCHIVE_BUCKET}/news-archive/v1/ap/2010-2015/legacy-archive"
          mkdir -p "$local_root/catalog" "$local_root/state"
          {
            echo "local_root=$local_root"
            echo "remote_root=$remote_root"
          } >> "$GITHUB_OUTPUT"

      - name: Build Wayback Yahoo AP supplemental manifest
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          set -euo pipefail
          python tools/news-archive/tools/build_ap_wayback_yahoo_manifest.py \
            --output "$LOCAL_ROOT/catalog/wayback-yahoo-manifest.jsonl.gz" \
            --from-year "$FROM_YEAR" \
            --to-year "$TO_YEAR" \
            --limit "$LIMIT_PER_MONTH" \
            --maximum-candidates 3 \
            --attempts 5 \
            --min-request-interval 1 \
            --timeout 180 \
            | tee "$LOCAL_ROOT/state/wayback-yahoo-summary.log"
          tail -n 1 "$LOCAL_ROOT/state/wayback-yahoo-summary.log" \
            > "$LOCAL_ROOT/state/wayback-yahoo-summary.json"
          gzip -t "$LOCAL_ROOT/catalog/wayback-yahoo-manifest.jsonl.gz"
          test -s "$LOCAL_ROOT/catalog/wayback-yahoo-manifest.jsonl.gz"
          python tools/news-archive/tools/summarize_archive_manifest.py \
            --manifest "$LOCAL_ROOT/catalog/wayback-yahoo-manifest.jsonl.gz" \
            --publisher ap \
            --output "$LOCAL_ROOT/catalog/wayback-yahoo-manifest-summary.json"

      - name: Publish manifest and summary
        shell: bash
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
          REMOTE_ROOT: ${{ steps.paths.outputs.remote_root }}
        run: |
          set -euo pipefail
          rclone copyto \
            "$LOCAL_ROOT/catalog/wayback-yahoo-manifest.jsonl.gz" \
            "${REMOTE_ROOT}/catalog/wayback-yahoo-manifest.jsonl.gz" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/catalog/wayback-yahoo-manifest-summary.json" \
            "${REMOTE_ROOT}/catalog/wayback-yahoo-manifest-summary.json" \
            --retries 8 --low-level-retries 20
          rclone copyto \
            "$LOCAL_ROOT/state/wayback-yahoo-summary.json" \
            "${REMOTE_ROOT}/state/wayback-yahoo-summary.json" \
            --retries 8 --low-level-retries 20

      - name: Report catalog result
        env:
          LOCAL_ROOT: ${{ steps.paths.outputs.local_root }}
        run: |
          {
            echo "### AP Wayback Yahoo catalog"
            echo
            echo '```json'
            cat "$LOCAL_ROOT/state/wayback-yahoo-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
